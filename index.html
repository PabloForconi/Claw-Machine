<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claw Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1b1430; --ink: #fff6e0; --pink: #e8457a; --pink-dark: #8a1f48; --gold: #ffd23f; --panel: #2b1850; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #2e2150, var(--bg) 70%);
    color: var(--ink); font-family: Kalam, "Comic Sans MS", cursive; font-weight: 700;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px; }
  canvas { display: block; }
  #controls { display: flex; gap: 12px; }
  #controls button {
    font: inherit; color: var(--ink); background: var(--pink); border: 4px solid var(--pink-dark);
    border-radius: 18px; padding: 8px 22px; font-size: 26px; min-width: 72px; cursor: pointer;
    box-shadow: 0 5px 0 var(--pink-dark);
  }
  #controls button:active, #controls button.on { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-dark); }
  #controls #bd { background: var(--gold); color: #3a1f00; border-color: #a8740a; box-shadow: 0 5px 0 #a8740a; min-width: 150px; }
  #over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 5, 25, .65); padding: 16px; }
  .card { background: var(--panel); border: 5px solid var(--gold); border-radius: 22px; padding: 22px 30px; text-align: center; max-width: 360px; width: 100%; }
  .card h2 { margin: 0 0 8px; font-size: 34px; color: var(--gold); }
  .card p { margin: 0 0 18px; font-size: 22px; line-height: 1.4; }
  .card button { font: inherit; font-size: 24px; color: #3a1f00; background: var(--gold); border: 4px solid #a8740a; border-radius: 16px; padding: 8px 24px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="controls">
    <button id="bl" aria-label="Izquierda">◀</button>
    <button id="bd">¡BAJAR!</button>
    <button id="br" aria-label="Derecha">▶</button>
  </div>
</div>
<div id="over" hidden>
  <div class="card">
    <h2>¡Sin fichas!</h2>
    <p id="ovStats"></p>
    <button id="again">Jugar de nuevo</button>
  </div>
</div>
<script>
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

// Logical canvas size; everything is drawn in these units and scaled to fit
const W = 480, H = 760;
const BOX = { l: 28, r: 452, t: 96, b: 630 };      // glass interior
const CHUTE = { r: 132, top: 450 };                // prize hole between BOX.l and CHUTE.r
const RAIL_Y = 112, HOME_X = (BOX.l + CHUTE.r) / 2;
const CLAW_MIN = BOX.l + 40, CLAW_MAX = BOX.r - 40;
const G = 1400, STEP = 1 / 120;
const MOVE = 170, DROP = 260, LIFT = 190;
const AIM_TIME = 15, START_COINS = 10, PRIZE_COUNT = 20;
const COLORS = ['#ff5d8f', '#4cc9f0', '#80ed99', '#b388ff', '#ff9f43'];
const BEST_KEY = 'clawMachine.best';

let prizes, claw, coins, score, won, state, aimT, pops, best = 0;
const keys = { l: false, r: false };

try { best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const headY = () => RAIL_Y + 18 + claw.len;

function mkPrize(x, y) {
  const rare = Math.random() < 0.12;
  return {
    x, y, vx: (Math.random() - .5) * 40, vy: 0, r: rare ? 22 : 23 + Math.random() * 6, rare,
    col: rare ? '#ffd23f' : COLORS[Math.random() * COLORS.length | 0], rot: Math.random() * 6.28, held: false,
  };
}

function spawn(n, y0) {
  for (let i = 0; i < n; i++) prizes.push(mkPrize(CHUTE.r + 40 + Math.random() * (BOX.r - CHUTE.r - 70), y0 - i * 40));
}

function reset() {
  prizes = [];
  claw = { x: HOME_X, len: 0, open: 1, held: null, q: 0, ox: 0, oy: 0, t: 0 };
  state = 'idle'; coins = START_COINS; score = 0; won = 0; pops = [];
  spawn(PRIZE_COUNT, BOX.t + 20);
  for (let i = 0; i < 900; i++) physics(STEP, true);   // let the pile settle before showing it
  document.getElementById('over').hidden = true;
}

// ---------- Physics: circles with gravity, walls, the chute wall and the claw as kinematic circles ----------

function rot(px, py, a) { const c = Math.cos(a), s = Math.sin(a); return [px * c - py * s, px * s + py * c]; }

// Each finger is pivot → knee → tip; open (0..1) swings them outwards
function fingers() {
  const hy = headY(), a = claw.open * 0.85, out = [];
  for (const sd of [-1, 1]) {
    const th = -sd * a, k = rot(14 * sd, 16, th), t = rot(-6 * sd, 40, th);
    const px = claw.x + 9 * sd, py = hy + 8;
    out.push({ px, py, kx: px + k[0], ky: py + k[1], tx: px + t[0], ty: py + t[1] });
  }
  return out;
}

function colliders() {
  const out = [{ x: claw.x, y: headY(), r: 14 }];
  for (const f of fingers()) {
    out.push({ x: f.kx, y: f.ky, r: 6 }, { x: f.tx, y: f.ty, r: 6 }, { x: (f.px + f.kx) / 2, y: (f.py + f.ky) / 2, r: 6 });
  }
  return out;
}

function collide(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
  if (d >= m || d === 0) return;
  const wa = a.held ? 0 : 1, wb = b.held ? 0 : 1, ws = wa + wb;
  if (!ws) return;
  const nx = dx / d, ny = dy / d, p = m - d;
  a.x -= nx * p * wa / ws; a.y -= ny * p * wa / ws;
  b.x += nx * p * wb / ws; b.y += ny * p * wb / ws;
  const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (rv < 0) {
    const j = -1.2 * rv / ws;
    a.vx -= j * nx * wa; a.vy -= j * ny * wa;
    b.vx += j * nx * wb; b.vy += j * ny * wb;
  }
}

function pushOut(p, kx, ky, kr) {
  const dx = p.x - kx, dy = p.y - ky, d = Math.hypot(dx, dy), m = p.r + kr;
  if (d >= m) return;
  const nx = d ? dx / d : 0, ny = d ? dy / d : -1;
  p.x = kx + nx * m; p.y = ky + ny * m;
  const vn = p.vx * nx + p.vy * ny;
  if (vn < 0) { p.vx -= vn * nx; p.vy -= vn * ny; }
}

function bounds(p) {
  if (p.x - p.r < BOX.l) { p.x = BOX.l + p.r; if (p.vx < 0) p.vx *= -0.3; }
  if (p.x + p.r > BOX.r) { p.x = BOX.r - p.r; if (p.vx > 0) p.vx *= -0.3; }
  // The floor only exists outside the chute
  if (p.x > CHUTE.r && p.y + p.r > BOX.b) { p.y = BOX.b - p.r; if (p.vy > 0) p.vy *= -0.2; p.vx *= 0.96; }
  // Chute wall: a 10 px post from CHUTE.top downwards
  const cx = clamp(p.x, CHUTE.r - 5, CHUTE.r + 5), cy = Math.max(CHUTE.top, p.y);
  const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy);
  if (d < p.r) {
    const nx = d ? dx / d : (p.x < CHUTE.r ? -1 : 1), ny = d ? dy / d : 0;
    p.x = cx + nx * p.r; p.y = cy + ny * p.r;
    const vn = p.vx * nx + p.vy * ny;
    if (vn < 0) { p.vx -= 1.3 * vn * nx; p.vy -= 1.3 * vn * ny; }
  }
}

function physics(dt, settling) {
  for (const p of prizes) {
    if (p.held) continue;
    p.vy += G * dt; p.vx *= 0.998;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vx * dt / p.r;
  }
  const kin = settling ? [] : colliders();
  for (let it = 0; it < 3; it++) {
    for (let i = 0; i < prizes.length; i++) {
      const a = prizes[i];
      for (let j = i + 1; j < prizes.length; j++) collide(a, prizes[j]);
      if (!a.held) { for (const k of kin) pushOut(a, k.x, k.y, k.r); bounds(a); }
    }
  }
  for (let i = prizes.length - 1; i >= 0; i--) {
    const p = prizes[i];
    if (!p.held && p.x < CHUTE.r && p.y - p.r > BOX.b + 6) { prizes.splice(i, 1); if (!settling) win(p); }
  }
}

// ---------- Game flow ----------

function startRound() {
  if (state !== 'idle' || coins <= 0) return;
  coins--; state = 'aim'; aimT = AIM_TIME; sfx('coin');
}

function startDrop() {
  if (state !== 'aim') return;
  state = 'drop'; keys.l = keys.r = false; sfx('drop');
}

// The prize the claw closes on: centred under the head and between the fingers
function pickGrab() {
  const hy = headY();
  let pick = null, bd = 1e9;
  for (const p of prizes) {
    const dx = Math.abs(p.x - claw.x);
    if (dx < p.r * 0.8 && p.y > hy && p.y < hy + 20 + p.r && dx < bd) { bd = dx; pick = p; }
  }
  if (pick) {
    claw.q = 1 - bd / (pick.r * 0.8);   // grip quality, 1 = dead centre
    claw.ox = pick.x - claw.x; claw.oy = pick.y - hy;
    claw.held = pick; pick.held = true;
  }
}

// Off-centre grabs and gold prizes slip more often
function slip(dt) {
  const p = claw.held;
  if (!p || (state === 'lift' && claw.t < 0.25)) return;
  const rate = (0.08 + (1 - claw.q) * 0.9) * (p.rare ? 1.6 : 1);
  if (Math.random() < rate * dt) {
    p.held = false; p.vx = (Math.random() - .5) * 60; p.vy = 0;
    claw.held = null; claw.open = 0.5;
    sfx('slip'); pop(p.x, p.y - 30, '¡Uy!', '#fff');
  }
}

function win(p) {
  const pts = p.rare ? 5 : 1;
  score += pts; won++;
  pop(HOME_X + 20, CHUTE.top - 30, p.rare ? '+5 ¡Dorada!' : '+1', p.rare ? '#ffd23f' : '#80ed99');
  sfx('win');
}

function pop(x, y, text, col) { pops.push({ x, y, text, col, t: 0 }); }

function update(dt) {
  const c = claw;
  switch (state) {
    case 'aim': {
      aimT -= dt;
      const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
      c.x = clamp(c.x + dir * MOVE * dt, CLAW_MIN, CLAW_MAX);
      if (aimT <= 0) startDrop();
      break;
    }
    case 'drop': {
      c.len += DROP * dt;
      const hy = headY();
      let hit = hy >= BOX.b - 42;
      for (const p of prizes) if (Math.abs(p.x - c.x) < p.r * 0.7 && hy + 14 >= p.y - p.r) hit = true;
      if (hit) { state = 'close'; pickGrab(); sfx('clank'); }
      break;
    }
    case 'close':
      c.open = Math.max(0, c.open - dt * 2.2);
      if (c.held) { c.ox *= 1 - dt * 6; c.oy += (12 + c.held.r - c.oy) * dt * 6; }
      if (c.open <= 0) { if (c.held) sfx('grab'); state = 'lift'; c.t = 0; }
      break;
    case 'lift':
      c.len = Math.max(0, c.len - LIFT * dt); c.t += dt; slip(dt);
      if (c.len <= 0) state = 'return';
      break;
    case 'return': {
      const d = HOME_X - c.x;
      c.x += Math.sign(d) * Math.min(Math.abs(d), MOVE * dt); slip(dt);
      if (Math.abs(d) < 0.5) state = 'release';
      break;
    }
    case 'release':
      c.open = Math.min(1, c.open + dt * 2);
      if (c.held && c.open > 0.35) { c.held.held = false; c.held.vx = c.held.vy = 0; c.held = null; }
      if (c.open >= 1) { state = 'wait'; c.t = 0; }
      break;
    case 'wait':
      c.t += dt;
      if (c.t > 1.2) {
        if (coins > 0) {
          state = 'idle';
          if (prizes.length < 8) spawn(10, BOX.t - 40);   // restock from the top
        } else gameOver();
      }
      break;
  }
  if (c.held) { c.held.x = c.x + c.ox; c.held.y = headY() + c.oy; c.held.vx = c.held.vy = 0; }
}

function gameOver() {
  state = 'over';
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(BEST_KEY, best); } catch (e) {} }
  document.getElementById('ovStats').innerHTML =
    `Premios: ${won}<br>Puntos: ${score}<br>${rec && score > 0 ? '¡Nuevo récord!' : 'Récord: ' + best}`;
  document.getElementById('over').hidden = false;
}

// ---------- Drawing ----------

function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawPrize(p) {
  const r = p.r;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.closePath(); ctx.fillStyle = p.col; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill();
  // The toy seen through the clear half
  if (p.rare) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .17 : r * .38;
      ctx.lineTo(Math.cos(a) * rr, -r * .45 + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fillStyle = '#ff9f1c'; ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, -r * .42, r * .36, 0, 7); ctx.fillStyle = p.col; ctx.fill();
    ctx.fillStyle = '#1b1430';
    ctx.beginPath(); ctx.arc(-r * .13, -r * .46, 2.2, 0, 7); ctx.arc(r * .13, -r * .46, 2.2, 0, 7); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(-r, -2, 2 * r, 4);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(20,10,40,.6)'; ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(p.x - r * .38, p.y - r * .45, r * .22, r * .12, -0.6, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill();
}

function drawClaw() {
  const x = claw.x, hy = headY();
  ctx.fillStyle = '#c9c3d8'; ctx.fillRect(BOX.l, RAIL_Y - 14, BOX.r - BOX.l, 8);
  ctx.strokeStyle = '#d9d4e6'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, RAIL_Y); ctx.lineTo(x, hy - 10); ctx.stroke();
  rrect(x - 22, RAIL_Y - 20, 44, 20, 6); ctx.fillStyle = '#efeaf7'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#5b4a7a'; ctx.stroke();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [w, col] of [[11, '#4a3d63'], [6, '#d5dbe8']]) {
    ctx.lineWidth = w; ctx.strokeStyle = col;
    for (const f of fingers()) { ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(f.kx, f.ky); ctx.lineTo(f.tx, f.ty); ctx.stroke(); }
  }
  rrect(x - 17, hy - 12, 34, 24, 8);
  const g = ctx.createLinearGradient(0, hy - 12, 0, hy + 12);
  g.addColorStop(0, '#ffe680'); g.addColorStop(1, '#d99a00');
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#6b4a00'; ctx.stroke();
}

function draw(time) {
  ctx.clearRect(0, 0, W, H);
  // Cabinet
  rrect(8, 6, W - 16, H - 12, 26); ctx.fillStyle = '#e8457a'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = '#8a1f48'; ctx.stroke();
  // Marquee with chasing bulbs
  rrect(24, 14, W - 48, 70, 18); ctx.fillStyle = '#3a1f6b'; ctx.fill();
  const bulbs = 26;
  for (let i = 0; i < bulbs; i++) {
    const on = (i + Math.floor(time * 6)) % 3 === 0;
    const bx = 40 + i * (W - 80) / (bulbs - 1);
    for (const by of [22, 76]) { ctx.beginPath(); ctx.arc(bx, by, 4, 0, 7); ctx.fillStyle = on ? '#fff3b0' : '#8a6a2a'; ctx.fill(); }
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 40px Kalam, cursive';
  ctx.lineWidth = 6; ctx.strokeStyle = '#8a1f48'; ctx.strokeText('CLAW MACHINE', W / 2, 52);
  ctx.fillStyle = '#ffd23f'; ctx.fillText('CLAW MACHINE', W / 2, 52);

  // Glass interior
  const bg = ctx.createLinearGradient(0, BOX.t, 0, BOX.b);
  bg.addColorStop(0, '#3b2a6e'); bg.addColorStop(1, '#22164a');
  ctx.fillStyle = bg; ctx.fillRect(BOX.l, BOX.t, BOX.r - BOX.l, BOX.b - BOX.t);
  ctx.fillStyle = 'rgba(255,255,255,.05)';
  for (let y = BOX.t + 20; y < BOX.b; y += 34) for (let x = BOX.l + 20 + ((y / 34) % 2) * 17; x < BOX.r; x += 34) {
    ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill();
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(BOX.l, BOX.t, BOX.r - BOX.l, BOX.b - BOX.t); ctx.clip();
  for (const p of prizes) if (p !== claw.held) drawPrize(p);
  drawClaw();
  if (claw.held) drawPrize(claw.held);
  // Chute front panel, drawn over the prizes that fall into it
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(BOX.l, CHUTE.top, CHUTE.r - BOX.l, BOX.b - CHUTE.top);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(CHUTE.r - 5, CHUTE.top, 10, BOX.b - CHUTE.top);
  ctx.fillRect(BOX.l, CHUTE.top - 3, CHUTE.r - BOX.l, 6);
  ctx.font = '700 20px Kalam, cursive'; ctx.fillStyle = '#ffd23f';
  ctx.fillText('PREMIOS', (BOX.l + CHUTE.r) / 2, CHUTE.top + 30);
  ctx.fillText('▼', (BOX.l + CHUTE.r) / 2, CHUTE.top + 56);
  if (state === 'idle') {
    ctx.globalAlpha = .6 + .4 * Math.sin(time * 4);
    ctx.font = '700 22px Kalam, cursive'; ctx.fillStyle = '#fff6e0';
    ctx.fillText('Tocá ◀ ▶ o BAJAR para jugar', (BOX.l + BOX.r) / 2 + 20, 190);
    ctx.font = '700 18px Kalam, cursive'; ctx.fillText('(1 ficha)', (BOX.l + BOX.r) / 2 + 20, 216);
    ctx.globalAlpha = 1;
  }
  // Glass glare
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  ctx.beginPath(); ctx.moveTo(BOX.l + 60, BOX.t); ctx.lineTo(BOX.l + 140, BOX.t); ctx.lineTo(BOX.l + 20, BOX.b); ctx.lineTo(BOX.l - 60, BOX.b); ctx.fill();
  ctx.beginPath(); ctx.moveTo(BOX.l + 170, BOX.t); ctx.lineTo(BOX.l + 195, BOX.t); ctx.lineTo(BOX.l + 75, BOX.b); ctx.lineTo(BOX.l + 50, BOX.b); ctx.fill();
  ctx.restore();
  ctx.lineWidth = 6; ctx.strokeStyle = '#8a1f48'; ctx.strokeRect(BOX.l - 3, BOX.t - 3, BOX.r - BOX.l + 6, BOX.b - BOX.t + 6);

  // Score pops
  for (const p of pops) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
    ctx.font = '700 28px Kalam, cursive'; ctx.lineWidth = 5; ctx.strokeStyle = '#1b1430';
    ctx.strokeText(p.text, p.x, p.y - p.t * 40); ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y - p.t * 40);
  }
  ctx.globalAlpha = 1;

  // Bottom panel
  rrect(24, 648, W - 48, 94, 18); ctx.fillStyle = '#2b1850'; ctx.fill();
  const cols = [['FICHAS', coins], ['PUNTOS', score], ['TIEMPO', state === 'aim' ? Math.ceil(aimT) : '–']];
  cols.forEach(([label, val], i) => {
    const x = 96 + i * 144;
    ctx.font = '700 16px Kalam, cursive'; ctx.fillStyle = '#b9a8e0'; ctx.fillText(label, x, 674);
    ctx.font = '700 34px Kalam, cursive';
    ctx.fillStyle = label === 'TIEMPO' && state === 'aim' && aimT < 5 ? '#ff5d8f' : '#fff6e0';
    ctx.fillText(val, x, 712);
  });
}

// ---------- Sound (tiny synth, no assets) ----------

let ac = null;
function sfx(name) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    const tone = (f, f2, d, type, v, at = 0) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + at);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + at + d);
      g.gain.setValueAtTime(v, t + at); g.gain.exponentialRampToValueAtTime(0.001, t + at + d);
      o.connect(g).connect(ac.destination); o.start(t + at); o.stop(t + at + d + .02);
    };
    switch (name) {
      case 'coin': tone(988, 0, .08, 'square', .05); tone(1319, 0, .25, 'square', .05, .08); break;
      case 'drop': tone(600, 200, .6, 'triangle', .08); break;
      case 'clank': tone(180, 90, .12, 'square', .07); break;
      case 'grab': tone(400, 800, .12, 'triangle', .08); break;
      case 'slip': tone(220, 80, .3, 'sawtooth', .05); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, .18, 'square', .05, i * .09)); break;
    }
  } catch (e) {}
}

// ---------- Input ----------

// Moving while idle spends a coin and starts the round
function press(dir) {
  if (state === 'idle') startRound();
  keys[dir] = true;
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key;
  if (state === 'over') { if (k === 'Enter' || k === ' ') { e.preventDefault(); reset(); } return; }
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') press('l');
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') press('r');
  else if (k === ' ' || k === 'ArrowDown' || k === 'Enter' || k === 's' || k === 'S') { e.preventDefault(); if (state === 'idle') startRound(); else startDrop(); }
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false;
});

for (const [id, dir] of [['bl', 'l'], ['br', 'r']]) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); b.classList.add('on'); press(dir); });
  const up = () => { keys[dir] = false; b.classList.remove('on'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
}
document.getElementById('bd').addEventListener('pointerdown', () => { if (state === 'idle') startRound(); else startDrop(); });
document.getElementById('again').addEventListener('click', reset);
addEventListener('blur', () => { keys.l = keys.r = false; });

// ---------- Layout and loop ----------

function fit() {
  const ctr = document.getElementById('controls');
  const s = Math.min((innerWidth - 20) / W, (innerHeight - ctr.offsetHeight - 30) / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', fit);

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now; acc += dt;
  while (acc >= STEP) { update(STEP); physics(STEP, false); acc -= STEP; }
  for (const p of pops) p.t += dt;
  pops = pops.filter(p => p.t < 1.2);
  draw(now / 1000);
  requestAnimationFrame(frame);
}

reset();
fit();
requestAnimationFrame(frame);
</script>
