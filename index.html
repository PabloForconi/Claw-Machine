<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claw Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1b1430; --ink: #fff6e0; --pink: #e8457a; --pink-dark: #8a1f48; --gold: #ffd23f; --panel: #2b1850; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--ink); font-family: Kalam, "Comic Sans MS", cursive; font-weight: 700;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; inset: 0; }
  #controls {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; align-items: center; gap: 28px; pointer-events: none;
  }
  body.wide #controls { justify-content: space-between; padding: 0 max(24px, 5vw); }
  #pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 2px; }
  #pad button[data-dir="u"] { grid-area: 1 / 2; }
  #pad button[data-dir="l"] { grid-area: 2 / 1; }
  #pad button[data-dir="r"] { grid-area: 2 / 3; }
  #pad button[data-dir="d"] { grid-area: 3 / 2; }
  #controls button {
    pointer-events: auto; font: inherit; color: var(--ink); background: var(--pink); border: 4px solid var(--pink-dark);
    border-radius: 16px; font-size: 22px; cursor: pointer; box-shadow: 0 5px 0 var(--pink-dark); padding: 0;
  }
  #controls button:active, #controls button.on { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-dark); }
  #controls #bd {
    width: 120px; height: 120px; border-radius: 50%; font-size: 26px;
    background: var(--gold); color: #3a1f00; border-color: #a8740a; box-shadow: 0 6px 0 #a8740a;
  }
  #over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 5, 25, .65); padding: 16px; }
  .card { background: var(--panel); border: 5px solid var(--gold); border-radius: 22px; padding: 22px 30px; text-align: center; max-width: 360px; width: 100%; }
  .card h2 { margin: 0 0 8px; font-size: 34px; color: var(--gold); }
  .card p { margin: 0 0 18px; font-size: 22px; line-height: 1.4; }
  .card button { font: inherit; font-size: 24px; color: #3a1f00; background: var(--gold); border: 4px solid #a8740a; border-radius: 16px; padding: 8px 24px; cursor: pointer; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
} }
</script>
</head>
<body>
<div id="controls">
  <div id="pad">
    <button data-dir="u" aria-label="Atrás">▲</button>
    <button data-dir="l" aria-label="Izquierda">◀</button>
    <button data-dir="r" aria-label="Derecha">▶</button>
    <button data-dir="d" aria-label="Adelante">▼</button>
  </div>
  <button id="bd">¡BAJAR!</button>
</div>
<div id="over" hidden>
  <div class="card">
    <h2>¡Sin fichas!</h2>
    <p id="ovStats"></p>
    <button id="again">Jugar de nuevo</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

// World units: the glass box is 4 wide (x), 3 deep (z), the floor is y = 0.
// The prize hole is the front-left corner: x < HOLE.x and z > HOLE.z.
const BOX = { x: 2, z: 1.5 };
const HOLE = { x: -1.1, z: 0.6 };
const HOLE_WALL_H = 1.1;
const WALLS = [   // the clear walls around the hole, as boxes
  { min: [HOLE.x - .03, 0, HOLE.z - .03], max: [HOLE.x + .03, HOLE_WALL_H, BOX.z] },
  { min: [-BOX.x, 0, HOLE.z - .03], max: [HOLE.x + .03, HOLE_WALL_H, HOLE.z + .03] },
];
const HOME = { x: (-BOX.x + HOLE.x) / 2, z: (HOLE.z + BOX.z) / 2 };
const LIMIT = { x: 1.7, z: 1.2 };
// The claw's body is a small rounded box around the head point, like the carriage: HUB_R out to its
// sides, from HUB_DOWN below the head point to HUB_UP above it, and it collides as a cylinder that
// size. The cable hooks onto its top (HOOK_UP), and the fingers hinge at its bottom edge (PIVOT_R
// out, PIVOT_DOWN down).
const HUB_R = .17, HUB_DOWN = .14, HUB_UP = .14, HOOK_UP = HUB_UP + .02;
// Each finger, closed, in its own plane: (out, down) from its hinge. Three straight parts: out and
// down to a first knee, nearly straight down to a second, then a shorter tip hooked in under the claw.
const FINGER_SHAPE = [[0, 0], [.26, .18], [.25, .58], [.06, .74]];
const PIVOT_R = .15, PIVOT_DOWN = .12, CLOSED_TIP_DOWN = PIVOT_DOWN + FINGER_SHAPE[FINGER_SHAPE.length - 1][1];
// How far (radians) the motor swings the fingers out when fully open, and the deepest a finger point
// reaches, open or closed
const OPEN_ANGLE = .4;
const FINGER_REACH = PIVOT_DOWN + Math.max(...FINGER_SHAPE.flatMap(([u, d]) => [d, -u * Math.sin(OPEN_ANGLE) + d * Math.cos(OPEN_ANGLE)]));
const CARRIAGE_Y = 4.3, HEAD0 = CARRIAGE_Y - HOOK_UP - .12;   // at the top the hook sits just under the carriage
const G = 14, STEP = 1 / 120;
const MOVE = 1.6, DROP = 2.2, LIFT = 1.8;
// Claw dynamics: the carriage accelerates and brakes, the winch ramps up, and the head is a
// mass hanging from an elastic cable, so it swings, bounces and goes slack when it lands
// The head is heavy (HEAD_MASS) and its swing is damped against the carriage, so it sways a little and settles fast
const ACC = 2.2, WINCH_ACC = 8;
const HEAD_MASS = 2.5, ROPE_K = 2200, ROPE_C = 60, SWING_DRAG = 2.5;
const HEAD_MIN_Y = FINGER_REACH + .02;                   // the finger tips touch the floor here
const L_MIN = CARRIAGE_Y - HEAD0, L_MAX = CARRIAGE_Y - HEAD_MIN_Y + .2;
// The drop lasts as long as paying out all the cable takes (DROP_TIME), then the claw sits DROP_REST
// before closing. DROP_SLACK is the most loose cable the winch lets out once the claw rests on something.
const DROP_TIME = (L_MAX - L_MIN) / DROP + DROP / (2 * WINCH_ACC), DROP_REST = .3, DROP_SLACK = .45;
// Finger give: how fast a pressed finger swings up (radians per unit of overlap, per step), how far
// it can, how fast it springs back (radians per second), and the widest a finger can ever swing
const FLEX_GAIN = 6, FLEX_MAX = 1.1, FLEX_RETURN = 1.5, FLEX_MAX_ANGLE = 1.6;
// ...the fastest a finger can be pushed open (radians per second), and how much of the most-opened
// finger's give the others follow while the claw comes down (see flexFingers)
const FLEX_RATE = 1.8, FLEX_LINK = .8;
const HOLD_SETTLE = 6;   // how fast (per second) a caught prize slides to the middle and the fingers even out
const CENTER_SPEED = .5; // the fastest the rising fingers push a caught prize in to the middle (see carry)
// How a caught prize moves about inside the claw (see wobble): restoring spring and damping (per
// second), how far it can go sideways and up, how much of its speed it keeps when it bounces off the
// sides or the box, and its springy contact with the fingers under it (stiffness, damping, and the
// deepest it may press in)
const WOBBLE = { k: 30, c: 4, side: .025, up: .05, bounce: .5, floorK: 6000, floorC: 20, sink: .012 };
// The closing motor speeds up (CLOSE_ACC, in open-fractions per second²) to CLOSE_SPEED, so the claw
// shuts with a snap rather than easing in
const CLOSE_SPEED = 5, CLOSE_ACC = 22;
// The claw is closed at the top and only opens on the way down (OPEN_RATE, open-fractions per second).
// Letting go over the hole is mechanical (the user asked for both, October 2026): the motor speeds up
// to RELEASE_SPEED and the fingers hit their stop with a clunk and a jolt (JOLT, an upward kick to the
// head on its cable), the claw stays open OPEN_HOLD seconds, then shuts like the grab, with a clack
// (see restClose)
const OPEN_RATE = 2.5;
const RELEASE_SPEED = 4, RELEASE_ACC = 16, OPEN_HOLD = .5, JOLT = .9;
// Losing a catch on purpose (see slip): the chance (LOSE_BASE, plus LOSE_OFF the further off centre it
// was caught; gold ones 1.6 times as often); how fast the fingers fly open when the stop at the top
// shakes it loose (a snap: it opens because it hit) and how long before the motor shuts them again;
// and for the other kind, how much of the way back the claw has covered when it lets go, and how fast
// it opens
const LOSE_BASE = .045, LOSE_OFF = .24, LOSE_TOP_RATE = 12, TOP_SHUT_IN = .3;
const LOSE_EARLY_AT = .4, LOSE_EARLY_RATE = 6;
// For testing (the user asked for it, October 2026): catches go round this pattern, one lost on the
// way to the hole, one shaken loose at the top, one carried home, whatever the grip. Only catches
// count, never a round where the claw came up empty. Set to null for the normal chance above.
const LOSE_PATTERN = ['early', 'top', null];
const CLOSE_GIVE = .03;  // while closing, how far a finger digs into a jammed prize before it gives way
const CLOSE_HOLD = .35;  // seconds the motor keeps squeezing once fully closed, before lifting
// Rope: velocity kept per step, link passes per step, and the sideways nudge that lets slack bow out
const CABLE_DAMP = .995, CABLE_ITERS = 30, CABLE_NUDGE = 2e-5;
const AIM_TIME = 15, START_COINS = 10;
// For testing (the user asked for it, October 2026): rounds cost nothing, the board shows ∞ coins and
// the game never ends. Set to false to play with START_COINS again.
const FREE_PLAY = true;
// Seconds after letting go before the next round can start (it was 1.2)
const WAIT_TIME = .3;
// Few enough capsules to leave gaps for the fingers, and sizes close together: a tight carpet of
// capsules only lets the claw pinch tops, small ones sit too low to reach and big ones squeeze out
const PRIZE_COUNT = 66, R_MIN = .29, R_MAX = .32, RESTOCK_BELOW = 33;
const SETTLE_STEPS = 600;   // physics steps (5 s) run at a reset so the pile is settled when shown
const COLORS = [0xff5d8f, 0x4cc9f0, 0x80ed99, 0xb388ff, 0xff9f43];
// Three prongs, one at the back. (A caught prize rides in the claw, so it can't slip out through the
// gap between two fingers, which is why there were four for a while.)
const FINGER_ANGLES = [-Math.PI / 2, -Math.PI / 2 + 2 * Math.PI / 3, -Math.PI / 2 + 4 * Math.PI / 3];
const BEST_KEY = 'clawMachine.best';

let prizes = [], claw, coins, score, won, state, aimT, best = 0;
let caught = 0;   // catches made since the reset (they go round LOSE_PATTERN)
const keys = { l: false, r: false, u: false, d: false };

try { best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);

// ---------- Renderer, camera, lights ----------

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1430);
scene.fog = new THREE.Fog(0x1b1430, 14, 30);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
// The camera looks at the machine from the front, about 20° above level (it was 30°: lower shows more of
// the play area, still high enough for the claw's shadow on the capsules to read as depth)
const CAM_TARGET = new THREE.Vector3(0, 1.7, 0), CAM_DIR = new THREE.Vector3(0, .36, .93).normalize();

scene.add(new THREE.HemisphereLight(0xd8ccff, 0x2a1840, 1.4));
const front = new THREE.DirectionalLight(0xfff0e0, 1.2);
front.position.set(2, 6, 8);
scene.add(front);
// Straight-down light: the claw's shadow lands right under it, which is how you aim in depth
const top = new THREE.DirectionalLight(0xffffff, 1.6);
top.position.set(0, 10, 0.001);
top.castShadow = true;
top.shadow.mapSize.set(2048, 2048);
Object.assign(top.shadow.camera, { left: -2.6, right: 2.6, top: 2.2, bottom: -2.2, near: 1, far: 14 });
top.shadow.bias = -0.0005;
scene.add(top);
const glow = new THREE.PointLight(0xffc0e0, 6, 8, 1.5);
glow.position.set(0, 3.8, 0.6);
scene.add(glow);

// ---------- Machine ----------

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .55, ...extra });
const PINK = mat(0xe8457a, { roughness: .4 }), PINK_DARK = mat(0x8a1f48), METAL = mat(0xd5dbe8, { metalness: .8, roughness: .3 });
const GOLD = mat(0xf4c430, { metalness: .7, roughness: .3 });

// The machine is all plain boxes with sharp edges, the same flat, simple look as the claw. The user
// asked for fewer polygons (October 2026): the base, pillars and roof used to have rounded edges.
function box(w, h, d, material, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z); scene.add(m); return m;
}

function canvasTex(w, h, paint) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.repaint = () => { paint(c.getContext('2d'), w, h); tex.needsUpdate = true; };
  tex.repaint();
  return tex;
}

const dots = (bg) => {
  const t = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(255,255,255,.12)';
    for (const [x, y] of [[32, 32], [96, 96]]) { g.beginPath(); g.arc(x, y, 9, 0, 7); g.fill(); }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
};

// Floor slab with the hole cut out: two boxes forming an L, plus thick rims all round
const floorTex = dots('#5a43a0'); floorTex.repeat.set(6, 4.5);
const FLOOR = mat(0xffffff, { map: floorTex });
const slabA = box(BOX.x - HOLE.x, .6, BOX.z * 2, FLOOR, (HOLE.x + BOX.x) / 2, -.3, 0);
const slabB = box(HOLE.x + BOX.x, .6, HOLE.z + BOX.z, FLOOR, (HOLE.x - BOX.x) / 2, -.3, (HOLE.z - BOX.z) / 2);
slabA.receiveShadow = slabB.receiveShadow = true;
box(4.7, .62, .35, PINK, 0, -.29, BOX.z + .175);
box(4.7, .62, .35, PINK, 0, -.29, -BOX.z - .175);
box(.35, .62, 3.7, PINK, BOX.x + .175, -.29, 0);
box(.35, .62, 3.7, PINK, -BOX.x - .175, -.29, 0);
const holeIn = box(.88, .6, .88, new THREE.MeshStandardMaterial({ color: 0x120a20, side: THREE.BackSide }), HOME.x, -.3, HOME.z);
holeIn.receiveShadow = true;
box(4.7, 1.1, 3.7, PINK, 0, -1.15, 0);

// Scoreboard on the front of the base: coins, points, time, and the hint while idle. It is part of the
// machine (a canvas texture, repainted by hud() when something changes) so the screen above is all game.
const board = { coins: 0, score: 0, time: '–', low: false, hint: true };
const BOARD_W = 4.2, BOARD_H = .95;
const boardTex = canvasTex(1024, Math.round(1024 * BOARD_H / BOARD_W), (g, w, h) => {
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#2b1850'; g.beginPath(); g.roundRect(6, 6, w - 12, h - 12, 32); g.fill();
  g.strokeStyle = '#ffd23f'; g.lineWidth = 10; g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  [['FICHAS', board.coins], ['PUNTOS', board.score], ['TIEMPO', board.time]].forEach(([label, value], i) => {
    const x = w * (i + .5) / 3;
    g.fillStyle = '#b9a8e0'; g.font = '700 36px Kalam, cursive'; g.fillText(label, x, 44);
    g.fillStyle = label === 'TIEMPO' && board.low ? '#ff5d8f' : '#fff6e0'; g.font = '700 84px Kalam, cursive'; g.fillText(value, x, 108);
  });
  if (board.hint) { g.fillStyle = '#ffd23f'; g.font = '700 44px Kalam, cursive'; g.fillText(FREE_PLAY ? 'Tocá las flechas o ¡BAJAR!' : 'Tocá las flechas o ¡BAJAR! (1 ficha)', w / 2, h - 42); }
});
const boardMesh = new THREE.Mesh(new THREE.PlaneGeometry(BOARD_W, BOARD_H), new THREE.MeshBasicMaterial({ map: boardTex, transparent: true }));
boardMesh.position.set(0, -1.15, 1.86); scene.add(boardMesh);

// Pillars, roof, back wall, glass
for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(.35, 4.6, .35, PINK, sx * (BOX.x + .175), 2.3, sz * (BOX.z + .175));
box(4.7, .3, 3.7, PINK, 0, 4.75, 0);
const backTex = dots('#2e2058'); backTex.repeat.set(6, 7);
const back = new THREE.Mesh(new THREE.PlaneGeometry(BOX.x * 2, 4.6), mat(0xffffff, { map: backTex }));
back.position.set(0, 2.3, -BOX.z); back.receiveShadow = true; scene.add(back);
const GLASS = new THREE.MeshStandardMaterial({ color: 0xbfe6ff, transparent: true, opacity: .07, roughness: 0, depthWrite: false });
const glassF = new THREE.Mesh(new THREE.PlaneGeometry(BOX.x * 2, 4.6), GLASS);
glassF.position.set(0, 2.3, BOX.z); scene.add(glassF);
for (const sx of [-1, 1]) {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(BOX.z * 2, 4.6), GLASS);
  g.position.set(sx * BOX.x, 2.3, 0); g.rotation.y = Math.PI / 2; scene.add(g);
}
// Clear walls around the hole, with a yellow top edge
const ACRYLIC = new THREE.MeshStandardMaterial({ color: 0xffd23f, transparent: true, opacity: .28, depthWrite: false });
for (const w of WALLS) {
  const s = w.max.map((v, i) => v - w.min[i]), c = w.max.map((v, i) => (v + w.min[i]) / 2);
  box(s[0], s[1], s[2], ACRYLIC, c[0], c[1], c[2]);
  box(s[0] + .02, .05, s[2] + .02, GOLD, c[0], HOLE_WALL_H, c[2]);
}

// Marquee with chasing bulbs: a thin strip on the roof (MARQUEE_H tall), so there is more room for the game
const MARQUEE_H = .5, MARQUEE_Y = 4.9 + MARQUEE_H / 2;
const marqueeTex = canvasTex(1024, Math.round(1024 * MARQUEE_H / 4.7), (g, w, h) => {
  g.fillStyle = '#3a1f6b'; g.fillRect(0, 0, w, h);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `700 ${Math.round(h * .72)}px Kalam, cursive`;
  g.lineWidth = 10; g.strokeStyle = '#8a1f48'; g.strokeText('CLAW MACHINE', w / 2, h / 2 + 5);
  g.fillStyle = '#ffd23f'; g.fillText('CLAW MACHINE', w / 2, h / 2 + 5);
});
document.fonts.load('700 120px Kalam').then(() => { marqueeTex.repaint(); boardTex.repaint(); }).catch(() => {});
box(4.7, MARQUEE_H, .3, [PINK, PINK, PINK, PINK, new THREE.MeshBasicMaterial({ map: marqueeTex }), PINK], 0, MARQUEE_Y, BOX.z + .2);
const bulbs = [];
const BULB_ON = new THREE.MeshBasicMaterial({ color: 0xfff3b0 }), BULB_OFF = new THREE.MeshBasicMaterial({ color: 0x8a6a2a });
const BULB_GEO = new THREE.BoxGeometry(.075, .075, .04);   // little square lights, like the rest of the machine
for (let i = 0; i < 22; i++) for (const y of [MARQUEE_Y - MARQUEE_H / 2 + .02, MARQUEE_Y + MARQUEE_H / 2 - .02]) {
  const b = new THREE.Mesh(BULB_GEO, BULB_OFF);
  b.position.set(-2.2 + i * 4.4 / 21, y, BOX.z + .37); scene.add(b); bulbs.push([b, i]);
}

// Room floor
const room = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), mat(0x241a40));
room.rotation.x = -Math.PI / 2; room.position.y = -1.7; room.receiveShadow = true; scene.add(room);

// ---------- Claw meshes ----------

const RAIL = mat(0xc9c3d8, { metalness: .6, roughness: .35 });
for (const sx of [-1, 1]) box(.1, .1, BOX.z * 2, RAIL, sx * (BOX.x - .05), CARRIAGE_Y + .05, 0);
const bridge = box(BOX.x * 2, .08, .14, RAIL, 0, CARRIAGE_Y + .05, 0);
const carriage = box(.34, .18, .34, mat(0xefeaf7), 0, CARRIAGE_Y - .04, 0);
// The cable is drawn as one short cylinder per rope segment (see cableStep)
const CABLE_NODES = 24;
const CABLE_GEO = new THREE.CylinderGeometry(.012, .012, 1, 6), CABLE_MAT = mat(0xdddddd);
const cableSegs = Array.from({ length: CABLE_NODES }, () => {
  const m = new THREE.Mesh(CABLE_GEO, CABLE_MAT); m.castShadow = true; scene.add(m); return m;
});
// Body: a plain box standing along the cable
const CHROME = mat(0xdfe4ee, { metalness: .45, roughness: .28 });   // no environment map, so not too metallic or it goes black
const bodyBox = new THREE.Mesh(new THREE.BoxGeometry(HUB_R * 2, HUB_DOWN + HUB_UP, HUB_R * 2), CHROME);
bodyBox.castShadow = true; scene.add(bodyBox);
// Each finger is one flat piece: its centre line follows FINGER_SHAPE, FINGER_W wide, with clean
// mitred corners at the knees and a square-cut end, FINGER_T thick. It is built once in the finger's
// own plane (x out, y up, from the hinge) and only moved and turned each frame (syncClaw).
const FINGER_W = .08, FINGER_T = .05;
function fingerOutline() {
  const P = FINGER_SHAPE.map(([u, d]) => [u, -d]), hw = FINGER_W / 2, n = P.length;
  const dir = i => { const a = P[i], b = P[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]); return [(b[0] - a[0]) / l, (b[1] - a[1]) / l]; };
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const d0 = dir(Math.max(0, i - 1)), d1 = dir(Math.min(n - 2, i));
    const n0 = [-d0[1], d0[0]], n1 = [-d1[1], d1[0]];
    const ml = Math.hypot(n0[0] + n1[0], n0[1] + n1[1]), m = [(n0[0] + n1[0]) / ml, (n0[1] + n1[1]) / ml];
    const k = hw / Math.max(.3, m[0] * n1[0] + m[1] * n1[1]);   // the mitre: longer the sharper the bend
    left.push([P[i][0] + m[0] * k, P[i][1] + m[1] * k]);
    right.push([P[i][0] - m[0] * k, P[i][1] - m[1] * k]);
  }
  const s = new THREE.Shape();
  s.moveTo(...left[0]);
  for (const q of [...left.slice(1), ...right.reverse()]) s.lineTo(...q);
  s.closePath();
  return s;
}

//   3. solve contact impulses SOLVER_ITERS times: normal impulses (with restitution on hard impacts)
//      and Coulomb friction at the contact point, which also spins the spheres, so they roll, stack
//      and stop instead of sliding around;
//   4. move and rotate;
//   5. push apart whatever still overlaps, without adding velocity.

// the held prize (kinematic: they push with their own velocity), or the floor, glass and hole walls.

    add(null, -1, 0, 0, a.r - (a.x + BOX.x), 'glass', ZERO);

    add(null, 0, 0, -1, a.r - (a.z + BOX.z), 'glass', ZERO);
    add(null, 0, 0, 1, a.r - (BOX.z - a.z), 'glass', ZERO);
    for (const w of WALLS) {
      const q = [clamp(a.x, w.min[0], w.max[0]), clamp(a.y, w.min[1], w.max[1]), clamp(a.z, w.min[2], w.max[2])];
      if (Math.hypot(a.x - q[0], a.y - q[1], a.z - q[2]) > 1e-9) { toPoint(q, 0, 'wall', ZERO); continue; }
      // The centre is inside the wall: out through the nearest face
      let best = 1e9, axis = 0, dir = 1;
      const p = [a.x, a.y, a.z];
      for (let k = 0; k < 3; k++) for (const [face, sg] of [[w.min[k], -1], [w.max[k], 1]]) {
        const dist = Math.abs(p[k] - face);
        if (dist < best) { best = dist; axis = k; dir = sg; }
      }
      const n = [0, 0, 0]; n[axis] = -dir;
      add(null, n[0], n[1], n[2], best + a.r, 'wall', ZERO);
    }
  }
  return out;
}

// Velocity of the other side relative to the prize, at the contact point
function relVel(c) {
  const a = c.a, b = c.b, n = c.n;
  const rax = n[0] * a.r, ray = n[1] * a.r, raz = n[2] * a.r;
  const va = [a.vx + a.wy * raz - a.wz * ray, a.vy + a.wz * rax - a.wx * raz, a.vz + a.wx * ray - a.wy * rax];
  let vb = c.vb;
  if (b && vb) vb = [b.vx + vb[0], b.vy + vb[1], b.vz + vb[2]];
  else if (b) {
    const rbx = -n[0] * b.r, rby = -n[1] * b.r, rbz = -n[2] * b.r, wx = b.wx || 0, wy = b.wy || 0, wz = b.wz || 0;
    vb = [b.vx + wy * rbz - wz * rby, b.vy + wz * rbx - wx * rbz, b.vz + wx * rby - wy * rbx];
  }
  return [vb[0] - va[0], vb[1] - va[1], vb[2] - va[2]];
}

// Impulse J on b at its contact point, and -J on a at its own
function applyImpulse(c, jx, jy, jz) {
  const a = c.a, b = c.b, n = c.n;
  a.vx -= jx * a.im; a.vy -= jy * a.im; a.vz -= jz * a.im;
  const rax = n[0] * a.r, ray = n[1] * a.r, raz = n[2] * a.r;
  a.wx -= a.iI * (ray * jz - raz * jy); a.wy -= a.iI * (raz * jx - rax * jz); a.wz -= a.iI * (rax * jy - ray * jx);
  if (!b) return;
  const im = imOf(b, c);
  b.vx += jx * im; b.vy += jy * im; b.vz += jz * im;
  if (b.iI && im && !c.vb) {
    const rbx = -n[0] * b.r, rby = -n[1] * b.r, rbz = -n[2] * b.r;
    b.wx += b.iI * (rby * jz - rbz * jy); b.wy += b.iI * (rbz * jx - rbx * jz); b.wz += b.iI * (rbx * jy - rby * jx);
  }
}

const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];

function solveContacts(cs, dt) {
  for (const c of cs) {
    const vn = dot(relVel(c), c.n);
    // Across a gap the bodies may still approach, just not past touching (no tunnelling, no fake bumps)
    c.target = c.pen < 0 ? c.pen / dt : (vn < -BOUNCE_MIN ? -BOUNCE[c.kind] * vn : 0);
  }
  for (let it = 0; it < SOLVER_ITERS; it++) for (const c of cs) {
    const a = c.a, b = c.b, n = c.n, imb = b ? imOf(b, c) : 0;
    // Normal: never pull, only push
    let v = relVel(c);
    const jn0 = c.jn;
    c.jn = Math.max(0, jn0 + (c.target - dot(v, n)) / (a.im + imb));
    const j = c.jn - jn0;
    if (j) applyImpulse(c, n[0] * j, n[1] * j, n[2] * j);
    // Friction: oppose sliding at the contact point, up to MU times the normal impulse
    v = relVel(c);
    const vn = dot(v, n), tx = v[0] - vn * n[0], ty = v[1] - vn * n[1], tz = v[2] - vn * n[2];
    const k = a.im + imb + a.r * a.r * a.iI + (b && imb && !c.vb ? b.r * b.r * (b.iI || 0) : 0);
    let jt = [c.jt[0] - tx / k, c.jt[1] - ty / k, c.jt[2] - tz / k];
    const max = MU[c.kind] * c.jn, len = Math.hypot(...jt);
    if (len > max) jt = jt.map(x => x * max / len);
    applyImpulse(c, jt[0] - c.jt[0], jt[1] - c.jt[1], jt[2] - c.jt[2]);
    c.jt = jt;
  }
}

// Move overlapping bodies apart directly (no velocity change), sharing the push by inverse mass
function separate(cs) {
  for (const c of cs) {
    if (c.pen <= SLOP) continue;
    const a = c.a, b = c.b, imb = b ? imOf(b, c) : 0, s = (c.pen - SLOP) * .9 / (a.im + imb), n = c.n;
    a.x -= n[0] * s * a.im; a.y -= n[1] * s * a.im; a.z -= n[2] * s * a.im;
    if (b && imb) { b.x += n[0] * s * imb; b.y += n[1] * s * imb; b.z += n[2] * s * imb; }
  }
}

// The finger segments one step ago, relative to the head, for their own motion (closing, tilting)
let lastSegs = null;
const rollAxis = new THREE.Vector3(), rollQ = new THREE.Quaternion();
function physics(dt, settling) {
  for (const p of prizes) if (!p.held) p.vy -= G * dt;

  const segs = segments(), h = claw.head;
  const segsRel = segs.map(s => s.map(q => [q[0] - h.x, q[1] - h.y, q[2] - h.z]));
  const segVel = lastSegs ? segsRel.map((s, i) => s.map((q, j) => q.map((v, k) => (v - lastSegs[i][j][k]) / dt))) : null;
  lastSegs = segsRel;

  const cs = findContacts(segs, segVel, MARGIN, !settling);
  solveContacts(cs, dt);
  // Is the claw (head or fingers) pressing on any prize? (see the drop's landing; walls count too, in swingHead)
  claw.touching = cs.some(c => c.b === claw.head && c.jn > 0);

  const touching = new Set(cs.filter(c => c.jn > 0).map(c => c.a));
  if (claw.held) {
    const onHeld = new Set(cs.filter(c => c.jn > 0 && c.b === claw.held).map(c => c.a));
    for (const c of cs) {
      const p = c.a;
      if (c.jn <= 0 || c.b !== h || !onHeld.has(p)) continue;
      const v = [p.vx - h.vx, p.vy - h.vy, p.vz - h.vz], s = Math.hypot(...v);
      if (s > SQUEEZE_MAX) { const k = SQUEEZE_MAX / s; p.vx = h.vx + v[0] * k; p.vy = h.vy + v[1] * k; p.vz = h.vz + v[2] * k; }
    }
  }
  for (const p of prizes) {
    if (p.held) continue;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (touching.has(p)) { const k = 1 - ROLL_DAMP * dt; p.wx *= k; p.wy *= k; p.wz *= k; }
    const w = Math.hypot(p.wx, p.wy, p.wz);
    if (w > 1e-4) p.mesh.quaternion.premultiply(rollQ.setFromAxisAngle(rollAxis.set(p.wx / w, p.wy / w, p.wz / w), w * dt));
  }
  for (let it = 0; it < POS_ITERS; it++) separate(findContacts(segs, null, 0, !settling));

  for (let i = prizes.length - 1; i >= 0; i--) {
    const p = prizes[i];
    if (!p.held && p.y < -.75) { scene.remove(p.mesh); prizes.splice(i, 1); if (!settling) win(p); }
  }
}

// ---------- Game flow ----------

function startRound() {
  if (state !== 'idle' || coins <= 0) return;
  if (!FREE_PLAY) coins--;
  state = 'aim'; aimT = AIM_TIME; sfx('coin'); hud();
}

function startDrop() {
  if (state !== 'aim') return;
  state = 'drop'; claw.winch = 0; claw.t = 0; claw.landed = false; claw.target = null; claw.slipping = null; claw.lose = null; claw.letGo = 0; claw.reshut = false; claw.tripFrom = undefined; claw.topHit = false; keys.l = keys.r = keys.u = keys.d = false; sfx('drop');
}

// When the claw starts closing, pickTarget() notes the prize right under it whose top half the closed
// tips could reach. It stays loose while the fingers close around it; grabTarget() decides at the end.
function pickTarget() {
  const h = claw.head, tipY = clawPoint(clawFrame(), 0, 0, -CLOSED_TIP_DOWN)[1];
  let pick = null, bd = 1e9;
  for (const p of prizes) {
    const dx = Math.hypot(p.x - h.x, p.z - h.z);
    if (dx < p.r * .8 && p.y < h.y && tipY < p.y + p.r * .5 && dx < bd) { bd = dx; pick = p; }
  }
  claw.target = pick;
}

// How a prize of radius r, centred on the claw's axis at height oy (claw frame), sits in the claw with
// all fingers at one angle: { angle, oy } for where it rests, or null if it isn't held.
// - The closed fingers would press into it: they rest on it, a little open (the angle), which holds it
//   only if the tips end up under its middle.
// - It fits loose inside the closed claw (the curved fingers make a cage): it settles down onto the
//   inward-curling tips (the oy it drops to), unless it would drop right through between them.
function cradle(r, oy) {
  const fr = clawFrame();
  const at = th => fingers(FINGER_ANGLES.map(() => th - claw.open * OPEN_ANGLE));
  const ball = up => { const c = clawPoint(fr, 0, 0, up); return { x: c[0], y: c[1], z: c[2], r }; };
  const pen = (th, up) => Math.max(...at(th).map(fg => fingerPenOn(fg, ball(up))));
  const tipsUnder = (th, up) => Math.max(...at(th).map(fg => fg.t[1])) < ball(up).y - r * .1;
  if (pen(0, oy) > 0) {
    let lo = 0, hi = FLEX_MAX_ANGLE;
    if (pen(hi, oy) > 0) return null;
    for (let i = 0; i < 20; i++) { const m = (lo + hi) / 2; if (pen(m, oy) > 0) lo = m; else hi = m; }
    return tipsUnder(hi, oy) ? { angle: hi, oy } : null;
  }
  // Lower it bit by bit until it first touches a finger (heights: lower is more negative). Too far
  // down it would be past the tips and touch nothing, so a single deep probe can't tell.
  for (let up = oy - .01; up > oy - .6; up -= .01) {
    if (pen(0, up) > 0) return tipsUnder(0, up + .01) ? { angle: 0, oy: up + .01 } : null;
  }
  return null;   // it would drop right through
}

// When closing is done: the prize is caught only if it really is held (see cradle). If the fingers
// rest on it, all but one must touch it; if it sits loose in the closed cage, all fingers but one must
// have closed round it. One left splayed on a neighbour closes in once the claw lifts off the pile (the
// others' tips hold the prize meanwhile); two would leave too wide a gap. A prize only pinched at
// the top isn't caught: the claw rises without it. Once caught it rides in the claw (claw.hold, see
// carry): it stays where it lay until the rising fingers lift it, never moving up in the claw (no magnet).
function grabTarget() {
  const p = claw.target, h = claw.head;
  claw.target = null;
  if (!p) return;
  const dx = Math.hypot(p.x - h.x, p.z - h.z);
  if (dx > p.r * .8) return;
  const f = clawFrame(), rel = [p.x - h.x, p.y - h.y, p.z - h.z];
  const dot = v => rel[0] * v[0] + rel[1] * v[1] + rel[2] * v[2];
  const oy = -dot(f.d), cr = cradle(p.r, oy);
  if (!cr) return;
  if (cr.angle > 0 ? fingersOn(p, .02) < FINGER_ANGLES.length - 1 : claw.flex.filter(fl => fl > .3).length > 1) return;
  claw.q = 1 - dx / (p.r * .8);   // grip quality, 1 = dead centre
  // Will it be lost on the way (see slip)? About as often as the old per-second slips over a carry
  if (LOSE_PATTERN) claw.lose = LOSE_PATTERN[caught % LOSE_PATTERN.length];
  else {
    const lose = (LOSE_BASE + (1 - claw.q) * LOSE_OFF) * (p.rare ? 1.6 : 1);
    claw.lose = Math.random() < lose ? (Math.random() < .5 ? 'top' : 'early') : null;
  }
  caught++;
  const ox = dot(f.e1), oz = dot(f.e2);
  claw.hold = { ox, oz, oy, off0: Math.hypot(ox, oz), oy0: oy, restOy: cr.oy, flex: cr.angle - claw.open * OPEN_ANGLE };
  claw.held = p; p.held = true; p.wx = p.wy = p.wz = 0;
}

// The prize stops riding in the claw and is a loose body again (a slip, or letting go over the hole)
function detach() {
  const p = claw.held, h = claw.head;
  if (!p) return null;
  p.held = false; claw.held = null;
  p.vx = h.vx; p.vy = h.vy; p.vz = h.vz;
  return p;
}

// Carry the held prize. It doesn't move about in the claw by itself: it stays where it lay on the pile
// while the claw closes and starts to rise, until the fingers come up under it and lift it (at its rest
// height, see cradle). On the way they push it in to the middle, only as far as they have risen. An
// earlier version slid it down and to the middle at a steady rate, the moment it was caught, which
// looked like it was arranging itself in the claw (October 2026).
function carry(dt) {
  const c = claw, p = c.held, hd = c.hold, k = Math.min(1, HOLD_SETTLE * dt), h = c.head, f = clawFrame();
  if (!p) return;
  // Until lifted it stays put in the world (where it is in the claw is measured); once lifted it rides
  // with the claw (its place in the claw is kept, plus its wobble)
  const lifted = hd.oy <= hd.restOy;
  const rel = [p.x - h.x, p.y - h.y, p.z - h.z], dot = v => rel[0] * v[0] + rel[1] * v[1] + rel[2] * v[2];
  if (!lifted) hd.oy = Math.max(hd.restOy, Math.min(hd.oy, -dot(f.d)));
  const fall = hd.oy0 - hd.restOy, s = fall > 1e-3 ? (hd.oy - hd.restOy) / fall : 0;
  let ox = lifted ? hd.ox : dot(f.e1), oz = lifted ? hd.oz : dot(f.e2);
  // The push to the middle is also never faster than CENTER_SPEED. Tied to the rise alone, a prize with
  // little or no way to drop onto the fingers was snapped to the middle in a step or two, at up to
  // 30 m/s, and the capsules touching it took that speed: they flew up to the roof (October 2026).
  const off = Math.hypot(ox, oz), lim = Math.max(hd.off0 * s, off - CENTER_SPEED * dt);
  if (off > lim) { ox *= lim / off; oz *= lim / off; }
  hd.ox = ox; hd.oz = oz;
  // The claw stays shut until it lets go: no finger opens while carrying, not under the prize's weight
  // nor against a neighbour as it lifts off the pile (the neighbour is pushed aside instead). One left
  // splayed closes in to the cradle angle. The user asked for it (October 2026): the fingers used to
  // give way a little after closing, which looked like the claw opening again.
  for (let i = 0; i < c.flex.length; i++) if (c.flex[i] > hd.flex) c.flex[i] += (hd.flex - c.flex[i]) * k;
  if (hd.oy <= hd.restOy) wobble(hd, p, h, f, dt);
  const was = [p.x, p.y, p.z], wb = hd.wb || { u: 0, w: 0, y: 0 };
  [p.x, p.y, p.z] = clawPoint(f, hd.ox + wb.u, hd.oz + wb.w, hd.oy + wb.y);
  p.vx = (p.x - was[0]) / dt; p.vy = (p.y - was[1]) / dt; p.vz = (p.z - was[2]) / dt;
  hd.hv = [h.vx, h.vy, h.vz];
}

// Once lifted, the prize isn't glued to the claw: it moves a little inside it (hd.wb, offsets and
// velocities along the claw's axes e1, e2 and up), as a loose ball on curved fingers would. The claw's
// own accelerations throw it about: it drops onto the fingers when they pick it up and bounces a
// little (WOBBLE.bounce), rocks back as the claw starts or brakes and rolls back to the middle, as in
// a bowl (WOBBLE.k, damped by WOBBLE.c). The fingers below it and the box above it stop it, and it
// stays within WOBBLE.side of the middle. The user found it too smooth and unreal (October 2026).
function wobble(hd, p, h, f, dt) {
  const up = f.d.map(v => -v), d3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  if (!hd.wb) {
    // Picked up: it meets the fingers with its speed relative to them (it was resting on the pile)
    const rv = [p.vx - h.vx, p.vy - h.vy, p.vz - h.vz];
    hd.wb = { u: 0, w: 0, y: 0, vu: d3(rv, f.e1), vw: d3(rv, f.e2), vy: d3(rv, up) };
  }
  const wb = hd.wb, hv = hd.hv || [h.vx, h.vy, h.vz];
  // In the claw's frame the prize feels gravity minus the claw's acceleration
  const a = [-(h.vx - hv[0]) / dt, -G - (h.vy - hv[1]) / dt, -(h.vz - hv[2]) / dt];
  wb.vu += (d3(a, f.e1) - WOBBLE.k * wb.u - WOBBLE.c * wb.vu) * dt;
  wb.vw += (d3(a, f.e2) - WOBBLE.k * wb.w - WOBBLE.c * wb.vw) * dt;
  wb.vy += d3(a, up) * dt;
  wb.u += wb.vu * dt; wb.w += wb.vw * dt; wb.y += wb.vy * dt;
  // Resting on the fingers: a stiff, springy contact, so a jolt (the cable taking the load as the claw
  // starts to lift, the stop at the top) presses it in a hair and it bounces back up
  if (wb.y < 0) {
    wb.vy -= (WOBBLE.floorK * wb.y + WOBBLE.floorC * wb.vy) * dt;
    if (wb.y < -WOBBLE.sink) { wb.y = -WOBBLE.sink; if (wb.vy < 0) wb.vy = 0; }
  }
  if (wb.y > WOBBLE.up) { wb.y = WOBBLE.up; if (wb.vy > 0) wb.vy *= -WOBBLE.bounce; }   // against the box
  const s = Math.hypot(wb.u, wb.w);
  if (s > WOBBLE.side) {
    const nu = wb.u / s, nw = wb.w / s, vn = wb.vu * nu + wb.vw * nw;
    wb.u = nu * WOBBLE.side; wb.w = nw * WOBBLE.side;
    if (vn > 0) { wb.vu -= (1 + WOBBLE.bounce) * vn * nu; wb.vw -= (1 + WOBBLE.bounce) * vn * nw; }
  }
}

// Carriage motor: approach the target velocity with limited acceleration, so it ramps up and brakes
function driveCarriage(tx, tz, dt) {
  const c = claw, ax = tx - c.vx, az = tz - c.vz, a = Math.hypot(ax, az), m = ACC * dt;
  if (a > m) { c.vx += ax / a * m; c.vz += az / a * m; } else { c.vx = tx; c.vz = tz; }
  c.x += c.vx * dt; c.z += c.vz * dt;
  if (Math.abs(c.x) > LIMIT.x) { c.x = Math.sign(c.x) * LIMIT.x; c.vx = 0; }
  if (Math.abs(c.z) > LIMIT.z) { c.z = Math.sign(c.z) * LIMIT.z; c.vz = 0; }
}

// The head is a point mass on an elastic cable that can only pull (it goes slack when the head lands).
// Gravity plus the cable make it a pendulum under the carriage. Returns the carriage-to-head distance.
function swingHead(dt) {
  const c = claw, h = c.head, mass = HEAD_MASS + (c.held ? c.held.r ** 3 / .03 : 0);
  const dx = h.x - c.x, dy = h.y - CARRIAGE_Y, dz = h.z - c.z, dist = Math.hypot(dx, dy, dz);
  // While closing, and while the winch then reels in the slack, the claw rests where it landed (see
  // imOf). Left free during the reel-in, it sank into the pile by up to 0.3 before the cable pulled.
  if (state === 'close' || (state === 'lift' && c.len > dist)) { h.vx = h.vy = h.vz = 0; return dist; }
  let ax = 0, ay = -G, az = 0;
  if (dist > c.len) {
    const nx = dx / dist, ny = dy / dist, nz = dz / dist;
    const vrel = (h.vx - c.vx) * nx + h.vy * ny + (h.vz - c.vz) * nz;
    const f = Math.max(0, ROPE_K * (dist - c.len) + ROPE_C * vrel) / mass;
    ax -= f * nx; ay -= f * ny; az -= f * nz;
  }
  // Damping acts on the swing relative to the carriage, so it doesn't make the claw lag while moving.
  // It comes from friction up at the carriage, which brakes a short pendulum hard and a long one
  // barely (it falls with the square of the cable length): heavy and steady at the top, but the claw
  // keeps the sway it had when it starts going down. A small floor stands for air drag.
  const k = SWING_DRAG * dt, ks = k * clamp((L_MIN / Math.max(dist, L_MIN)) ** 2, .1, 1);
  h.vx += ax * dt - (h.vx - c.vx) * ks; h.vy += ay * dt - h.vy * k * .2; h.vz += az * dt - (h.vz - c.vz) * ks;
  h.x += h.vx * dt; h.y += h.vy * dt; h.z += h.vz * dt;
  // Once it has landed the heavy claw stays where it came down, sinking but not skating sideways
  // over the round tops of the capsules under its fingers
  if (state === 'drop' && c.landed) { [h.x, h.z] = c.landed; h.vx = c.vx; h.vz = c.vz; }
  if (h.y < HEAD_MIN_Y) { h.y = HEAD_MIN_Y; if (h.vy < 0) h.vy *= -.2; h.vx *= .9; h.vz *= .9; }
  // The hole walls stop the claw: it rests on their top edge or slides off their sides
  const s = clawWallPush(), sl = Math.hypot(...s);
  if (sl > 0) c.touching = true;
  if (sl > 0) {
    h.x += s[0]; h.y += s[1]; h.z += s[2];
    const n = s.map(v => v / sl), vn = h.vx * n[0] + h.vy * n[1] + h.vz * n[2];
    if (vn < 0) { h.vx -= 1.2 * vn * n[0]; h.vy -= 1.2 * vn * n[1]; h.vz -= 1.2 * vn * n[2]; }
  }
  const top = CARRIAGE_Y - HOOK_UP - .05;   // the claw never rides up into the carriage
  if (h.y > top) { h.y = top; if (h.vy > 0) h.vy = 0; }
  const bx = BOX.x - .3, bz = BOX.z - .3;
  if (Math.abs(h.x) > bx) { h.x = Math.sign(h.x) * bx; h.vx *= -.3; }
  if (Math.abs(h.z) > bz) { h.z = Math.sign(h.z) * bz; h.vz *= -.3; }
  return dist;
}

// The grip sometimes gives way. Whether a catch will be lost, and how, is settled when it is caught
// (claw.lose, see grabTarget: for now a fixed pattern, LOSE_PATTERN), and the claw never opens while
// it rises. The user asked for these two kinds (October 2026); before, a slip could start at any
// moment, mid-rise included, which looked odd. Either way the claw keeps going to the hole as usual,
// and the prize just falls, with the claw's speed, wherever that leaves it.
// - 'top': the jolt of the stop at the top (when the claw tops out, just after the end of lift)
//   snaps the fingers open (LOSE_TOP_RATE) as the claw sets off back; after TOP_SHUT_IN the motor
//   shuts them again on the way (restClose).
// - 'early': on the way back, once the claw has covered LOSE_EARLY_AT of the trip, it opens, a bit
//   faster than letting go over the hole (LOSE_EARLY_RATE), and stays open; it shuts over the hole.
//   (The user found opening just before the hole wrong, and then 0.35 s after setting off too soon.)
// c.letGo is the opening rate while a lost catch opens the claw; claw.slipping is the prize slipping
// out (the fingers open until it drops out between the tips, see loosen); c.reshut is the closing.
function slip(dt) {
  const c = claw, p = c.held;
  if (c.letGo) {
    loosen(dt, c.letGo);
    if (c.open >= 1) { c.letGo = 0; if (c.lose === 'top') { c.reshut = true; c.shutIn = TOP_SHUT_IN; c.closeV = 0; } }
    return;
  }
  if (c.reshut) { restClose(dt); if (c.open === 0) c.reshut = false; return; }
  // The winch stops a moment before the claw does: on its stretched cable it rides on up for about
  // 0.12 s. The jolt that shakes the prize loose is when it tops out, so it opens then, not when the
  // winch stops (which looked like opening before hitting the top).
  if (c.topHit) {
    if (c.head.vy > 0) return;
    c.topHit = false;
    if (p) { c.slipping = p; c.letGo = LOSE_TOP_RATE; sfx('clunk'); }
    return;
  }
  if (!p || c.lose !== 'early' || state !== 'return') return;
  const d = Math.hypot(HOME.x - c.x, HOME.z - c.z);
  if (c.tripFrom === undefined) c.tripFrom = d;
  if (d <= c.tripFrom * (1 - LOSE_EARLY_AT)) { c.slipping = p; c.letGo = LOSE_EARLY_RATE; }
}

// Open the fingers at this rate. The prize stays in the claw while they open and only comes loose
// once the tips are clear of it, so it drops straight out. Let go of earlier, it lay on the opening
// fingers and got flung by them.
function loosen(dt, rate) {
  const c = claw;
  c.open = Math.min(1, c.open + rate * dt);
  if (c.held && (tipsClear(c.held) || c.open >= 1)) {
    if (c.slipping) sfx('slip');
    detach(); c.slipping = null;
  }
}

// A prize in the hole scores on the board, with a jingle. There is no floating "+1" / "+5 ¡Dorada!"
// text any more: the user asked to drop it (October 2026).
function win(p) {
  score += p.rare ? 5 : 1; won++;
  sfx('win'); hud();
}

function update(dt) {
  const c = claw;
  // Where the carriage wants to go; it only moves while aiming and on the way back
  let tx = 0, tz = 0;
  if (state === 'aim') {
    tx = ((keys.r ? 1 : 0) - (keys.l ? 1 : 0)) * MOVE;
    tz = ((keys.d ? 1 : 0) - (keys.u ? 1 : 0)) * MOVE;
  } else if (state === 'return') {
    // Brake in time to stop over the hole
    const dx = HOME.x - c.x, dz = HOME.z - c.z, d = Math.hypot(dx, dz);
    const s = Math.min(MOVE, Math.sqrt(2 * ACC * .8 * d));
    if (d > 1e-4) { tx = dx / d * s; tz = dz / d * s; }
  }
  driveCarriage(tx, tz, dt);

  switch (state) {
    case 'aim':
      aimT -= dt;
      if (aimT <= 0) startDrop();
      break;
    case 'drop':
      // The drop takes a fixed time, as on a real machine: touching a prize on the way doesn't stop
      // it. Whatever the claw lands on, it rests there with its weight and sinks into the pile as it
      // pushes prizes aside (held in place sideways once landed, see swingHead). The winch keeps
      // letting out up to DROP_SLACK of loose cable, which bows out above the claw.
      c.t += dt;
      c.open = Math.min(1, c.open + OPEN_RATE * dt);   // it opens as it starts down (closed at the top)
      c.winch = Math.min(DROP, c.winch + WINCH_ACC * dt);
      c.len = Math.min(L_MAX, c.len + c.winch * dt, c.dist + DROP_SLACK);
      // Landed means the cable is slack because the claw rests on something it touches. Slack alone
      // isn't enough: a swinging claw slackens its elastic cable for a moment at each end of the swing,
      // and taking that for a landing pinned it in mid-air and killed the sway.
      if (!c.landed && c.len - c.dist > .03 && c.touching) { c.landed = [c.head.x, c.head.z]; sfx('clank'); }
      if (c.t >= DROP_TIME + DROP_REST) { state = 'close'; c.winch = 0; c.closeV = 0; pickTarget(); }
      break;
    case 'close': {
      // The motor closes all the way: each finger gives way against whatever it meets, prizes and the
      // hole walls alike (see flexFingers). Then it keeps squeezing for CLOSE_HOLD, so fingers that
      // had given way on the pile while landing get time to work their way back in.
      // It closes hard: the motor speeds up to CLOSE_SPEED, so the fingers sweep in fast and shove
      // what they meet (it used to close at a steady 2.2, which felt soft), and it clacks shut.
      c.closeV = Math.min(CLOSE_SPEED, (c.closeV || 0) + CLOSE_ACC * dt);
      const wasOpen = c.open > 0;
      c.open = Math.max(0, c.open - dt * c.closeV);
      if (wasOpen && c.open === 0) sfx('clack');
      c.closedFor = c.open > 0 ? 0 : (c.closedFor || 0) + dt;
      if (c.closedFor >= CLOSE_HOLD) {
        c.closedFor = 0;
        grabTarget();
        if (c.held) sfx('grab');
        state = 'lift'; c.t = 0;   // the winch first reels in the slack, so the cable straightens before it pulls
      }
      break;
    }
    case 'lift':
      c.winch = Math.min(LIFT, c.winch + WINCH_ACC * dt);
      c.len = Math.max(L_MIN, c.len - c.winch * dt); c.t += dt;
      if (c.len <= L_MIN) {
        state = 'return'; c.winch = 0; sfx('clank');
        if (c.held && c.lose === 'top') c.topHit = true;   // to be shaken loose at the stop (see slip)
      }
      break;
    case 'return':
      slip(dt);
      if (Math.hypot(HOME.x - c.x, HOME.z - c.z) < .01 && Math.hypot(c.vx, c.vz) < .05) {
        c.x = HOME.x; c.z = HOME.z; c.vx = c.vz = 0; state = 'settle'; c.t = 0;
      }
      break;
    case 'settle': {
      // Wait over the hole for the swing to die down (up to a second) before letting go; with nothing
      // in the claw there is nothing to drop straight, so it opens right away
      c.t += dt; slip(dt);
      const h = c.head;
      if (!c.held || Math.hypot(h.x - c.x, h.z - c.z) < .05 && Math.hypot(h.vx, h.vz) < .25 || c.t > 1) {
        // (already open when a lost catch made it let go on the way: then there is nothing to open)
        if (c.open >= 1) { state = 'wait'; c.t = 0; c.shutIn = OPEN_HOLD; c.closeV = 0; }
        else { state = 'release'; c.openV = 0; sfx('motor'); }
      }
      break;
    }
    case 'release':
      c.slipping = null;
      c.openV = Math.min(RELEASE_SPEED, c.openV + RELEASE_ACC * dt);
      loosen(dt, c.openV);
      if (c.open >= 1) { state = 'wait'; c.t = 0; c.shutIn = OPEN_HOLD; c.closeV = 0; sfx('clunk'); c.head.vy += JOLT; }
      break;
    case 'wait':
      c.t += dt;
      if (c.t > WAIT_TIME) {
        if (coins > 0) {
          state = 'idle';
          if (prizes.length < RESTOCK_BELOW) spawn(PRIZE_COUNT - prizes.length, 5);   // restock from the top
        } else gameOver();
        hud();
      }
      break;
  }
  // Empty and done, it shuts again, so it is closed at the top for the next round
  if (state === 'wait' || state === 'idle' || state === 'aim') restClose(dt);
  c.dist = swingHead(dt);
  cableStep(dt);
  if (c.held) carry(dt); else flexFingers(dt);
}

// After letting go the claw stays open for OPEN_HOLD, then the motor shuts it the way it grabs: it
// speeds up to CLOSE_SPEED and stops with a clack and a jolt. The next round can start meanwhile; a
// drop opens it again.
function restClose(dt) {
  const c = claw;
  if (c.open <= 0 || (c.shutIn = (c.shutIn || 0) - dt) > 0) return;
  if (!c.closeV) sfx('motor');
  c.closeV = Math.min(CLOSE_SPEED, (c.closeV || 0) + CLOSE_ACC * dt);
  c.open = Math.max(0, c.open - c.closeV * dt);
  if (c.open === 0) { c.closeV = 0; sfx('clack'); c.head.vy += JOLT * .6; }
}

function gameOver() {
  state = 'over';
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(BEST_KEY, best); } catch (e) {} }
  $('ovStats').innerHTML = `Premios: ${won}<br>Puntos: ${score}<br>${rec && score > 0 ? '¡Nuevo récord!' : 'Récord: ' + best}`;
  $('over').hidden = false;
}

// Update the scoreboard on the base; it is only repainted when something on it changes
function hud() {
  const next = { coins: FREE_PLAY ? '∞' : coins, score, time: state === 'aim' ? String(Math.ceil(aimT)) : '–', low: state === 'aim' && aimT < 5, hint: state === 'idle' };
  if (Object.keys(next).some(k => next[k] !== board[k])) { Object.assign(board, next); boardTex.repaint(); }
}
const hudTime = hud;

// ---------- Sound (tiny synth, no assets) ----------

let ac = null;
function sfx(name) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    const tone = (f, f2, d, type, v, at = 0) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + at);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + at + d);
      g.gain.setValueAtTime(v, t + at); g.gain.exponentialRampToValueAtTime(0.001, t + at + d);
      o.connect(g).connect(ac.destination); o.start(t + at); o.stop(t + at + d + .02);
    };
    switch (name) {
      case 'coin': tone(988, 0, .08, 'square', .05); tone(1319, 0, .25, 'square', .05, .08); break;
      case 'drop': tone(600, 200, .6, 'triangle', .08); break;
      case 'clank': tone(180, 90, .12, 'square', .07); break;
      case 'clack': tone(320, 140, .07, 'square', .08); tone(90, 60, .1, 'triangle', .1); break;
      case 'clunk': tone(200, 90, .09, 'square', .08); tone(70, 45, .14, 'triangle', .12); break;
      case 'motor': tone(110, 170, .3, 'sawtooth', .025); break;
      case 'grab': tone(400, 800, .12, 'triangle', .08); break;
      case 'slip': tone(220, 80, .3, 'sawtooth', .05); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, .18, 'square', .05, i * .09)); break;
    }
  } catch (e) {}
}

// ---------- Input ----------

// Moving while idle spends a coin and starts the round
function press(dir) {
  if (state === 'idle') startRound();
  keys[dir] = true;
}
function dropButton() { if (state === 'idle') startRound(); else startDrop(); }

const KEY_DIR = { ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r', ArrowUp: 'u', w: 'u', ArrowDown: 'd', s: 'd' };
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === ' ' || k === 'Enter' || KEY_DIR[k]) e.preventDefault();
  if (e.repeat) return;
  if (state === 'over') { if (k === ' ' || k === 'Enter') reset(); return; }
  if (KEY_DIR[k]) press(KEY_DIR[k]);
  else if (k === ' ' || k === 'Enter') dropButton();
});
addEventListener('keyup', e => {
  const dir = KEY_DIR[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (dir) keys[dir] = false;
});

for (const b of document.querySelectorAll('#pad button')) {
  const dir = b.dataset.dir;
  b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); b.classList.add('on'); press(dir); });
  const up = () => { keys[dir] = false; b.classList.remove('on'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
}
$('bd').addEventListener('pointerdown', dropButton);
$('again').addEventListener('click', reset);
addEventListener('blur', () => { keys.l = keys.r = keys.u = keys.d = false; });

// ---------- Layout and loop ----------

// Frame the machine: the camera backs off just enough for the cabinet's corners (FIT_CORNERS) to fit
// between the top of the screen and the controls, and the view is shifted so the machine sits centred
// in that gap. The scoreboard is on the machine itself, so nothing takes room at the top. On wide
// screens the controls sit in the bottom corners, beside the machine, so they take no height.
const FIT_CORNERS = [];
for (const x of [-2.4, 2.4]) for (const y of [-1.72, 5.45]) for (const z of [-1.9, 1.9]) FIT_CORNERS.push(new THREE.Vector3(x, y, z));
function fit() {
  const w = innerWidth, h = innerHeight, wide = w / h > 1.2;
  document.body.classList.toggle('wide', wide);
  const topPad = 8, botPad = wide ? 8 : $('controls').offsetHeight + 16, freeH = Math.max(150, h - topPad - botPad);
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.clearViewOffset();
  const v = new THREE.Vector3();
  // The machine's extent on screen, in pixels, with the camera this far back
  const extent = dist => {
    camera.position.copy(CAM_TARGET).addScaledVector(CAM_DIR, dist);
    camera.lookAt(CAM_TARGET); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    let top = 1e9, bottom = -1e9, width = 0;
    for (const p of FIT_CORNERS) {
      v.copy(p).project(camera);
      const y = (1 - v.y) / 2 * h;
      top = Math.min(top, y); bottom = Math.max(bottom, y); width = Math.max(width, Math.abs(v.x) * w);
    }
    return { top, bottom, width };
  };
  let lo = 3, hi = 80;
  for (let i = 0; i < 30; i++) {
    const m = (lo + hi) / 2, e = extent(m);
    if (e.bottom - e.top > freeH || e.width > w - 16) lo = m; else hi = m;
  }
  const e = extent(hi);
  camera.setViewOffset(w, h, 0, (e.top + e.bottom) / 2 - (topPad + freeH / 2), w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', fit);

let last = performance.now(), acc = 0, paused = false;   // paused: only for inspecting with game.step
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000);
  last = now; acc = paused ? 0 : acc + dt;
  while (acc >= STEP) { update(STEP); physics(STEP, false); acc -= STEP; }
  draw(now);
  requestAnimationFrame(frame);
}

function draw(now) {
  for (const p of prizes) p.mesh.position.set(p.x, p.y, p.z);
  syncClaw();
  const tick = Math.floor(now / 160);
  for (const [b, i] of bulbs) b.material = (i + tick) % 3 === 0 ? BULB_ON : BULB_OFF;
  hudTime();
  renderer.render(scene, camera);
}

// Handle for poking at the game from the console
window.game = { get state() { return state; }, get paused() { return paused; }, set paused(v) { paused = v; }, get claw() { return claw; }, get prizes() { return prizes; }, get score() { return score; }, startRound, startDrop, segments, cable,
  // Run n simulation steps right now, without waiting for frames (fast, repeatable tests)
  step(n = 1) { for (let i = 0; i < n; i++) { update(STEP); physics(STEP, false); } },
  // Draw the current state right now (the browser pane may not be asking for frames)
  draw() { draw(performance.now()); },
  // Look at a point from close up (to inspect the claw); fit() puts the normal view back
  closeUp(x, y, z, dist = 1.6) {
    camera.clearViewOffset(); camera.position.set(x + dist * .35, y + dist * .45, z + dist);
    camera.lookAt(x, y, z); camera.updateProjectionMatrix(); draw(performance.now());
  },
  fit };

reset();
fit();
requestAnimationFrame(frame);
</script>
</body>
