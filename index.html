<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claw Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1b1430; --ink: #fff6e0; --pink: #e8457a; --pink-dark: #8a1f48; --gold: #ffd23f; --panel: #2b1850; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--ink); font-family: Kalam, "Comic Sans MS", cursive; font-weight: 700;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; inset: 0; }
  #controls {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; align-items: center; gap: 28px; pointer-events: none;
  }
  body.wide #controls { justify-content: space-between; padding: 0 max(24px, 5vw); }
  /* Settings: pad on the right, the drop button on the left (for right-handed players) */
  body.swap #controls { flex-direction: row-reverse; }
  /* Pad: a joystick like the maze game's. Its base rests here; touched, it jumps to the finger and the
     knob follows it, and how far you push sets the speed. */
  #pad { position: relative; width: 150px; height: 150px; pointer-events: auto; touch-action: none; cursor: grab; }
  #stick { position: absolute; left: 50%; top: 50%; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; pointer-events: none;
    background: rgba(232, 69, 122, .22); border: 4px solid var(--pink-dark); box-shadow: 0 4px 0 rgba(138, 31, 72, .6); }
  #knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: var(--pink); border: 4px solid var(--pink-dark); box-shadow: 0 4px 0 var(--pink-dark); }
  #gear { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center; font: inherit; font-size: 26px; line-height: 1; color: var(--ink); cursor: pointer;
    background: var(--panel); border: 3px solid var(--gold); border-radius: 12px; }
  #lvlBtn, #galBtn { position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center; cursor: pointer; background: var(--panel); border: 3px solid var(--gold); border-radius: 12px;
    font: inherit; font-size: 26px; line-height: 1; color: var(--gold); }
  #galBtn { left: calc(max(10px, env(safe-area-inset-left)) + 52px); }
  #galBtn .cap { width: 24px; height: 24px; box-shadow: none; }
  /* A capsule drawn in CSS for the gallery: its colour (--c) with a highlight, the lower half a little
     darker, and the dark band where the halves meet, tilted like a toy lying on a shelf */
  .cap { --c: #ff5d8f; position: relative; width: 76px; height: 76px; border-radius: 50%; overflow: hidden; transform: rotate(-18deg);
    background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .8) 0 6%, transparent 20%),
      radial-gradient(circle at 50% 38%, var(--c) 0 50%, color-mix(in srgb, var(--c) 55%, #000) 100%);
    box-shadow: 0 6px 0 rgba(0, 0, 0, .28); }
  .cap::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: rgba(0, 0, 0, .12); }
  .cap::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 12%; margin-top: -6%; background: #2a1d40; }
  .cap.gold { --c: #ffd23f; }
  .cap.mini { display: inline-block; width: 26px; height: 26px; box-shadow: none; flex: none; vertical-align: middle; }
  /* "Any colour" in a level's goal: a capsule of all the colours */
  .cap.any { background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .8) 0 6%, transparent 20%),
      conic-gradient(#ff5d8f 0 20%, #4cc9f0 0 40%, #80ed99 0 60%, #b388ff 0 80%, #ff9f43 0); }
  /* The gallery and the levels: screens of their own over the machine */
  .screen { position: fixed; inset: 0; overflow-y: auto; touch-action: pan-y; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background: radial-gradient(ellipse at 50% 0%, #3a2366, var(--bg) 70%); display: flex; flex-direction: column; align-items: center; }
  .screen h2 { margin: 6px 0 0; font-size: 38px; color: var(--gold); text-shadow: 0 3px 0 var(--pink-dark); }
  .screen .sub { margin: 0 0 18px; font-size: 20px; opacity: .85; text-align: center; }
  /* The seasons side by side, one at a time: swipe (or the arrows) to the next, which peeks in at the
     side. The user asked for it (October 2026); they were stacked one under the other. */
  #shelf { position: relative; display: flex; gap: 14px; width: 100%; max-width: 600px; overflow-x: auto; scroll-snap-type: x mandatory; touch-action: pan-x pan-y;
    scrollbar-width: none; overscroll-behavior-x: contain; }
  #shelf::-webkit-scrollbar { display: none; }
  .season { flex: 0 0 86%; scroll-snap-align: center; }
  .season:not(.on) { cursor: pointer; }
  #galNav { display: flex; align-items: center; gap: 14px; margin: 14px 0 22px; }
  #galNav button { width: 40px; height: 40px; padding: 0; font: inherit; font-size: 28px; line-height: 1; color: var(--gold); background: var(--panel);
    border: 3px solid var(--gold); border-radius: 50%; cursor: pointer; }
  #galNav button:disabled { opacity: .3; cursor: default; }
  #galDots { display: flex; gap: 8px; }
  #galDots i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); opacity: .3; }
  #galDots i.on { opacity: 1; background: var(--gold); }
  .backs { margin-top: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .back.alt { background: var(--panel); color: var(--ink); border-color: var(--gold); }
  .season h3 { display: flex; justify-content: space-between; margin: 0 4px 10px; font-size: 22px; color: var(--gold); }
  .season.locked .shelf { opacity: .5; }
  .shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  /* Season patterns over the capsule's colour: white stripes, white dots */
  .cap.stripes { background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .8) 0 6%, transparent 20%),
      repeating-linear-gradient(-50deg, rgba(255, 255, 255, .55) 0 12%, transparent 12% 30%),
      radial-gradient(circle at 50% 38%, var(--c) 0 50%, color-mix(in srgb, var(--c) 55%, #000) 100%); }
  .cap.dots { background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .8) 0 6%, transparent 20%),
      radial-gradient(circle, rgba(255, 255, 255, .75) 0 18%, transparent 20%) 0 0 / 34% 34%,
      radial-gradient(circle at 50% 38%, var(--c) 0 50%, color-mix(in srgb, var(--c) 55%, #000) 100%); }
  /* A special capsule's sign (bomb -1, skull, +2) */
  .cap.sign::before { content: attr(data-sign); top: 0; height: auto; display: grid; place-items: center; background: none; color: var(--fg);
    font: 700 15px/1 Kalam, sans-serif; z-index: 1; transform: rotate(18deg); }
  #galBtn.new::after { content: ''; position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--pink); border: 2px solid var(--ink); }
  .stars { font-size: 44px; color: var(--gold); letter-spacing: 2px; }
  .stars i { font-style: normal; opacity: .25; }
  .stars.sm { font-size: 22px; letter-spacing: 0; }
  .card small { font-size: 17px; opacity: .8; }
  .lvl .tags { display: flex; flex-wrap: wrap; gap: 4px 6px; width: 100%; font-size: 15px; }
  .lvl .tag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 8px; background: rgba(255, 255, 255, .1); }
  .lvl .tag .cap.mini { width: 18px; height: 18px; }
  .lvl .tag.boss { background: var(--pink); }
  .lvl.daily { border-color: #4cc9f0; }
  .lvl.daily .n { background: #4cc9f0; color: #13223a; }
  .lvl .goal b { width: 100%; font-size: 20px; color: #4cc9f0; }
  .slot { background: var(--panel); border: 4px solid var(--pink-dark); border-radius: 18px; padding: 16px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .slot.none .cap { filter: grayscale(1) brightness(.35); box-shadow: none; }
  .slot.none .num, .slot.none .name { opacity: .45; }
  .slot .num { font-size: 30px; line-height: 1; color: var(--gold); }
  .slot .name { font-size: 17px; line-height: 1; }
  .back { font: inherit; font-size: 24px; color: #3a1f00; background: var(--gold); border: 4px solid #a8740a; border-radius: 16px;
    padding: 8px 24px; cursor: pointer; box-shadow: 0 5px 0 #a8740a; }
  .back:active { transform: translateY(4px); box-shadow: 0 1px 0 #a8740a; }
  /* Levels: one row each, with its number, its goal (capsules and how many), its coins and whether it
     is done (a star), open to play, or still locked */
  #lvlList { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 520px; margin-bottom: 24px; }
  .lvl { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--panel); border: 4px solid var(--pink-dark); border-radius: 18px;
    font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
  .lvl.cur { border-color: var(--gold); }
  .lvl.locked { opacity: .45; cursor: default; }
  .lvl .n { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: var(--pink); color: var(--ink); }
  .lvl .goal { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 22px; }
  .lvl .goal span { display: flex; align-items: center; gap: 4px; }
  .lvl .coins { display: block; width: 100%; font-size: 16px; opacity: .75; }
  .lvl .st { flex: none; font-size: 28px; color: var(--gold); }
  .card .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .card button.alt { background: var(--panel); color: var(--ink); border-color: var(--gold); }
  .card .goal { display: inline-flex; align-items: center; gap: 4px; margin: 0 6px; }
  #opts { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 5, 25, .65); padding: 16px; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 6px 0 20px; font-size: 22px; text-align: left; cursor: pointer; }
  .opt input { width: 26px; height: 26px; accent-color: var(--gold); cursor: pointer; }
  #controls button {
    pointer-events: auto; font: inherit; color: var(--ink); background: var(--pink); border: 4px solid var(--pink-dark);
    border-radius: 16px; font-size: 22px; cursor: pointer; box-shadow: 0 5px 0 var(--pink-dark); padding: 0;
  }
  #controls button:active, #controls button.on { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-dark); }
  #controls #bd {
    width: 120px; height: 120px; border-radius: 50%; font-size: 26px;
    background: var(--gold); color: #3a1f00; border-color: #a8740a; box-shadow: 0 6px 0 #a8740a;
  }
  #over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 5, 25, .65); padding: 16px; }
  .card { background: var(--panel); border: 5px solid var(--gold); border-radius: 22px; padding: 22px 30px; text-align: center; max-width: 360px; width: 100%; }
  .card h2 { margin: 0 0 8px; font-size: 34px; color: var(--gold); }
  .card p { margin: 0 0 18px; font-size: 22px; line-height: 1.4; }
  .card button { font: inherit; font-size: 24px; color: #3a1f00; background: var(--gold); border: 4px solid #a8740a; border-radius: 16px; padding: 8px 24px; cursor: pointer; }
</style>

<body>
<div id="controls">
  <div id="pad" aria-label="Mover la garra"><div id="stick"><div id="knob"></div></div></div>
  <button id="bd">¡BAJAR!</button>
</div>
<button id="gear" aria-label="Ajustes">⚙</button>
<button id="lvlBtn" aria-label="Niveles">★</button>
<button id="galBtn" aria-label="Galería de premios"><div class="cap"></div></button>
<div id="gallery" class="screen" hidden>
  <h2>Mis premios</h2>
  <p id="galTotal" class="sub"></p>
  <div id="shelf"></div>
  <div id="galNav"><button id="galPrev" aria-label="Temporada anterior">‹</button><span id="galDots"></span><button id="galNext" aria-label="Temporada siguiente">›</button></div>
  <div class="backs"><button id="galToLvl" class="back alt">★ Niveles</button><button id="galBack" class="back">Volver a la máquina</button></div>
</div>
<div id="levels" class="screen" hidden>
  <h2>Niveles</h2>
  <p id="lvlSub" class="sub"></p>
  <div id="lvlList"></div>
  <div class="backs"><button id="lvlToGal" class="back alt">Galería</button><button id="lvlBack" class="back">Volver a la máquina</button></div>
</div>
<div id="opts" hidden>
  <div class="card">
    <h2>Ajustes</h2>
    <label class="opt"><span>Pad a la derecha</span><input type="checkbox" id="swap"></label>
    <button id="optsOk">Listo</button>
  </div>
</div>
<div id="over" hidden>
  <div class="card">
    <h2 id="ovTitle"></h2>
    <p id="ovStats"></p>
    <div class="row"><button id="again"></button><button id="ovLevels" class="alt">Niveles</button></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';

// World units: the glass box is 4 wide (x), 3 deep (z), the floor is y = 0.
// The prize hole is the front-left corner: x < HOLE.x and z > HOLE.z.
const BOX = { x: 2, z: 1.5 };
const HOLE = { x: -1.1, z: 0.6 };
const HOLE_WALL_H = 1.1;
const HOLE_WALLS = [   // the clear walls around the hole, as boxes
  { min: [HOLE.x - .03, 0, HOLE.z - .03], max: [HOLE.x + .03, HOLE_WALL_H, BOX.z] },
  { min: [-BOX.x, 0, HOLE.z - .03], max: [HOLE.x + .03, HOLE_WALL_H, HOLE.z + .03] },
];
// Everything solid the prizes and the claw collide with besides the glass and the floor: the hole
// walls and the level's pedestals (see setSolids)
const WALLS = [...HOLE_WALLS];
const HOME = { x: (-BOX.x + HOLE.x) / 2, z: (HOLE.z + BOX.z) / 2 };
const LIMIT = { x: 1.7, z: 1.2 };
// The claw's body is a small rounded box around the head point, like the carriage: HUB_R out to its
// sides, from HUB_DOWN below the head point to HUB_UP above it, and it collides as a cylinder that
// size. The cable hooks onto its top (HOOK_UP), and the fingers hinge at its bottom edge (PIVOT_R
// out, PIVOT_DOWN down).
const HUB_R = .17, HUB_DOWN = .14, HUB_UP = .14, HOOK_UP = HUB_UP + .02;
// Each finger, closed, in its own plane: (out, down) from its hinge. Three straight parts: out and
// down to a first knee, nearly straight down to a second, then a shorter tip hooked in under the claw.
const FINGER_SHAPE = [[0, 0], [.26, .18], [.25, .58], [.06, .74]];
const PIVOT_R = .15, PIVOT_DOWN = .12, CLOSED_TIP_DOWN = PIVOT_DOWN + FINGER_SHAPE[FINGER_SHAPE.length - 1][1];
// How far (radians) the motor swings the fingers out when fully open, and the deepest a finger point
// reaches, open or closed
const OPEN_ANGLE = .4;
const FINGER_REACH = PIVOT_DOWN + Math.max(...FINGER_SHAPE.flatMap(([u, d]) => [d, -u * Math.sin(OPEN_ANGLE) + d * Math.cos(OPEN_ANGLE)]));
const CARRIAGE_Y = 4.3, HEAD0 = CARRIAGE_Y - HOOK_UP - .12;   // at the top the hook sits just under the carriage
const G = 14, STEP = 1 / 120;
const MOVE = 1.6, DROP = 2.2, LIFT = 1.8;
// Claw dynamics: the carriage accelerates and brakes, the winch ramps up, and the head is a
// mass hanging from an elastic cable, so it swings, bounces and goes slack when it lands
// The head is heavy (HEAD_MASS) and its swing is damped against the carriage, so it sways a little and settles fast
const ACC = 2.2, WINCH_ACC = 8;
const HEAD_MASS = 2.5, ROPE_K = 2200, ROPE_C = 60, SWING_DRAG = 2.5;
const HEAD_MIN_Y = FINGER_REACH + .02;                   // the finger tips touch the floor here
const L_MIN = CARRIAGE_Y - HEAD0, L_MAX = CARRIAGE_Y - HEAD_MIN_Y + .2;
// The drop lasts as long as paying out all the cable takes (DROP_TIME), then the claw sits DROP_REST
// before closing. DROP_SLACK is the most loose cable the winch lets out once the claw rests on something.
const DROP_TIME = (L_MAX - L_MIN) / DROP + DROP / (2 * WINCH_ACC), DROP_REST = .3, DROP_SLACK = .45;
// Finger give: how fast a pressed finger swings up (radians per unit of overlap, per step), how far
// it can, how fast it springs back (radians per second), and the widest a finger can ever swing
const FLEX_GAIN = 6, FLEX_MAX = 1.1, FLEX_RETURN = 1.5, FLEX_MAX_ANGLE = 1.6;
// ...the fastest a finger can be pushed open (radians per second), and how much of the most-opened
// finger's give the others follow while the claw comes down (see flexFingers)
const FLEX_RATE = 1.8, FLEX_LINK = .8;
const HOLD_SETTLE = 6;   // how fast (per second) a caught prize slides to the middle and the fingers even out
const CENTER_SPEED = .5; // the fastest the rising fingers push a caught prize in to the middle (see carry)
// How a caught prize moves about inside the claw (see wobble): restoring spring and damping (per
// second), how far it can go sideways and up, how much of its speed it keeps when it bounces off the
// sides or the box, and its springy contact with the fingers under it (stiffness, damping, and the
// deepest it may press in)
const WOBBLE = { k: 30, c: 4, side: .025, up: .05, bounce: .5, floorK: 6000, floorC: 20, sink: .012 };
// The closing motor speeds up (CLOSE_ACC, in open-fractions per second²) to CLOSE_SPEED, so the claw
// shuts with a snap rather than easing in
const CLOSE_SPEED = 5, CLOSE_ACC = 22;
// The claw is closed at the top and only opens on the way down (OPEN_RATE, open-fractions per second).
// Letting go over the hole is mechanical (the user asked for both, October 2026): the motor speeds up
// to RELEASE_SPEED and the fingers hit their stop with a clunk and a jolt (JOLT, an upward kick to the
// head on its cable), the claw stays open OPEN_HOLD seconds, then shuts like the grab, with a clack
// (see restClose)
const OPEN_RATE = 2.5;
const RELEASE_SPEED = 4, RELEASE_ACC = 16, OPEN_HOLD = .5, JOLT = .9;
// Losing a catch on purpose (see slip): the chance (LOSE_BASE, plus LOSE_OFF the further off centre it
// was caught; gold ones 1.6 times as often); how fast the fingers fly open when the box hits the
// carriage (TOP_KICK times the speed of the blow) and how long before the motor shuts them again;
// and for the other kind, how much of the way back the claw has covered when it lets go, and how fast
// it opens
const LOSE_BASE = .045, LOSE_OFF = .24, TOP_KICK = 7, TOP_SHUT_IN = .3;
const TOP_BOUNCE = .35;   // how much of its speed the claw keeps, back down, when its box hits the carriage
// Knocked open at the top, the claw opens only until its tips are TOP_GAP clear of the prize all round
// (less than a normal opening, as the user asked, October 2026); a prize still caught on a tip
// TOP_SHUT_IN later is let down by opening further at TOP_EASE (open-fractions per second)
const TOP_GAP = .02, TOP_EASE = 1.5;
const LOSE_EARLY_AT = .4, LOSE_EARLY_RATE = 6;
// For testing, catches can go round a pattern instead, e.g. ['early', 'top', null]: one lost on the
// way to the hole, one shaken loose at the top, one carried home, whatever the grip (only catches
// count, never a round where the claw came up empty). With the levels the user asked for the normal,
// more realistic chance again, keeping both kinds of loss (October 2026).
const LOSE_PATTERN = null;
const CLOSE_GIVE = .03;  // while closing, how far a finger digs into a jammed prize before it gives way
const CLOSE_HOLD = .35;  // seconds the motor keeps squeezing once fully closed, before lifting
// Rope: velocity kept per step, link passes per step, and the sideways nudge that lets slack bow out
const CABLE_DAMP = .995, CABLE_ITERS = 30, CABLE_NUDGE = 2e-5;
const AIM_TIME = 15;
// For testing: rounds cost nothing, the board shows ∞ coins and a level is never lost. (On for a
// while at the user's request, October 2026; off since the levels, which each give their coins.)
const FREE_PLAY = false;
// Seconds after letting go before the next round can start (it was 1.2)
const WAIT_TIME = .3;
// Few enough capsules to leave gaps for the fingers, and sizes close together: a tight carpet of
// capsules only lets the claw pinch tops, small ones sit too low to reach and big ones squeeze out
// (15 for now: the user asked for it, October 2026; it was 66, a heap)
const PRIZE_COUNT = 15, R_MIN = .29, R_MAX = .32, RESTOCK_BELOW = 8;
const PILE_SPARE = 2;   // a level's pile has this many more of each kind it asks for than it still needs
const SETTLE_STEPS = 600;   // physics steps (5 s) run at a reset so the pile is settled when shown
const COLORS = [0xff5d8f, 0x4cc9f0, 0x80ed99, 0xb388ff, 0xff9f43];
// The kinds of prize, as the gallery lists them: one per colour, then the gold ones
const KINDS = [...COLORS.map((c, i) => ({ key: c.toString(16), css: '#' + c.toString(16).padStart(6, '0'), name: ['Rosa', 'Celeste', 'Verde', 'Violeta', 'Naranja'][i] })),
  { key: 'gold', css: '#ffd23f', name: 'Dorada' }];
const KIND = Object.fromEntries(KINDS.map(k => [k.key, k]));

// Prizes that aren't colours: traps and a bonus (not in the gallery), and the bosses' giant capsule.
// A bomb in the hole costs a coin, the skull loses the level, the +2 one gives two coins. They are
// dark or white capsules with their sign printed round them (see iconMat).
const SPECIAL = {
  bomb: { name: 'Bomba', css: '#2a2233', fg: '#ff5a4d', sign: '💣', disc: '#ff5a4d' },
  skull: { name: 'Calavera', css: '#2a2233', fg: '#f4f0ff', sign: '💀', disc: '#f4f0ff' },
  bonus: { name: '+2 fichas', css: '#fff6e0', fg: '#d99a00', sign: '+2' },
  // The bosses' capsule: as big as the claw can hold, and it slips out more (slip times the usual
  // chance). It was 0.42 at first, to be pushed into a hole without walls, but bigger than the closed
  // claw it rode up wedged in the fingers, overlapping them and the box; the user found the claw looked
  // broken. At 0.36 the claw holds it like any capsule when it comes down near its middle.
  giant: { name: 'Gigante', css: '#ffd23f', r: .36, slip: 3 },
};
const kindKey = name => name === 'any' ? 'any' : (KINDS.find(k => k.name === name) || { key: name }).key;

const shellMats = new Map();
function shellMat(kind, design) {

function pickDesign() {

// 'gold' (the rare ones) or a special one; if none is given it is a colour or gold at random, never the

function mkPrize(x, y, z, kind, design) {

  design = design || (SPECIAL[kind] ? 'plain' : pickDesign());
  const rare = kind === 'gold', size = lv.size || [R_MIN, R_MAX];

// corner) the first dozen are heaped over it, four to a layer.
function spawn(n, y0, initial, around) {
  const kinds = needed(initial).sort(() => rnd() - .5);
  for (let i = 0; i < n; i++) {
    let x, z, tries = 0;
    do {

// when the goal has many kinds, to keep the pile small), and its traps. One entry per prize missing.
// The +2 capsules only come with the first pile (initial), or every restock would bring a new one.
// The kinds the level keeps in one place (on the pedestal, buried) and the giant aren't restocked.
function needed(initial) {
  const goal = lv.goal, spare = goal.length > 3 ? 1 : PILE_SPARE, out = [];
  const want = (key, n) => { for (let i = prizes.filter(p => p.kind === key).length; i < n; i++) out.push(key); };
  for (const g of goal) if (g.key !== 'any' && g.key !== 'giant' && !lv.kept.has(g.key)) want(g.key, goalLeft(g) ? goalLeft(g) + spare : 0);
  for (const [k, n] of Object.entries(lv.traps || {})) want(k, n);

// (in the back right corner, where the glass on two sides keeps the heap over it from spreading out)
const GIANT_AT = { x: .4, z: .45 }, BURY_AT = { x: 1.6, z: -1.1 };

// Start (or retry) level i (-1: the daily challenge, see startDaily): its coins, nothing won towards it
// yet, and a fresh pile with what it asks for
function startLevel(i, data) {
  level = i; lv = data || LEVELS[i]; got = {}; endT = null; lostTo = null; streak = 0; roundOpen = false; coinFlash = 0;
  reset();
}

function reset() {
  for (const p of prizes) scene.remove(p.mesh);
  prizes = [];
  // x, z, vx, vz: the carriage; len: cable paid out; winch: its current speed; head: the hanging claw
  claw = {
    x: HOME.x, z: HOME.z, vx: 0, vz: 0, len: L_MIN, winch: 0, dist: L_MIN, open: 0, flex: FINGER_ANGLES.map(() => 0), held: null, q: 0, t: 0,
    head: { x: HOME.x, y: CARRIAGE_Y - L_MIN, z: HOME.z, vx: 0, vy: 0, vz: 0, r: HUB_R },
  };
  setMass(claw.head, HEAD_MASS, false);
  lastSegs = null;
  resetCable();
  state = 'idle'; coins = lv.coins; score = 0; won = 0; caught = 0;
  // The level's pedestals, and the contact grid sized for its biggest capsules
  setSolids();
  CELL = 2 * Math.max(R_MAX, lv.size ? lv.size[1] : 0, lv.giant ? SPECIAL.giant.r : 0) + .06;
  // The prizes the level puts in place, still: the giant, the ones on the pedestals, the buried one
  const still = p => { p.vx = p.vz = 0; return p; };
  if (lv.giant) prizes.push(still(mkPrize(GIANT_AT.x, SPECIAL.giant.r, GIANT_AT.z, 'giant')));
  (STANDS[lv.stands] || []).forEach(([x0, x1, h], i) => {
    const k = lv.onTop[i];
    if (k) prizes.push(still(mkPrize((x0 + x1) / 2, h + R_MAX + .02, (STAND_Z[0] + STAND_Z[1]) / 2, k)));
  });
  if (lv.bury) prizes.push(still(mkPrize(BURY_AT.x, .3, BURY_AT.z, lv.bury)));
  const total = Math.max(lv.pile || PRIZE_COUNT, prizes.length + needed(true).length + 3);
  spawn(total - prizes.length, lv.bury ? .9 : 1, true, lv.bury && BURY_AT);

  // floor while settling, and whatever ends up over it is taken away before the level is shown (the
  // user saw capsules drop in by themselves as a level started, October 2026)
  for (let i = 0; i < SETTLE_STEPS; i++) physics(STEP, true);

}

// hole's clear walls. The claw is rigid, so every point moves by the same push.
function clawWallPush() {
  const h = claw.head, fr = clawFrame(), pts = [-HUB_DOWN + h.r, HUB_UP - h.r].map(up => [...clawPoint(fr, 0, 0, up), h.r]);
  for (const [a, b] of segments()) for (let i = 0; i <= 6; i++) {
    const t = i / 6;
    pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, FINGER_R]);
  }
  if (claw.held) pts.push([claw.held.x, claw.held.y, claw.held.z, claw.held.r]);
  const s = [0, 0, 0];
  for (const w of WALLS) for (const [x0, y0, z0, r] of pts) {
    const p = [x0 + s[0], y0 + s[1], z0 + s[2]];
    const q = p.map((v, i) => clamp(v, w.min[i], w.max[i]));
    const d = Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
    if (d >= r) continue;
    if (d > 0) { for (let i = 0; i < 3; i++) s[i] += (p[i] - q[i]) / d * (r - d); continue; }
    // The point is inside the wall: out through the nearest face
    let best = 1e9, axis = 0, dir = 1;
    for (let i = 0; i < 3; i++) for (const [face, sg] of [[w.min[i], -1], [w.max[i], 1]]) {
      const dist = Math.abs(p[i] - face) + r;
      if (dist < best) { best = dist; axis = i; dir = sg; }
    }
    s[axis] += dir * best;
  }
  return s;
}


// ---------- Contact solver ----------
// A small rigid-body solver for the spheres, run every STEP:
//   1. gravity;
//   2. find contacts, with a small margin so resting contacts are found every step;
//   3. solve contact impulses SOLVER_ITERS times: normal impulses (with restitution on hard impacts)
//      and Coulomb friction at the contact point, which also spins the spheres, so they roll, stack
//      and stop instead of sliding around;
//   4. move and rotate;
//   5. push apart whatever still overlaps, without adding velocity.
// The other side of a contact is another prize, the claw head (dynamic and heavy), a finger segment or
// the held prize (kinematic: they push with their own velocity), or the floor, glass and hole walls.

const SOLVER_ITERS = 12, POS_ITERS = 4, MARGIN = .01, SLOP = .003;
const MU = { prize: .45, claw: .7, floor: .6, glass: .15, wall: .3 };     // friction
const BOUNCE = { prize: .3, claw: 0, floor: .3, glass: .3, wall: .35 };   // restitution (the claw lands dead)
const BOUNCE_MIN = .6;   // slower impacts don't bounce, so resting contacts stay calm
const ROLL_DAMP = 1.2;   // rolling resistance, per second, while touching something
// The fastest (relative to the claw) a prize squeezed between a finger and the caught prize can be
// pushed out. Both are immovable to it, so a narrow wedge closing shot it out at up to 8 once the
// fingers stopped giving way after closing; real fingers and capsules would yield a little instead.
const SQUEEZE_MAX = 1;
const MAX_SPEED = 9, CLAW_PUSH_MAX = 3;
const ZERO = [0, 0, 0];

// Mass and inverse inertia (solid sphere); bodies that don't spin get iI = 0
function setMass(b, m, spins = true) { b.im = 1 / m; b.iI = spins ? 1 / (.4 * m * b.r * b.r) : 0; }

// The head stays put while the claw closes: it rests where it landed, and a finger that runs into a
// neighbour gives way (flexFingers) instead of lifting the whole claw off the prize it is closing on.
// Otherwise, pushes through the fingers or the held prize (contacts with their own vb) only reach the
// head in part: the motor is strong and the fingers shove prizes aside instead of the claw riding up
// on every one they touch.
const CLAW_FEEDBACK = .05;
// A held prize rides in the claw (kinematic): it pushes the others but they don't move it.
const imOf = (b, c) => (b.held || (b === claw.head && state === 'close')) ? 0 : b.im * (c && c.vb ? CLAW_FEEDBACK : 1);

function segParam(p, a, b) {
  const ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  return clamp(((p[0] - a[0]) * ab[0] + (p[1] - a[1]) * ab[1] + (p[2] - a[2]) * ab[2]) / (ab[0] ** 2 + ab[1] ** 2 + ab[2] ** 2), 0, 1);
}
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// n points from the prize a towards the other side; pen > 0 is overlap, pen < 0 a gap.
// b is the other body, or null for static surfaces (then vb is their velocity, zero). The fingers and the
// held prize are part of the claw: their contacts have b = the head, so the reaction pushes the whole claw,
// and vb is their own motion relative to the head (closing, tilting). Their velocity is the head's current
// velocity plus that, so when a contact brakes the claw the fingers brake with it instead of pushing on.
// Prizes sorted into a grid of cells as big as the largest pair can reach, so each prize is only
// checked against those in its own and the neighbouring cells, not against every other prize
let CELL = 2 * R_MAX + .06;   // (bigger in a level with bigger capsules, see reset)
const cellKey = (cx, cy, cz) => ((cx + 50) * 128 + (cy + 50)) * 128 + (cz + 50);
function prizeGrid() {
  const grid = new Map();
  prizes.forEach((p, i) => {
    const k = cellKey(Math.floor(p.x / CELL), Math.floor(p.y / CELL), Math.floor(p.z / CELL));
    (grid.get(k) || grid.set(k, []).get(k)).push(i);
  });
  return grid;
}

function findContacts(segs, segVel, margin, withClaw) {
  const out = [], h = claw.head, grid = prizeGrid();
  for (let i = 0; i < prizes.length; i++) {
    const a = prizes[i];
    if (a.held) continue;
    const add = (b, nx, ny, nz, pen, kind, vb) => {
      if (pen > -margin) out.push({ a, b, n: [nx, ny, nz], pen, kind, vb, jn: 0, jt: [0, 0, 0] });
    };
    const toPoint = (q, qr, kind, vb, b = null) => {
      const dx = q[0] - a.x, dy = q[1] - a.y, dz = q[2] - a.z, d = Math.hypot(dx, dy, dz);
      if (d > 1e-9) add(b, dx / d, dy / d, dz / d, a.r + qr - d, kind, vb);
    };
    const cx = Math.floor(a.x / CELL), cy = Math.floor(a.y / CELL), cz = Math.floor(a.z / CELL);
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) for (let oz = -1; oz <= 1; oz++) {
      const near = grid.get(cellKey(cx + ox, cy + oy, cz + oz));
      if (near) for (const j of near) if (j > i) { const b = prizes[j]; toPoint([b.x, b.y, b.z], b.r, 'prize', null, b); }
    }
    if (withClaw) {
      // The head collides as a short upright cylinder: landing on a capsule it presses straight down
      // instead of squirting it sideways out from under the claw, as a ball would
      const dx = a.x - h.x, dz = a.z - h.z, dxz = Math.hypot(dx, dz), s = dxz > h.r ? h.r / dxz : 1;
      toPoint([h.x + dx * s, clamp(a.y, h.y - HUB_DOWN, h.y + HUB_UP), h.z + dz * s], 0, 'claw', null, h);
      segs.forEach(([s0, s1], k) => {
        const t = segParam([a.x, a.y, a.z], s0, s1);
        toPoint(lerp3(s0, s1, t), FINGER_R, 'claw', segVel ? lerp3(segVel[k][0], segVel[k][1], t) : ZERO, h);
      });
    }
    if (!withClaw || !(a.x < HOLE.x && a.z > HOLE.z)) add(null, 0, -1, 0, a.r - a.y, 'floor', ZERO);   // no floor over the hole (but while settling, see reset)
    add(null, -1, 0, 0, a.r - (a.x + BOX.x), 'glass', ZERO);
    add(null, 1, 0, 0, a.r - (BOX.x - a.x), 'glass', ZERO);
    add(null, 0, 0, -1, a.r - (a.z + BOX.z), 'glass', ZERO);
    add(null, 0, 0, 1, a.r - (BOX.z - a.z), 'glass', ZERO);
    for (const w of WALLS) {
      const q = [clamp(a.x, w.min[0], w.max[0]), clamp(a.y, w.min[1], w.max[1]), clamp(a.z, w.min[2], w.max[2])];
      if (Math.hypot(a.x - q[0], a.y - q[1], a.z - q[2]) > 1e-9) { toPoint(q, 0, 'wall', ZERO); continue; }
      // The centre is inside the wall: out through the nearest face
      let best = 1e9, axis = 0, dir = 1;
      const p = [a.x, a.y, a.z];
      for (let k = 0; k < 3; k++) for (const [face, sg] of [[w.min[k], -1], [w.max[k], 1]]) {
        const dist = Math.abs(p[k] - face);
        if (dist < best) { best = dist; axis = k; dir = sg; }
      }
      const n = [0, 0, 0]; n[axis] = -dir;
      add(null, n[0], n[1], n[2], best + a.r, 'wall', ZERO);
    }
  }
  return out;
}

// Velocity of the other side relative to the prize, at the contact point
function relVel(c) {
  const a = c.a, b = c.b, n = c.n;
  const rax = n[0] * a.r, ray = n[1] * a.r, raz = n[2] * a.r;
  const va = [a.vx + a.wy * raz - a.wz * ray, a.vy + a.wz * rax - a.wx * raz, a.vz + a.wx * ray - a.wy * rax];
  let vb = c.vb;
  if (b && vb) vb = [b.vx + vb[0], b.vy + vb[1], b.vz + vb[2]];
  else if (b) {
    const rbx = -n[0] * b.r, rby = -n[1] * b.r, rbz = -n[2] * b.r, wx = b.wx || 0, wy = b.wy || 0, wz = b.wz || 0;
    vb = [b.vx + wy * rbz - wz * rby, b.vy + wz * rbx - wx * rbz, b.vz + wx * rby - wy * rbx];
  }
  return [vb[0] - va[0], vb[1] - va[1], vb[2] - va[2]];
}

// Impulse J on b at its contact point, and -J on a at its own
function applyImpulse(c, jx, jy, jz) {
  const a = c.a, b = c.b, n = c.n;
  a.vx -= jx * a.im; a.vy -= jy * a.im; a.vz -= jz * a.im;
  const rax = n[0] * a.r, ray = n[1] * a.r, raz = n[2] * a.r;
  a.wx -= a.iI * (ray * jz - raz * jy); a.wy -= a.iI * (raz * jx - rax * jz); a.wz -= a.iI * (rax * jy - ray * jx);
  if (!b) return;
  const im = imOf(b, c);
  b.vx += jx * im; b.vy += jy * im; b.vz += jz * im;
  if (b.iI && im && !c.vb) {
    const rbx = -n[0] * b.r, rby = -n[1] * b.r, rbz = -n[2] * b.r;
    b.wx += b.iI * (rby * jz - rbz * jy); b.wy += b.iI * (rbz * jx - rbx * jz); b.wz += b.iI * (rbx * jy - rby * jx);
  }
}

const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];

function solveContacts(cs, dt) {
  for (const c of cs) {
    const vn = dot(relVel(c), c.n);
    // Across a gap the bodies may still approach, just not past touching (no tunnelling, no fake bumps)
    c.target = c.pen < 0 ? c.pen / dt : (vn < -BOUNCE_MIN ? -BOUNCE[c.kind] * vn : 0);
  }
  for (let it = 0; it < SOLVER_ITERS; it++) for (const c of cs) {
    const a = c.a, b = c.b, n = c.n, imb = b ? imOf(b, c) : 0;
    // Normal: never pull, only push
    let v = relVel(c);
    const jn0 = c.jn;
    c.jn = Math.max(0, jn0 + (c.target - dot(v, n)) / (a.im + imb));
    const j = c.jn - jn0;
    if (j) applyImpulse(c, n[0] * j, n[1] * j, n[2] * j);
    // Friction: oppose sliding at the contact point, up to MU times the normal impulse
    v = relVel(c);
    const vn = dot(v, n), tx = v[0] - vn * n[0], ty = v[1] - vn * n[1], tz = v[2] - vn * n[2];
    const k = a.im + imb + a.r * a.r * a.iI + (b && imb && !c.vb ? b.r * b.r * (b.iI || 0) : 0);
    let jt = [c.jt[0] - tx / k, c.jt[1] - ty / k, c.jt[2] - tz / k];
    const max = MU[c.kind] * c.jn, len = Math.hypot(...jt);
    if (len > max) jt = jt.map(x => x * max / len);
    applyImpulse(c, jt[0] - c.jt[0], jt[1] - c.jt[1], jt[2] - c.jt[2]);
    c.jt = jt;
  }
}

// Move overlapping bodies apart directly (no velocity change), sharing the push by inverse mass
function separate(cs) {
  for (const c of cs) {
    if (c.pen <= SLOP) continue;
    const a = c.a, b = c.b, imb = b ? imOf(b, c) : 0, s = (c.pen - SLOP) * .9 / (a.im + imb), n = c.n;
    a.x -= n[0] * s * a.im; a.y -= n[1] * s * a.im; a.z -= n[2] * s * a.im;
    if (b && imb) { b.x += n[0] * s * imb; b.y += n[1] * s * imb; b.z += n[2] * s * imb; }
  }
}

// The finger segments one step ago, relative to the head, for their own motion (closing, tilting)
let lastSegs = null;
const rollAxis = new THREE.Vector3(), rollQ = new THREE.Quaternion();
function physics(dt, settling) {
  for (const p of prizes) if (!p.held) p.vy -= G * dt;

  const segs = segments(), h = claw.head;
  const segsRel = segs.map(s => s.map(q => [q[0] - h.x, q[1] - h.y, q[2] - h.z]));
  const segVel = lastSegs ? segsRel.map((s, i) => s.map((q, j) => q.map((v, k) => (v - lastSegs[i][j][k]) / dt))) : null;
  lastSegs = segsRel;

  const cs = findContacts(segs, segVel, MARGIN, !settling);
  solveContacts(cs, dt);
  // Is the claw (head or fingers) pressing on any prize? (see the drop's landing; walls count too, in swingHead)
  claw.touching = cs.some(c => c.b === claw.head && c.jn > 0);

  const touching = new Set(cs.filter(c => c.jn > 0).map(c => c.a));
  if (claw.held) {
    const onHeld = new Set(cs.filter(c => c.jn > 0 && c.b === claw.held).map(c => c.a));
    for (const c of cs) {
      const p = c.a;
      if (c.jn <= 0 || c.b !== h || !onHeld.has(p)) continue;
      const v = [p.vx - h.vx, p.vy - h.vy, p.vz - h.vz], s = Math.hypot(...v);
      if (s > SQUEEZE_MAX) { const k = SQUEEZE_MAX / s; p.vx = h.vx + v[0] * k; p.vy = h.vy + v[1] * k; p.vz = h.vz + v[2] * k; }
    }
  }
  // Likewise anything the claw pushes never leaves it faster than CLAW_PUSH_MAX (the fingers sweep in at
  // under 2): a loose capsule wedged in the closed fingers was shot out by the jolt at the top
  for (const c of cs) {
    const p = c.a;
    if (c.jn <= 0 || c.b !== h) continue;
    const v = [p.vx - h.vx, p.vy - h.vy, p.vz - h.vz], s = Math.hypot(...v);
    if (s > CLAW_PUSH_MAX) { const k = CLAW_PUSH_MAX / s; p.vx = h.vx + v[0] * k; p.vy = h.vy + v[1] * k; p.vz = h.vz + v[2] * k; }
  }
  for (const p of prizes) {
    if (p.held) continue;
    // A safety net: nothing in the machine moves faster than MAX_SPEED (a capsule dropped from the top
    // reaches about 8). The bosses' giant capsule, too big to be held, can ride up wedged in the closed
    // fingers, and the jolt at the top shot it out at up to 27.
    const s = Math.hypot(p.vx, p.vy, p.vz);
    if (s > MAX_SPEED) { const k = MAX_SPEED / s; p.vx *= k; p.vy *= k; p.vz *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (touching.has(p)) { const k = 1 - ROLL_DAMP * dt; p.wx *= k; p.wy *= k; p.wz *= k; }
    const w = Math.hypot(p.wx, p.wy, p.wz);
    if (w > 1e-4) p.mesh.quaternion.premultiply(rollQ.setFromAxisAngle(rollAxis.set(p.wx / w, p.wy / w, p.wz / w), w * dt));
  }
  for (let it = 0; it < POS_ITERS; it++) separate(findContacts(segs, null, 0, !settling));

  for (let i = prizes.length - 1; i >= 0; i--) {
    const p = prizes[i];
    if (!p.held && p.y < -.75) { scene.remove(p.mesh); prizes.splice(i, 1); if (!settling) win(p); }
  }
}

// ---------- Game flow ----------

// A round is judged when the next one starts (or, out of coins, before the level is lost), so a prize
// still dropping into the hole when the claw is back counts for it. A round that won a prize the goal
// wanted adds to the streak; STREAK_N in a row win a coin. One that didn't (or dropped a bomb in) ends it.
function endRound() {
  if (!roundOpen) return;
  roundOpen = false;
  streak = roundGood ? streak + 1 : 0;
  if (streak >= STREAK_N) { streak = 0; coins++; flashCoins('#80ed99'); sfx('coin'); }
}
const flashCoins = color => { coinFlash = 1.2; board.flashColor = color; };

function startRound() {
  if (state !== 'idle' || coins <= 0 || endT !== null) return;   // (not while a cleared or lost level's card is coming)
  endRound();
  roundOpen = true; roundGood = false;
  if (!FREE_PLAY) coins--;
  state = 'aim'; aimT = AIM_TIME; sfx('coin'); hud();
}

function startDrop() {
  if (state !== 'aim') return;
  state = 'drop'; claw.winch = 0; claw.t = 0; claw.landed = false; claw.target = null; claw.slipping = null; claw.lose = null; claw.letGo = 0; claw.reshut = false; claw.tripFrom = undefined; claw.dropping = null; keys.l = keys.r = keys.u = keys.d = false; sfx('drop');
}

// When the claw starts closing, pickTarget() notes the prize right under it whose top half the closed
// tips could reach. It stays loose while the fingers close around it; grabTarget() decides at the end.
function pickTarget() {
  const h = claw.head, tipY = clawPoint(clawFrame(), 0, 0, -CLOSED_TIP_DOWN)[1];
  let pick = null, bd = 1e9;
  for (const p of prizes) {
    const dx = Math.hypot(p.x - h.x, p.z - h.z);
    if (dx < p.r * .8 && p.y < h.y && tipY < p.y + p.r * .5 && dx < bd) { bd = dx; pick = p; }
  }
  claw.target = pick;
}

// How a prize of radius r, centred on the claw's axis at height oy (claw frame), sits in the claw with
// all fingers at one angle: { angle, oy } for where it rests, or null if it isn't held.
// - The closed fingers would press into it: they rest on it, a little open (the angle), which holds it
//   only if the tips end up under its middle.
// - It fits loose inside the closed claw (the curved fingers make a cage): it settles down onto the
//   inward-curling tips (the oy it drops to), unless it would drop right through between them.
function cradle(r, oy) {
  const fr = clawFrame();
  const at = th => fingers(FINGER_ANGLES.map(() => th - claw.open * OPEN_ANGLE));
  const ball = up => { const c = clawPoint(fr, 0, 0, up); return { x: c[0], y: c[1], z: c[2], r }; };
  const pen = (th, up) => Math.max(...at(th).map(fg => fingerPenOn(fg, ball(up))));
  const tipsUnder = (th, up) => Math.max(...at(th).map(fg => fg.t[1])) < ball(up).y - r * .1;
  if (pen(0, oy) > 0) {
    let lo = 0, hi = FLEX_MAX_ANGLE;
    if (pen(hi, oy) > 0) return null;
    for (let i = 0; i < 20; i++) { const m = (lo + hi) / 2; if (pen(m, oy) > 0) lo = m; else hi = m; }
    return tipsUnder(hi, oy) ? { angle: hi, oy } : null;
  }
  // Lower it bit by bit until it first touches a finger (heights: lower is more negative). Too far
  // down it would be past the tips and touch nothing, so a single deep probe can't tell.
  for (let up = oy - .01; up > oy - .6; up -= .01) {
    if (pen(0, up) > 0) return tipsUnder(0, up + .01) ? { angle: 0, oy: up + .01 } : null;
  }
  return null;   // it would drop right through
}

// When closing is done: the prize is caught only if it really is held (see cradle). If the fingers
// rest on it, all but one must touch it; if it sits loose in the closed cage, all fingers but one must
// have closed round it. One left splayed on a neighbour closes in once the claw lifts off the pile (the
// others' tips hold the prize meanwhile); two would leave too wide a gap. A prize only pinched at
// the top isn't caught: the claw rises without it. Once caught it rides in the claw (claw.hold, see
// carry): it stays where it lay until the rising fingers lift it, never moving up in the claw (no magnet).
function grabTarget() {
  const p = claw.target, h = claw.head;
  claw.target = null;
  if (!p) return;
  const dx = Math.hypot(p.x - h.x, p.z - h.z);
  if (dx > p.r * .8) return;
  const f = clawFrame(), rel = [p.x - h.x, p.y - h.y, p.z - h.z];
  const dot = v => rel[0] * v[0] + rel[1] * v[1] + rel[2] * v[2];
  const oy = -dot(f.d), cr = cradle(p.r, oy);
  if (!cr) return;
  if (cr.angle > 0 ? fingersOn(p, .02) < FINGER_ANGLES.length - 1 : claw.flex.filter(fl => fl > .3).length > 1) return;
  claw.q = 1 - dx / (p.r * .8);   // grip quality, 1 = dead centre
  // Will it be lost on the way (see slip)? About as often as the old per-second slips over a carry
  if (LOSE_PATTERN) claw.lose = LOSE_PATTERN[caught % LOSE_PATTERN.length];
  else {
    const lose = (LOSE_BASE + (1 - claw.q) * LOSE_OFF) * (p.rare ? 1.6 : 1) * (SPECIAL[p.kind]?.slip || 1);
    claw.lose = Math.random() < lose ? (Math.random() < .5 ? 'top' : 'early') : null;
  }
  caught++;
  const ox = dot(f.e1), oz = dot(f.e2);
  claw.hold = { ox, oz, oy, off0: Math.hypot(ox, oz), oy0: oy, restOy: cr.oy, flex: cr.angle - claw.open * OPEN_ANGLE };
  claw.held = p; p.held = true; p.wx = p.wy = p.wz = 0;
}

// The prize stops riding in the claw and is a loose body again (a slip, or letting go over the hole)
function detach() {
  const p = claw.held, h = claw.head;
  if (!p) return null;
  p.held = false; claw.held = null;
  p.vx = h.vx; p.vy = h.vy; p.vz = h.vz;
  return p;
}

// Carry the held prize. It doesn't move about in the claw by itself: it stays where it lay on the pile
// while the claw closes and starts to rise, until the fingers come up under it and lift it (at its rest
// height, see cradle). On the way they push it in to the middle, only as far as they have risen. An
// earlier version slid it down and to the middle at a steady rate, the moment it was caught, which
// looked like it was arranging itself in the claw (October 2026).
function carry(dt) {
  const c = claw, p = c.held, hd = c.hold, k = Math.min(1, HOLD_SETTLE * dt), h = c.head, f = clawFrame();
  if (!p) return;
  // Until lifted it stays put in the world (where it is in the claw is measured); once lifted it rides
  // with the claw (its place in the claw is kept, plus its wobble)
  const lifted = hd.oy <= hd.restOy;
  const rel = [p.x - h.x, p.y - h.y, p.z - h.z], dot = v => rel[0] * v[0] + rel[1] * v[1] + rel[2] * v[2];
  if (!lifted) hd.oy = Math.max(hd.restOy, Math.min(hd.oy, -dot(f.d)));
  const fall = hd.oy0 - hd.restOy, s = fall > 1e-3 ? (hd.oy - hd.restOy) / fall : 0;
  let ox = lifted ? hd.ox : dot(f.e1), oz = lifted ? hd.oz : dot(f.e2);
  // The push to the middle is also never faster than CENTER_SPEED. Tied to the rise alone, a prize with
  // little or no way to drop onto the fingers was snapped to the middle in a step or two, at up to
  // 30 m/s, and the capsules touching it took that speed: they flew up to the roof (October 2026).
  const off = Math.hypot(ox, oz), lim = Math.max(hd.off0 * s, off - CENTER_SPEED * dt);
  if (off > lim) { ox *= lim / off; oz *= lim / off; }
  hd.ox = ox; hd.oz = oz;
  // The claw stays shut until it lets go: no finger opens while carrying, not under the prize's weight
  // nor against a neighbour as it lifts off the pile (the neighbour is pushed aside instead). One left
  // splayed closes in to the cradle angle. The user asked for it (October 2026): the fingers used to
  // give way a little after closing, which looked like the claw opening again.
  for (let i = 0; i < c.flex.length; i++) if (c.flex[i] > hd.flex) c.flex[i] += (hd.flex - c.flex[i]) * k;
  if (hd.oy <= hd.restOy) wobble(hd, p, h, f, dt);

  p.vx = (p.x - was[0]) / dt; p.vy = (p.y - was[1]) / dt; p.vz = (p.z - was[2]) / dt;
  hd.hv = [h.vx, h.vy, h.vz];
}

// Once lifted, the prize isn't glued to the claw: it moves a little inside it (hd.wb, offsets and
// velocities along the claw's axes e1, e2 and up), as a loose ball on curved fingers would. The claw's
// own accelerations throw it about: it drops onto the fingers when they pick it up and bounces a
// little (WOBBLE.bounce), rocks back as the claw starts or brakes and rolls back to the middle, as in
// a bowl (WOBBLE.k, damped by WOBBLE.c). The fingers below it and the box above it stop it, and it
// stays within WOBBLE.side of the middle. The user found it too smooth and unreal (October 2026).
function wobble(hd, p, h, f, dt) {
  const up = f.d.map(v => -v), d3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  if (!hd.wb) {

    const rv = [p.vx - h.vx, p.vy - h.vy, p.vz - h.vz];
    hd.wb = { u: 0, w: 0, y: 0, vu: d3(rv, f.e1), vw: d3(rv, f.e2), vy: d3(rv, up) };
  }

  const a = [-(h.vx - hv[0]) / dt, -G - (h.vy - hv[1]) / dt, -(h.vz - hv[2]) / dt];
  wb.vu += (d3(a, f.e1) - WOBBLE.k * wb.u - WOBBLE.c * wb.vu) * dt;
  wb.vw += (d3(a, f.e2) - WOBBLE.k * wb.w - WOBBLE.c * wb.vw) * dt;
  wb.vy += d3(a, up) * dt;
  wb.u += wb.vu * dt; wb.w += wb.vw * dt; wb.y += wb.vy * dt;
  // Resting on the fingers: a stiff, springy contact, so a jolt (the cable taking the load as the claw
  // starts to lift, the stop at the top) presses it in a hair and it bounces back up
  if (wb.y < 0) {
    wb.vy -= (WOBBLE.floorK * wb.y + WOBBLE.floorC * wb.vy) * dt;
    if (wb.y < -WOBBLE.sink) { wb.y = -WOBBLE.sink; if (wb.vy < 0) wb.vy = 0; }
  }
  if (wb.y > WOBBLE.up) { wb.y = WOBBLE.up; if (wb.vy > 0) wb.vy *= -WOBBLE.bounce; }   // against the box
  const s = Math.hypot(wb.u, wb.w);
  if (s > WOBBLE.side) {
    const nu = wb.u / s, nw = wb.w / s, vn = wb.vu * nu + wb.vw * nw;
    wb.u = nu * WOBBLE.side; wb.w = nw * WOBBLE.side;
    if (vn > 0) { wb.vu -= (1 + WOBBLE.bounce) * vn * nu; wb.vw -= (1 + WOBBLE.bounce) * vn * nw; }
  }
}

// Carriage motor: approach the target velocity with limited acceleration, so it ramps up and brakes
function driveCarriage(tx, tz, dt) {
  const c = claw, ax = tx - c.vx, az = tz - c.vz, a = Math.hypot(ax, az), m = ACC * dt;
  if (a > m) { c.vx += ax / a * m; c.vz += az / a * m; } else { c.vx = tx; c.vz = tz; }
  c.x += c.vx * dt; c.z += c.vz * dt;
  if (Math.abs(c.x) > LIMIT.x) { c.x = Math.sign(c.x) * LIMIT.x; c.vx = 0; }
  if (Math.abs(c.z) > LIMIT.z) { c.z = Math.sign(c.z) * LIMIT.z; c.vz = 0; }
}

// The head is a point mass on an elastic cable that can only pull (it goes slack when the head lands).
// Gravity plus the cable make it a pendulum under the carriage. Returns the carriage-to-head distance.
function swingHead(dt) {
  const c = claw, h = c.head, mass = HEAD_MASS + (c.held ? c.held.r ** 3 / .03 : 0);
  const dx = h.x - c.x, dy = h.y - CARRIAGE_Y, dz = h.z - c.z, dist = Math.hypot(dx, dy, dz);
  // While closing, and while the winch then reels in the slack, the claw rests where it landed (see
  // imOf). Left free during the reel-in, it sank into the pile by up to 0.3 before the cable pulled.
  if (state === 'close' || (state === 'lift' && c.len > dist)) { h.vx = h.vy = h.vz = 0; return dist; }
  let ax = 0, ay = -G, az = 0;
  if (dist > c.len) {
    const nx = dx / dist, ny = dy / dist, nz = dz / dist;
    const vrel = (h.vx - c.vx) * nx + h.vy * ny + (h.vz - c.vz) * nz;
    const f = Math.max(0, ROPE_K * (dist - c.len) + ROPE_C * vrel) / mass;
    ax -= f * nx; ay -= f * ny; az -= f * nz;
  }
  // Damping acts on the swing relative to the carriage, so it doesn't make the claw lag while moving.
  // It comes from friction up at the carriage, which brakes a short pendulum hard and a long one
  // barely (it falls with the square of the cable length): heavy and steady at the top, but the claw
  // keeps the sway it had when it starts going down. A small floor stands for air drag.
  const k = SWING_DRAG * dt, ks = k * clamp((L_MIN / Math.max(dist, L_MIN)) ** 2, .1, 1);
  h.vx += ax * dt - (h.vx - c.vx) * ks; h.vy += ay * dt - h.vy * k * .2; h.vz += az * dt - (h.vz - c.vz) * ks;
  h.x += h.vx * dt; h.y += h.vy * dt; h.z += h.vz * dt;
  // Once it has landed the heavy claw stays where it came down, sinking but not skating sideways
  // over the round tops of the capsules under its fingers
  if (state === 'drop' && c.landed) { [h.x, h.z] = c.landed; h.vx = c.vx; h.vz = c.vz; }
  if (h.y < HEAD_MIN_Y) { h.y = HEAD_MIN_Y; if (h.vy < 0) h.vy *= -.2; h.vx *= .9; h.vz *= .9; }
  // The hole walls stop the claw: it rests on their top edge or slides off their sides
  const s = clawWallPush(), sl = Math.hypot(...s);

    h.x += s[0]; h.y += s[1]; h.z += s[2];
    const n = s.map(v => v / sl), vn = h.vx * n[0] + h.vy * n[1] + h.vz * n[2];

  }

  const top = CARRIAGE_Y - HOOK_UP - .05;

    h.y = top;
    if (h.vy > 0) { if (state === 'lift' && c.held && c.lose === 'top') hitTop(h.vy); h.vy *= -TOP_BOUNCE; }
  }

  if (Math.abs(h.x) > bx) { h.x = Math.sign(h.x) * bx; h.vx *= -.3; }
  if (Math.abs(h.z) > bz) { h.z = Math.sign(h.z) * bz; h.vz *= -.3; }

}

// The grip sometimes gives way. Whether a catch will be lost, and how, is settled when it is caught
// (claw.lose, see grabTarget: for now a fixed pattern, LOSE_PATTERN), and the claw never opens while
// it rises. The user asked for these two kinds (October 2026); before, a slip could start at any
// moment, mid-rise included, which looked odd. Either way the claw keeps going to the hole as usual,
// and the prize just falls, with the claw's speed, wherever that leaves it.
// - 'top': the winch pulls the claw's box up into the carriage (see the lift and hitTop). The blow
//   knocks the fingers open and the prize is loose from that moment, so nothing places it: it keeps
//   going up with the speed it had, knocks against the box as the claw bounces back down, and falls
//   out between the opening fingers. After TOP_SHUT_IN the motor shuts them again on the way
//   (restClose). The user found the earlier version, which opened the claw at its highest point on
//   its cable without any real blow, didn't feel like the hit shook the prize loose (October 2026).
// - 'early': on the way back, once the claw has covered LOSE_EARLY_AT of the trip, it opens, a bit
//   faster than letting go over the hole (LOSE_EARLY_RATE), and stays open; it shuts over the hole.
//   (The user found opening just before the hole wrong, and then 0.35 s after setting off too soon.)
// c.letGo is the opening rate while a lost catch opens the claw; claw.slipping is the prize slipping
// out (the fingers open until it drops out between the tips, see loosen); c.reshut is the closing.
function slip(dt) {

    return;

    // They don't shut again on the prize: not before it is out below the tips (falling through the
    // claw takes about 0.35 s). Caught on a tip (not falling), it is let down by opening a little more.
    if (d) {
      if (d.y + d.r > Math.min(...fingers().map(fg => fg.t[1]))) {
        if ((c.shutIn -= dt) < 0 && d.vy > -.3) c.open = Math.min(1, c.open + TOP_EASE * dt);
        return;
      }
      c.dropping = null;
    }
    restClose(dt); if (c.open === 0) c.reshut = false; return;
  }
  if (!p || c.lose !== 'early' || state !== 'return') return;
  const left = Math.hypot(HOME.x - c.x, HOME.z - c.z);
  if (c.tripFrom === undefined) c.tripFrom = left;
  if (left <= c.tripFrom * (1 - LOSE_EARLY_AT)) { c.slipping = p; c.letGo = LOSE_EARLY_RATE; }
}

// The claw's box hits the carriage at speed v with a catch to be lost there. The winch's limit switch
// cuts it and lets the cable back out to its normal length, so the claw bounces down on it. The blow
// knocks the fingers open, faster the harder it hits (TOP_KICK), and the prize, no longer held, keeps
// the speed it was rising with (it isn't stopped by the carriage, only by the box above it).
function hitTop(v) {

  state = 'return'; c.winch = 0; c.len = L_MIN;
  c.letGo = TOP_KICK * v;

}

// Open the fingers at this rate. The prize stays in the claw while they open and only comes loose
// once the tips are clear of it, so it drops straight out. Let go of earlier, it lay on the opening
// fingers and got flung by them.
function loosen(dt, rate) {
  const c = claw;
  c.open = Math.min(1, c.open + rate * dt);
  if (c.held && (tipsClear(c.held) || c.open >= 1)) {
    if (c.slipping) sfx('slip');
    detach(); c.slipping = null;
  }
}

// A prize in the hole scores on the board, with a jingle. There is no floating "+1" / "+5 ¡Dorada!"
// text any more: the user asked to drop it (October 2026).
// The specials do their thing instead: a bomb takes a coin (and ends the streak), the skull loses the
// level, a +2 capsule gives two coins.
function win(p) {
  if (state === 'over' || (endT !== null && !endWon)) return;
  if (p.kind === 'bomb') { coins = Math.max(0, coins - 1); roundGood = false; streak = 0; flashCoins('#ff5d8f'); sfx('boom'); hud(); return; }
  if (p.kind === 'skull') { if (endT === null) { endT = CLEAR_DELAY; endWon = false; lostTo = 'skull'; } sfx('boom'); return; }
  if (p.kind === 'bonus') { coins += 2; flashCoins('#80ed99'); sfx('coin'); hud(); return; }
  score += p.rare ? 5 : 1; won++;
  // A colour goes into the collection, kept across games (see the gallery); finishing a season opens
  // the next one, which the level's card then tells about
  if (KIND[p.kind]) {
    const open = seasonsOpen(), k = colKey(p.design, p.kind);
    collection[k] = (collection[k] || 0) + 1;
    try { localStorage.setItem(COLLECTION_KEY, JSON.stringify(collection)); } catch (e) {}
    if (seasonsOpen() > open) { newSeason = SEASONS[open].name; $('galBtn').classList.add('new'); }
  }
  // And towards the level's goal, if the goal still wants it (in an ordered goal, only the part being
  // played counts). Once the goal is met the level is cleared, and its card comes up CLEAR_DELAY later,
  // so the prize is seen dropping in first.
  const wants = g => goalLeft(g) && (g.key === p.kind || (g.key === 'any' && KIND[p.kind]));
  if (lv.order ? goalNow()?.key === p.kind : lv.goal.some(wants)) { got[p.kind] = (got[p.kind] || 0) + 1; roundGood = true; }
  if (endT === null && levelMet()) { endT = CLEAR_DELAY; endWon = true; }
