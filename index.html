<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Claw Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1b1430; --ink: #fff6e0; --pink: #e8457a; --pink-dark: #8a1f48; --gold: #ffd23f; --panel: #2b1850; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--ink); font-family: "Baloo 2", system-ui, sans-serif; font-weight: 700;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  /* (buttons take taps but never a double-tap zoom: see the iPhone note by the touch guard) */
  button { touch-action: manipulation; }
  canvas { display: block; position: fixed; inset: 0; }
  #controls {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; align-items: center; gap: 28px; pointer-events: none;
  }
  body.wide #controls { justify-content: space-between; padding: 0 max(24px, 5vw); }
  /* Settings: pad on the right, the drop button on the left (for right-handed players) */
  body.swap #controls { flex-direction: row-reverse; }
  /* Pad: a joystick like the maze game's. Its base rests here; touched, it jumps to the finger and the
     knob follows it, and how far you push sets the speed. */
  #pad { position: relative; width: 150px; height: 150px; pointer-events: auto; touch-action: none; cursor: grab; }
  /* Its look is from the user's references (October 2026): the base is one piece of plastic in one
     dark navy, lighter than its edge below so the two don't run together (it had a ring, a groove and
     circles inside, which the user dropped, after a real arcade stick's photo); and a blue arcade ball
     with a gloss and a little glint. It used to be pink rings. */
  #stick { position: absolute; left: 50%; top: 50%; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; pointer-events: none;
    background: #2a374c; box-shadow: 0 5px 0 #0a0f17, 0 9px 14px rgba(0, 0, 0, .4); }
  #knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    background: radial-gradient(circle at 40% 34%, #5cc8ff 0, #1c9bff 32%, #0a63e8 70%, #0747b6 100%);
    box-shadow: inset -3px -5px 8px rgba(0, 25, 90, .35), 0 6px 0 rgba(3, 8, 16, .55), 0 9px 10px rgba(0, 0, 0, .35); }
  #knob::before { content: ''; position: absolute; left: 15%; top: 12%; width: 40%; height: 26%; border-radius: 50%;
    background: rgba(255, 255, 255, .5); transform: rotate(-28deg); filter: blur(.5px); }
  #knob::after { content: ''; position: absolute; right: 22%; top: 21%; width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .85); }
  #gear { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center; font: inherit; font-size: 26px; line-height: 1; color: var(--ink); cursor: pointer;
    background: var(--panel); border: 3px solid var(--gold); border-radius: 12px; }
  #lvlBtn, #galBtn, #charBtn { position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center; cursor: pointer; background: var(--panel); border: 3px solid var(--gold); border-radius: 12px;
    font: inherit; font-size: 26px; line-height: 1; color: var(--gold); }
  #galBtn { left: calc(max(10px, env(safe-area-inset-left)) + 52px); }
  #galBtn .cap { width: 24px; height: 24px; box-shadow: none; }
  #charBtn { left: calc(max(10px, env(safe-area-inset-left)) + 104px); }
  #charBtn img { width: 34px; height: 34px; }
  /* A capsule drawn in CSS for the gallery: its colour (--c) with a highlight, the lower half a little
     darker, and the dark band where the halves meet, tilted like a toy lying on a shelf */
  .cap { --c: #ff5d8f; position: relative; width: 76px; height: 76px; border-radius: 50%; overflow: hidden; transform: rotate(-18deg);
    background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .8) 0 6%, transparent 20%),
      radial-gradient(circle at 50% 38%, var(--c) 0 50%, color-mix(in srgb, var(--c) 55%, #000) 100%);
    box-shadow: 0 6px 0 rgba(0, 0, 0, .28); }
  .cap::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: rgba(0, 0, 0, .12); }
  .cap::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 12%; margin-top: -6%; background: #2a1d40; }
  .cap.mini { display: inline-block; width: 26px; height: 26px; box-shadow: none; flex: none; vertical-align: middle; }
  /* "Any colour" in a level's goal: a capsule of all the colours */
  .cap.any { background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .8) 0 6%, transparent 20%),
      conic-gradient(#ff5d8f 0 20%, #4cc9f0 0 40%, #80ed99 0 60%, #b388ff 0 80%, #ff9f43 0); }
  /* The gallery and the levels: screens of their own over the machine */
  /* (the title on top and the buttons at the bottom stay put; only what is between them scrolls, as in
     the maze game: the user asked for it, October 2026) */
  .screen { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; padding: max(8px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background: #000; display: flex; flex-direction: column; align-items: center; }   /* (black, as the user asked) */
  .screen > * { flex: none; }
  /* (the title sits close to the top, to leave the page more room, as the user asked, October 2026) */
  /* (the screens' titles and the banners' text are white, as the user tried, October 2026; they were
     gold, which the covers' world names on the worlds screen keep) */
  .screen h2 { margin: 0 0 8px; font-size: 38px; line-height: 1.1; color: #fff; text-shadow: 0 3px 0 var(--pink-dark); }
  .screen .sub { margin: 0 0 18px; font-size: 20px; opacity: .85; text-align: center; }
  /* The gallery's and the exhibitor's worlds side by side, one whole world at a time: swipe (dragged
     with the mouse on a computer) or the arrows to the next. The user asked for it (October 2026); the
     next one used to peek in at the side, which looked cut off. */
  .pages { position: relative; display: flex; gap: 24px; width: 100%; max-width: 900px; overflow-x: auto; scroll-snap-type: x mandatory; touch-action: pan-x pan-y;
    scrollbar-width: none; overscroll-behavior-x: contain; cursor: grab; flex: 1 1 auto; min-height: 0; }
  .pages::-webkit-scrollbar { display: none; }
  .pages.drag { scroll-snap-type: none; cursor: grabbing; }
  .pages img { -webkit-user-drag: none; }
  .season { flex: 0 0 100%; scroll-snap-align: center; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-width: none; padding: 0 2px 8px; }
  /* (no scroll bars: the finger, the mouse dragging and the wheel scroll them, as the user asked) */
  .season::-webkit-scrollbar, #lvlList::-webkit-scrollbar { display: none; }
  .nav { display: flex; align-items: center; gap: 14px; margin: 10px 0 12px; }
  .nav button { width: 40px; height: 40px; padding: 0; font: inherit; font-size: 28px; line-height: 1; color: var(--gold); background: var(--panel);
    border: 3px solid var(--gold); border-radius: 50%; cursor: pointer; }
  .nav button:disabled { opacity: .3; cursor: default; }
  /* On a phone (a touch screen) the pages are swiped, so the arrows go and the dots are enough, as the user asked (October 2026) */
  @media (hover: none) and (pointer: coarse) { .nav button { display: none; } .nav { margin: 14px 0 16px; } }
  /* The worlds screen has no arrows anywhere (the user asked); with the mouse it is dragged, or a dot clicked */
  #worldPrev, #worldNext { display: none; }
  .dots i { cursor: pointer; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); opacity: .3; }
  .dots i.on { opacity: 1; background: var(--gold); }
  /* The bottom buttons, one size on every screen (the user asked, October 2026: each was as wide as its
     text, so they changed from screen to screen): 50 px high, the screens' links side by side in equal
     widths, and the way back to the machine under them, full width */
  .backs { margin-top: auto; padding-top: 4px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; max-width: 420px; }
  .backs .back { flex: 1 1 0; min-width: 0; min-height: 50px; padding: 0 8px; white-space: nowrap; }
  .backs .back:not(.alt) { flex-basis: 100%; }
  /* (the colours from the user's reference, October 2026: violet buttons with a gold rim and white text,
     and the way back in a brighter yellow) */
  .back.alt { background: linear-gradient(#6c3fdc, #4b26b0); color: #fff; border-color: #f4c63a; box-shadow: 0 5px 0 #b98a14; text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
  .back.alt:active { box-shadow: 0 1px 0 #b98a14; }
  .season h3 { display: flex; justify-content: space-between; margin: 0 4px 10px; font-size: 22px; color: var(--gold); }
  .season .sub { font-size: 16px; margin-bottom: 10px; }
  .season.locked .shelf, .season.locked .rack { opacity: .5; }
  /* The gallery's capsules: rarity, and a bar to the next character with how far along it is, small,
     inside it (the user asked for it in place of a big number and the total won, October 2026) */
  .slot .bar, .slot .open { box-sizing: border-box; width: 86%; border-radius: 12px; }
  .slot .bar { position: relative; background: rgba(0, 0, 0, .18); overflow: hidden; }
  .slot .bar i { display: block; height: 100%; background: var(--gold); }
  .slot .bar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: inherit; line-height: 1; color: #2b2038; text-shadow: 0 1px 0 rgba(255, 255, 255, .6); }
  /* The exhibitor: a framed panel (rack) per rarity, its name on a tab over the top left corner, and in
     it five tiles, a character each with its name on a plate above it. From the user's reference
     (October 2026); before, it was a dark grey shelf with the characters standing on its board. Each
     rarity has its colours: the panel (--bg), its frame and tab (--rim), the tiles (--tile). */
  .rack { --bg: #f1e3c6; --rim: #8a5a36; --tile: #e4d0a8; --ink2: #4a2c14;
    /* (at most 560 wide, like the gallery's shelf: on a computer's wider page the tiles grew, and the
       characters, 150% of a tile, with them, until they overlapped; the user noticed, October 2026) */
    position: relative; max-width: 560px; margin: 22px auto 16px; padding: 26px 8px 10px; border: 4px solid var(--rim); border-radius: 18px;
    background: var(--bg); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .45), 0 6px 0 rgba(0, 0, 0, .35); }
  .rack.t1 { --bg: #d6f2d8; --rim: #3f8f57; --tile: #b9e3c0; --ink2: #1d4a2a; }
  .rack.t2 { --bg: #cfe8f6; --rim: #3a76a6; --tile: #afd3ea; --ink2: #173a5a; }
  .rack.t3 { --bg: #ffe9c2; --rim: #ea9112; --tile: #ffd690; --ink2: #5a3000; }   /* (an orange yellow, as the user asked; it was a mustard gold, #c08a1a) */
  .rack.t4 { --bg: #f7dcf3; --rim: #b04fa8; --tile: #ecc3e6; --ink2: #4f1748; }
  .rack .rtitle { position: absolute; top: -18px; left: 12px; padding: 3px 14px 4px; border-radius: 10px; background: var(--rim); color: #fff;
    font-size: 18px; line-height: 1.1; transform: rotate(-3deg); text-shadow: 0 2px 0 rgba(0, 0, 0, .3); box-shadow: 0 3px 0 rgba(0, 0, 0, .3); }
  .row5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  /* A tile: the name's plate at the top, then the character over a soft spot of floor; a character not
     won yet is a dark silhouette with "?" and no name */
  .toy { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 3px; border-radius: 12px;
    background: radial-gradient(60% 10% at 50% 92%, rgba(0, 0, 0, .12), transparent 100%), var(--tile);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .5), inset 0 -2px 0 rgba(0, 0, 0, .08); }
  /* (the plate sits on the tile's top edge, half over it, as the user asked: its height is 1.2em + 4px.
     The picture keeps clear of it: at first it was pulled up under the plate with it, and the user saw
     the plate cover more of the character) */
  .toy .plate { position: relative; z-index: 1; max-width: 100%; margin: calc(-.6em - 2px) 0 5px; padding: 2px 6px; border-radius: 8px; background: rgba(255, 255, 255, .94); color: var(--ink2);
    font-size: clamp(11px, 2.6vw, 17px); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 2px 0 rgba(0, 0, 0, .12); }
  .toy.none .plate { visibility: hidden; }
  /* (every cut has the same scale and its base at the same height, so the characters keep their sizes
     as drawn and stand on one line; the picture is a little wider than the tile, and what sticks out at
     the sides may show past it, as the user asked: only the top and bottom are clipped) */
  .toy .pic { position: relative; width: 100%; clip-path: inset(0 -50%); }
  .toy img { display: block; width: 150%; max-width: none; aspect-ratio: 1; margin: -9% -25% -12%; object-fit: contain; pointer-events: none; }
  .toy.none img { filter: brightness(0); opacity: .72; }
  .toy .pic i { position: absolute; inset: 0 0 12%; display: flex; align-items: center; justify-content: center; font-style: normal;
    font-size: clamp(16px, 4.5vw, 30px); color: rgba(255, 255, 255, .45); }
  .toy b { position: absolute; bottom: -6px; right: -4px;   /* (at the bottom, clear of the name, as the user asked) */
    padding: 1px 6px; border-radius: 10px; font-size: 13px; line-height: 1.2;
    background: #ff4f7b; color: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
  /* A capsule just won, at the top of the screen for a moment: a thin strip with the capsule, "Cápsula
     <rarity>" small in the rarity's colour over its name, and the gold border of the buttons at the top. The
     user asked for it thinner, from a reference (October 2026); it used to say "¡Cápsula completa! ·
     <rarity>" over "Abrila en Cápsulas". */
  #toast { position: fixed; top: max(64px, calc(env(safe-area-inset-top) + 54px)); left: 50%; display: flex; align-items: center; gap: 12px;
    min-width: min(320px, 84vw); padding: 5px 18px 5px 8px; border-radius: 16px; background: var(--panel); border: 3px solid var(--gold); font-size: 19px; line-height: 1.15;
    transform: translate(-50%, -160%); opacity: 0; pointer-events: none; white-space: nowrap; }
  #toast.show { animation: toast 3.2s ease both; }
  @keyframes toast { 0% { transform: translate(-50%, -160%); opacity: 0; } 10%, 85% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -160%); opacity: 0; } }
  #toast .cap { flex: none; width: 40px; height: 40px; }
  #toast small { display: block; font-size: 13px; }
  #toast .tt { flex: 1; }
  #toast .tbar { position: relative; flex: none; width: 80px; height: 40px; margin-right: -10px; border-radius: 12px; overflow: hidden; background: rgba(255, 255, 255, .14); }
  #toast .tbar i { display: block; height: 100%; background: var(--gold); }
  #toast .tbar.done i { background: #ff4f7b; }
  #toast .tbar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
  /* A world's cover as a banner: a strip of it with a title over its darkened lower part */
  /* (the gallery's and collection's world banners are a thin strip, as the user asked, October 2026: they
     were 104 px high, with the text at the bottom over a dark fade, then 60) */
  .banner { position: relative; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 46px; margin: 0 0 10px; padding: 2px 12px;
    border-radius: 14px; border: 3px solid #fff; background: #000 center 40% / cover no-repeat; overflow: hidden; }
  .banner::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, .72), rgba(0, 0, 0, .2) 70%, rgba(0, 0, 0, .45)); }
  .banner > * { position: relative; margin: 0; color: #fff; text-shadow: 0 2px 4px #000; }
  .banner h3, .banner h2 { display: block; margin: 0; font-size: 20px; color: #fff; }
  .banner span { font-size: 18px; }
  .banner.locked { filter: grayscale(1) brightness(.6); }
  /* (twice as high as the other screens' banners, as the user asked, October 2026; it was 150) */
  #lvlBanner { width: 100%; max-width: 640px; height: 92px; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 14px; border-radius: 16px; text-align: center; }
  /* (the fade comes down from the top, and the levels and stars sit on a dark see-through label with
     round ends, like the characters' name plates: the user asked, October 2026) */
  #lvlBanner::before { background: linear-gradient(rgba(0, 0, 0, .72), transparent 80%); }
  #lvlBanner h2 { font-size: clamp(24px, 7.5vw, 30px); line-height: 1.1; white-space: nowrap; }
  #lvlBanner span { font-size: 17px; line-height: 1.2; color: var(--ink); padding: 2px 14px; border-radius: 999px; background: rgba(0, 0, 0, .45); text-shadow: none; }
  /* The worlds screen: a page per world with its cover, and the daily challenge as a strip above */
  /* (the worlds' carousel fades out at its sides, so covers slide in and out softly when swiped; each
     page keeps a margin as wide as the fade, so a cover at rest is never under it) */
  #worldShelf { --fade: 22px; -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent);
    mask-image: linear-gradient(to right, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent); }
  .wpage { display: flex; justify-content: center; padding: 0 22px 8px; }
  /* (on a computer the covers leave room at the sides, so the fade there is much wider) */
  @media (min-width: 760px) { #worldShelf { --fade: 160px; } }
  .cover { position: relative; height: 100%; max-width: 100%; aspect-ratio: 4 / 5; border-radius: 22px; border: 4px solid #fff; overflow: hidden;
    background: #000 center / cover no-repeat; box-shadow: 0 8px 24px rgba(0, 0, 0, .6); }
  .cover.locked { filter: grayscale(1) brightness(.55); border-color: #666; }
  /* (a dark fade at the top, under the world's name and progress, so they read on any art) */
  .cover::before { content: ''; position: absolute; inset: 0 0 auto; height: 34%; background: linear-gradient(rgba(0, 0, 0, .7), transparent); }
  /* (the world's name and progress at the top of the cover, Jugar alone at the bottom, nothing darkening
     the art: the user asked for it, October 2026) */
  .winfo { position: absolute; left: 0; right: 0; top: 0; padding: 14px 14px 0; text-align: center; }
  /* (only the world's name, as the user asked: "Mundo n" was dropped) */
  .winfo h3 { display: block; margin: 0; font-size: clamp(24px, 7.5vw, 32px); line-height: 1.1; white-space: nowrap; color: var(--gold); text-shadow: 0 2px 0 #000, 0 0 6px #000, 0 0 12px #000; }
  .winfo p { margin: 2px 0 0; font-size: clamp(13px, 3.9vw, 17px); text-shadow: 0 1px 0 #000, 0 0 5px #000, 0 0 10px #000; }
  .winfo .lock { font-size: 20px; }
  .wplay { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; }
  /* (Jugar looks like the screens' main button, Volver a la máquina, as the user asked) */
  .wplay .play { font: inherit; font-size: 24px; color: #3a2400; background: linear-gradient(#ffe36e, #f6c837); border: 4px solid #d9a21b; border-radius: 16px;
    min-height: 50px; min-width: 60%; padding: 0 44px; cursor: pointer; box-shadow: 0 5px 0 #a8740a; }
  .wplay .play:active { transform: translateY(4px); box-shadow: 0 1px 0 #a8740a; }
  #dailyBar { display: none; flex: none; align-items: center; justify-content: space-between; gap: 10px; width: 100%; max-width: 600px; margin: 6px 0 12px; padding: 8px 14px;
    font: inherit; font-size: 18px; color: var(--ink); background: var(--panel); border: 3px solid #4cc9f0; border-radius: 14px; cursor: pointer; text-align: left; }
  #dailyBar b { color: #4cc9f0; white-space: nowrap; }
  /* A world's boss level stands out: a pink card with a pink border, the crown on a pink disc */
  .lvl.boss { border-color: #ff4f7b; background: #ffd0e4; padding: 12px 14px; }
  .lvl.boss .goal b { width: 100%; font-size: 20px; color: #c2185b; }
  .lvl.boss .tag { background: #f8b3d1; color: #5a1030; }
  /* A world just opened: its cover over the whole screen */
  #intro { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: #000; padding: 16px; }
  #introCover { position: relative; height: min(100%, 125vw); aspect-ratio: 4 / 5; max-width: 100%; border-radius: 22px; border: 4px solid var(--gold); overflow: hidden;
    background: #000 center / cover no-repeat; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 16px 28px; }
  #introCover::before { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0, 0, 0, .85)); }
  #introCover > * { position: relative; }
  #introCover small { font-size: 22px; color: var(--ink); }
  #introCover h2 { margin: 0 0 14px; font-size: clamp(30px, 9.5vw, 48px); line-height: 1.05; text-align: center; color: var(--gold); text-shadow: 0 3px 0 var(--pink-dark); }
  #intro.go #introCover { animation: introIn .7s cubic-bezier(.2, 1.3, .5, 1) both; }
  #intro.go #introCover > * { animation: fadeIn .5s .5s both; }
  @keyframes introIn { from { transform: scale(.6); opacity: 0; } }
  /* A complete card in the gallery: it glows and asks to be opened */
  /* (a card ready to open has the ×n badge's pink on its border too, glowing, until it is opened) */
  .slot.ready { cursor: pointer; border-color: #ff4f7b; animation: readyPink 1.2s ease-in-out infinite alternate; }
  @keyframes readyPink { from { box-shadow: 0 4px 0 rgba(0, 0, 0, .35), 0 0 0 rgba(255, 79, 123, 0); } to { box-shadow: 0 4px 0 rgba(0, 0, 0, .35), 0 0 18px rgba(255, 79, 123, .8); } }
  @keyframes ready { from { box-shadow: 0 0 0 rgba(255, 210, 63, 0); } to { box-shadow: 0 0 18px rgba(255, 210, 63, .75); } }
  .slot.ready .cap { animation: wiggle 1.2s ease-in-out infinite; }
  @keyframes wiggle { 0%, 70%, 100% { transform: rotate(-18deg); } 78% { transform: rotate(-30deg); } 86% { transform: rotate(-6deg); } 94% { transform: rotate(-22deg); } }
  /* (¡Abrir! in the pink of the collection's ×n badge, as the user asked) */

  @keyframes shake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-9deg); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(5deg); } }

  /* A capsule's card: its name on a label in its rarity's colour on the top border, the capsule, and

// A little bat, spread wings, centred at x, y, s wide
function drawBat(g, x, y, s, color) {
  g.save(); g.translate(x, y); g.scale(s / 100, s / 100); g.fillStyle = color; g.beginPath();
  g.moveTo(0, -8); g.quadraticCurveTo(10, -22, 24, -18); g.quadraticCurveTo(40, -24, 50, -10); g.quadraticCurveTo(40, -6, 36, 4);
  g.quadraticCurveTo(28, -4, 20, 4); g.quadraticCurveTo(12, -2, 6, 8); g.lineTo(0, 14); g.lineTo(-6, 8);
  g.quadraticCurveTo(-12, -2, -20, 4); g.quadraticCurveTo(-28, -4, -36, 4); g.quadraticCurveTo(-40, -6, -50, -10);
  g.quadraticCurveTo(-40, -24, -24, -18); g.quadraticCurveTo(-10, -22, 0, -8); g.fill();
  g.beginPath(); g.arc(0, -4, 7, 0, 7); g.fill();
  g.beginPath(); g.moveTo(-5, -9); g.lineTo(-3, -16); g.lineTo(-1, -9); g.moveTo(1, -9); g.lineTo(3, -16); g.lineTo(5, -9); g.fill();
  g.restore();
}
// A five-pointed star
function drawStar(g, x, y, r, color) {
  g.fillStyle = color; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.fill();
}
// A spider web in a corner: spokes from (x, y) over the quarter turn starting at a0, and threads
function drawWeb(g, x, y, r, a0, color, width = 2) {
  g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round';
  const spokes = 6, ang = i => a0 + i * (Math.PI / 2) / (spokes - 1);
  for (let i = 0; i < spokes; i++) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(ang(i)) * r, y + Math.sin(ang(i)) * r); g.stroke(); }
  for (let k = 1; k <= 4; k++) {
    const rr = r * k / 4.3; g.beginPath();
    for (let i = 0; i < spokes; i++) {
      const p = [x + Math.cos(ang(i)) * rr, y + Math.sin(ang(i)) * rr];
      if (i === 0) g.moveTo(...p);
      else { const m = (ang(i - 1) + ang(i)) / 2, sag = rr * .86; g.quadraticCurveTo(x + Math.cos(m) * sag, y + Math.sin(m) * sag, ...p); }
    }
    g.stroke();
  }
}

  for (const [dx, k] of [[-.45, .62], [.45, .62], [0, .72]]) {

  g.beginPath(); g.moveTo(x - r * .55, y + r * .18); g.quadraticCurveTo(x, y + r * .8, x + r * .55, y + r * .18); g.quadraticCurveTo(x, y + r * .45, x - r * .55, y + r * .18); g.fill();

// A paw print: the pad and four toes, about r across
function drawPaw(g, x, y, r, color, tilt = 0) {
  g.save(); g.translate(x, y); g.rotate(tilt); g.fillStyle = color;
  g.beginPath(); g.ellipse(0, r * .18, r * .42, r * .34, 0, 0, 7); g.fill();
  for (const [dx, dy, k] of [[-.48, -.2, .17], [-.17, -.48, .18], [.17, -.48, .18], [.48, -.2, .17]]) { g.beginPath(); g.ellipse(dx * r, dy * r, r * k, r * k * 1.2, dx * .5, 0, 7); g.fill(); }

}

// A band of slime along y (from x0 to x1) dripping down (dir 1) or up (dir -1), with a shine
function drawSlime(g, x0, x1, y, band, dir, color, seed = 1) {
  let r = seed;
  const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  g.fillStyle = color;
  g.fillRect(x0, dir > 0 ? y - band : y, x1 - x0, band);
  for (let x = x0 + 10; x < x1; x += 26 + rnd() * 30) {
    const len = band * (.4 + rnd() * 1.3), wd = 9 + rnd() * 9;
    g.beginPath(); g.moveTo(x - wd, y); g.lineTo(x - wd * .6, y + dir * len); g.arc(x, y + dir * len, wd * .6, dir > 0 ? Math.PI : 0, dir > 0 ? 0 : Math.PI, dir < 0); g.lineTo(x + wd, y); g.fill();
  }
  g.fillStyle = 'rgba(255, 255, 255, .35)'; g.fillRect(x0, dir > 0 ? y - band * .7 : y + band * .55, x1 - x0, band * .12);
}
// A little round monster: its body, one big eye (or three on stalks), a grin with fangs, maybe horns
function drawMonster(g, x, y, r, color, { eyes = 1, horns = false } = {}) {
  if (horns) for (const sx of [-1, 1]) { g.fillStyle = '#ffb347'; g.beginPath(); g.moveTo(x + sx * r * .35, y - r * .75); g.quadraticCurveTo(x + sx * r * .9, y - r * 1.3, x + sx * r * .85, y - r * 1.05); g.lineTo(x + sx * r * .6, y - r * .6); g.fill(); }
  if (eyes === 3) for (const dx of [-.55, 0, .55]) { g.strokeStyle = color; g.lineWidth = r * .14; g.beginPath(); g.moveTo(x + dx * r * .5, y - r * .6); g.lineTo(x + dx * r, y - r * 1.15); g.stroke(); }
  g.fillStyle = color; g.beginPath(); g.ellipse(x, y, r, r * .9, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255, 255, 255, .18)'; g.beginPath(); g.ellipse(x - r * .35, y - r * .4, r * .3, r * .2, -.5, 0, 7); g.fill();
  const eye = (ex, ey, er) => { g.fillStyle = '#fff'; g.beginPath(); g.arc(ex, ey, er, 0, 7); g.fill(); g.fillStyle = '#1a0f22'; g.beginPath(); g.arc(ex + er * .1, ey + er * .1, er * .55, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(ex + er * .3, ey - er * .2, er * .18, 0, 7); g.fill(); };
  if (eyes === 3) for (const dx of [-.55, 0, .55]) eye(x + dx * r, y - r * 1.2, r * .26);
  else eye(x, y - r * .15, r * .42);
  g.fillStyle = '#3a0f2a'; g.beginPath(); g.ellipse(x, y + r * .45, r * .38, r * .2, 0, 0, Math.PI); g.fill();
  g.fillStyle = '#fff'; for (const sx of [-1, 1]) { g.beginPath(); g.moveTo(x + sx * r * .22, y + r * .45); g.lineTo(x + sx * r * .12, y + r * .45); g.lineTo(x + sx * r * .17, y + r * .58); g.fill(); }
}
// A six-armed snowflake
function drawSnowflake(g, x, y, r, color) {
  g.strokeStyle = color; g.lineWidth = Math.max(2, r * .16); g.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3, c = Math.cos(a), s = Math.sin(a);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + c * r, y + s * r); g.stroke();
    for (const k of [.55]) for (const sd of [-1, 1]) {
      const bx = x + c * r * k, by = y + s * r * k, b = a + sd * .7;
      g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + Math.cos(b) * r * .32, by + Math.sin(b) * r * .32); g.stroke();
    }
  }
}
// Two holly leaves and three berries
function drawHolly(g, x, y, s, flip = 1) {
  g.fillStyle = '#1f8a3a';
  for (const a of [-.5, .5]) {
    g.save(); g.translate(x, y); g.rotate(a * flip + (flip < 0 ? Math.PI : 0)); g.beginPath(); g.ellipse(s * .5, 0, s * .5, s * .2, 0, 0, 7); g.fill(); g.restore();
  }
  g.fillStyle = '#e0202c';
  for (const [dx, dy] of [[0, -.08], [-.16, .1], [.16, .1]]) { g.beginPath(); g.arc(x + dx * s, y + dy * s, s * .13, 0, 7); g.fill(); }
  g.fillStyle = 'rgba(255, 255, 255, .5)'; g.beginPath(); g.arc(x - s * .03, y - s * .12, s * .04, 0, 7); g.fill();
}
// A red bow with gold edges
function drawBow(g, x, y, s) {
  g.fillStyle = '#d4141f'; g.strokeStyle = '#ffd23f'; g.lineWidth = Math.max(2, s * .05);
  for (const sx of [-1, 1]) { g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + sx * s * .55, y - s * .55, x + sx * s * .6, y); g.quadraticCurveTo(x + sx * s * .55, y + s * .3, x, y); g.fill(); g.stroke(); }
  for (const sx of [-1, 1]) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + sx * s * .35, y + s * .6); g.lineTo(x + sx * s * .18, y + s * .55); g.fill(); }
  g.beginPath(); g.arc(x, y, s * .13, 0, 7); g.fill(); g.stroke();
}
// Snow lying along y from x0 to x1: a white band with a lumpy lower edge
function drawSnow(g, x0, x1, y, depth) {
  g.fillStyle = '#ffffff'; g.beginPath(); g.moveTo(x0, y - depth * .2);
  for (let x = x0, i = 0; x <= x1 + 1; x += depth * 1.2, i++) g.quadraticCurveTo(x + depth * .6, y + depth * (i % 2 ? .9 : .55), x + depth * 1.2, y + depth * .3);
  g.lineTo(x1, y - depth); g.lineTo(x0, y - depth); g.fill();
  g.fillStyle = 'rgba(190, 220, 255, .6)'; g.fillRect(x0, y - depth * .15, x1 - x0, depth * .12);
}
// Red and white candy stripes over a rectangle
function candyStripes(g, x, y, w, h, step) {
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.fillStyle = '#ffffff'; g.fillRect(x, y, w, h); g.fillStyle = '#e0202c';
  for (let k = -h; k < w + h; k += step * 2) { g.beginPath(); g.moveTo(x + k, y + h); g.lineTo(x + k + step, y + h); g.lineTo(x + k + step + h, y); g.lineTo(x + k + h, y); g.fill(); }
  g.restore();
}

const FINGER_W = .08, FINGER_T = .05;

// ---------- Cable ----------
// The cable is a rope: a chain of point masses (Verlet) with gravity and inertia, pinned to the
// carriage at the top and the claw head at the bottom, whose links can't stretch past claw.len split
// evenly but can go slack. So it bows and ripples as the claw swings, starts and brakes, and sags when
// the claw rests on something. It is only drawn: the claw itself hangs from the elastic cable model in
// swingHead(), which this rope follows, since both use claw.len.
const cable = Array.from({ length: CABLE_NODES + 1 }, () => ({ x: 0, y: 0, z: 0, px: 0, py: 0, pz: 0 }));

// From the carriage to the hook on top of the claw's body
function cableEnds() { return [[claw.x, CARRIAGE_Y, claw.z], clawPoint(clawFrame(), 0, 0, HOOK_UP)]; }

function resetCable() {
  const [a, b] = cableEnds();
  cable.forEach((p, i) => {
    const t = i / CABLE_NODES;
    p.x = p.px = a[0] + (b[0] - a[0]) * t; p.y = p.py = a[1] + (b[1] - a[1]) * t; p.z = p.pz = a[2] + (b[2] - a[2]) * t;
  });
}

function cableStep(dt) {
  const n = CABLE_NODES, link = Math.max(claw.len - HOOK_UP, .05) / n, [a, b] = cableEnds();
  for (let i = 1; i < n; i++) {
    const p = cable[i];
    const vx = (p.x - p.px) * CABLE_DAMP, vy = (p.y - p.py) * CABLE_DAMP, vz = (p.z - p.pz) * CABLE_DAMP;
    p.px = p.x; p.py = p.y; p.pz = p.z;
    p.x += vx; p.y += vy - G * dt * dt; p.z += vz;
  }
  const pin = (p, q) => { p.x = p.px = q[0]; p.y = p.py = q[1]; p.z = p.pz = q[2]; };
  pin(cable[0], a); pin(cable[n], b);
  // A slack cable hanging straight down would just fold onto itself; a real one bows out to one side.
  // A tiny sideways nudge picks the side, and links that keep their length (like the strands of a
  // wire cable) make the extra length curve instead of collapsing. The pinned ends never move.
  if (claw.len > claw.dist + .01) for (let i = 1; i < n; i++) { cable[i].x += CABLE_NUDGE * Math.sin(i * 1.7); cable[i].z += CABLE_NUDGE * Math.cos(i * 1.3); }
  for (let it = 0; it < CABLE_ITERS; it++) for (let i = 0; i < n; i++) {

    const dx = q.x - p.x, dy = q.y - p.y, dz = q.z - p.z, d = Math.hypot(dx, dy, dz) || 1e-6;
    const wp = i === 0 ? 0 : 1, wq = i + 1 === n ? 0 : 1, w = wp + wq;
    if (!w) continue;
    const s = (d - link) / d / w;
    p.x += dx * s * wp; p.y += dy * s * wp; p.z += dz * s * wp;
    q.x -= dx * s * wq; q.y -= dy * s * wq; q.z -= dz * s * wq;
  }
}

// The claw hangs along the cable: d points down the cable, e1 and e2 span the plane across it
// (for a vertical cable, e1 = +x and e2 = +z)
function clawFrame() {
  const h = claw.head, dx = h.x - claw.x, dy = h.y - CARRIAGE_Y, dz = h.z - claw.z, n = Math.hypot(dx, dy, dz) || 1;
  const d = [dx / n, dy / n, dz / n];

  const m = Math.hypot(...e1); e1 = e1.map(v => v / m);

}

// A point given in the claw's frame: across the cable (u, w) and up from the head (up)
function clawPoint(f, u, w, up) {
  const h = claw.head;
  return [h.x, h.y, h.z].map((v, i) => v + u * f.e1[i] + w * f.e2[i] - up * f.d[i]);

// Each finger lives in its own plane through the cable, along FINGER_SHAPE from its hinge (p) to its
// tip (t); pts holds every bend. open (0..1) swings them all outwards around the hinge, and each
// finger's flex (radians) swings it further on its own: a finger pressing on a prize gives way
// upwards (see flexFingers).
function fingers(flex = claw.flex) {

    const th = Math.min(FLEX_MAX_ANGLE, claw.open * OPEN_ANGLE + flex[i]), c = Math.cos(th), s = Math.sin(th);

// The straight stretches of a finger, hinge to tip
const fingerRods = fg => fg.pts.slice(1).map((q, i) => [fg.pts[i], q]);

// How deep a finger digs into a prize (negative: the gap left)
function fingerPenOn(fg, p) {
  let m = -1e9;
  for (const [a, b] of fingerRods(fg)) {
    const q = closestOnSeg([p.x, p.y, p.z], a, b);
    m = Math.max(m, p.r + FINGER_R - Math.hypot(p.x - q[0], p.y - q[1], p.z - q[2]));
  }
  return m;
}

// How deep a finger digs into the prizes it isn't holding
// ...and into the hole's clear walls, so a finger gives way against them too instead of the whole claw
// stopping short of closing
function fingerPen(fg) {
  let m = 0;
  for (const p of prizes) if (p !== claw.held) m = Math.max(m, fingerPenOn(fg, p));
  return Math.max(m, fingerWallPen(fg));
}

// How deep a finger digs into the hole walls, sampled along its parts
function fingerWallPen(fg) {
  let m = 0;
  for (const [a, b] of fingerRods(fg)) for (let i = 0; i <= 6; i++) {
    const q = lerp3(a, b, i / 6);
    for (const w of WALLS) {
      const c = q.map((v, k) => clamp(v, w.min[k], w.max[k])), d = Math.hypot(q[0] - c[0], q[1] - c[1], q[2] - c[2]);

      const inside = d === 0 ? Math.min(...[0, 1, 2].map(k => Math.min(q[k] - w.min[k], w.max[k] - q[k]))) : 0;
      m = Math.max(m, FINGER_R - d + inside);
    }
  }
  return m;

// How many fingers touch the prize (within gap)
const fingersOn = (p, gap = .004) => fingers().filter(fg => fingerPenOn(fg, p) > -gap).length;

// The motor closes all the fingers together, but each one is hinged with some give: a finger that
// presses into a prize (the one under the claw included) swings up and out until it rests on it
// instead of digging in. So when the claw has closed, every finger lies against whatever it met.
// It springs back as far as it can without digging into anything. (While the claw carries a prize,
// carry() drives the fingers instead.)
// From the moment it closes until it lets go, though, the motor holds the fingers shut with force
// (gripFirm): a finger shoves the prizes in its way aside (the contact solver pushes them with the
// finger's own motion) and only gives way to one that is jammed and that it starts to dig into
// (CLOSE_GIVE). Otherwise, buried in a pile, the fingers gave way to every capsule around them and
// ended up wider than the open claw; and with the soft give back on after closing, they swung open
// again by up to 0.5 rad as the claw started to lift.
// It is firm from the moment the claw lands, too: settling into the pile with the soft give, the
// fingers kept swinging open for a whole second before closing, nearly flat by the time it closed.
const gripFirm = () => ['close', 'lift', 'return', 'settle'].includes(state) || (state === 'drop' && !!claw.landed);
// A finger never swings out faster than FLEX_RATE: hit faster than that, it pushes the prize instead
// of flicking open. And while the claw comes down open, the fingers are linked (FLEX_LINK): when one
// is pushed open the others follow part of the way, so the whole claw opens wider on landing rather
// than one finger snapping open on its own.
// Once closed (lift, return, settle) the claw stays shut until it lets go, as the user asked: no
// finger gives way any more, the prizes in the way are pushed aside (see carry).
function flexFingers(dt) {
  const fl = claw.flex, now = fingers(), firm = gripFirm(), give = firm ? CLOSE_GIVE : .002;

    if (pen > give) { if (!shut) fl[i] = Math.min(FLEX_MAX, fl[i] + Math.min((pen - give) * FLEX_GAIN, FLEX_RATE * dt)); continue; }
    // No springing back while a prize slips out or the claw lets go, or it would fight the opening
    if (fl[i] <= 0 || claw.slipping || state === 'release') continue;

    // against the prizes around it, up to the same give
    const back = fl.slice(); back[i] = Math.max(0, fl[i] - FLEX_RETURN * (firm ? 2 : 1) * dt);

    const top = Math.max(...fl);
    for (let i = 0; i < fl.length; i++) fl[i] = Math.max(fl[i], top * FLEX_LINK);

// Every finger tip has moved out past the prize, so nothing holds it any more
function tipsClear(p) {
  const h = claw.head;
  return fingers().every(fg => Math.hypot(fg.t[0] - h.x, fg.t[2] - h.z) >= p.r + FINGER_R);
}

// The tips are far enough apart round a loose prize, wherever it is, for it to drop between them
// with TOP_GAP to spare
function tipsWide(p) {
  return fingers().every(fg => Math.hypot(fg.t[0] - p.x, fg.t[2] - p.z) >= p.r + FINGER_R + TOP_GAP);

function syncClaw() {
  const h = claw.head;
  bridge.position.z = claw.z;
  carriage.position.set(claw.x, CARRIAGE_Y - .04, claw.z);
  cableSegs.forEach((m, i) => setSeg(m, [cable[i].x, cable[i].y, cable[i].z], [cable[i + 1].x, cable[i + 1].y, cable[i + 1].z]));
  // The body stands along the cable
  const fr = clawFrame();
  bodyBox.position.set(...clawPoint(fr, 0, 0, (HUB_UP - HUB_DOWN) / 2));
  bodyBox.quaternion.setFromUnitVectors(UP, vA.set(-fr.d[0], -fr.d[1], -fr.d[2]));

  // is "out" and its y axis "up" in that plane, rotated by th (as in fingers())

    const c = Math.cos(f.th), s = Math.sin(f.th), out = [0, 1, 2].map(k => f.ca * fr.e1[k] + f.sa * fr.e2[k]);

    vY.set(...[0, 1, 2].map(k => -s * out[k] + c * upv[k]));
    vZ.crossVectors(vX, vY);
    fingerMeshes[i].quaternion.setFromRotationMatrix(basis.makeBasis(vX, vY, vZ));
    fingerMeshes[i].position.set(...f.p);

  if (b.iI && im && !c.vb) {
    const rbx = -n[0] * b.r, rby = -n[1] * b.r, rbz = -n[2] * b.r;
    b.wx += b.iI * (rby * jz - rbz * jy); b.wy += b.iI * (rbz * jx - rbx * jz); b.wz += b.iI * (rbx * jy - rby * jx);

}

const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];

function solveContacts(cs, dt) {
  for (const c of cs) {
    const vn = dot(relVel(c), c.n);
    // Across a gap the bodies may still approach, just not past touching (no tunnelling, no fake bumps).
    // An impact that closes the gap within this step bounces now: braking it to just touching first, as
    // before, left it too slow to bounce next step, so a hop died dead about one time in four, and most
    // small hops did (the user felt the bounces stop short, October 2026).
    const hits = vn < -BOUNCE_MIN && vn * dt <= c.pen;
    c.target = hits ? -BOUNCE[c.kind] * vn : c.pen < 0 ? c.pen / dt : 0;
  }
  for (let it = 0; it < SOLVER_ITERS; it++) for (const c of cs) {
    const a = c.a, b = c.b, n = c.n, imb = b ? imOf(b, c) : 0;
    // Normal: never pull, only push
    let v = relVel(c);
    const jn0 = c.jn;
    c.jn = Math.max(0, jn0 + (c.target - dot(v, n)) / (a.im + imb));
    const j = c.jn - jn0;
    if (j) applyImpulse(c, n[0] * j, n[1] * j, n[2] * j);

    applyImpulse(c, jt[0] - c.jt[0], jt[1] - c.jt[1], jt[2] - c.jt[2]);

}

// Move overlapping bodies apart directly (no velocity change), sharing the push by inverse mass
function separate(cs) {

    const a = c.a, b = c.b, imb = b ? imOf(b, c) : 0, s = (c.pen - SLOP) * .9 / (a.im + imb), n = c.n;
    a.x -= n[0] * s * a.im; a.y -= n[1] * s * a.im; a.z -= n[2] * s * a.im;
    if (b && imb) { b.x += n[0] * s * imb; b.y += n[1] * s * imb; b.z += n[2] * s * imb; }

// The finger segments one step ago, relative to the head, for their own motion (closing, tilting)
let lastSegs = null;

  for (const p of prizes) if (!p.held) p.vy -= G * dt;

  const segs = segments(), h = claw.head;
  const segsRel = segs.map(s => s.map(q => [q[0] - h.x, q[1] - h.y, q[2] - h.z]));
  const segVel = lastSegs ? segsRel.map((s, i) => s.map((q, j) => q.map((v, k) => (v - lastSegs[i][j][k]) / dt))) : null;
  lastSegs = segsRel;

  const cs = findContacts(segs, segVel, MARGIN, !settling);
  solveContacts(cs, dt);
  // Is the claw (head or fingers) pressing on any prize? (see the drop's landing; walls count too, in swingHead)
  claw.touching = cs.some(c => c.b === claw.head && c.jn > 0);

  const touching = new Set(cs.filter(c => c.jn > 0).map(c => c.a));
  if (claw.held) {
    const onHeld = new Set(cs.filter(c => c.jn > 0 && c.b === claw.held).map(c => c.a));
    for (const c of cs) {
      const p = c.a;
      if (c.jn <= 0 || c.b !== h || !onHeld.has(p)) continue;
      const v = [p.vx - h.vx, p.vy - h.vy, p.vz - h.vz], s = Math.hypot(...v);
      if (s > SQUEEZE_MAX) { const k = SQUEEZE_MAX / s; p.vx = h.vx + v[0] * k; p.vy = h.vy + v[1] * k; p.vz = h.vz + v[2] * k; }
    }
  }
  // Likewise anything the claw pushes never leaves it faster than CLAW_PUSH_MAX (the fingers sweep in at
  // under 2): a loose capsule wedged in the closed fingers was shot out by the jolt at the top
  for (const c of cs) {
    const p = c.a;
    if (c.jn <= 0 || c.b !== h) continue;
    const v = [p.vx - h.vx, p.vy - h.vy, p.vz - h.vz], s = Math.hypot(...v);
    if (s > CLAW_PUSH_MAX) { const k = CLAW_PUSH_MAX / s; p.vx = h.vx + v[0] * k; p.vy = h.vy + v[1] * k; p.vz = h.vz + v[2] * k; }
  }
  for (const p of prizes) {
    if (p.held) continue;
    // A safety net: nothing in the machine moves faster than MAX_SPEED (a capsule dropped from the top
    // reaches about 8). The bosses' giant capsule, too big to be held, can ride up wedged in the closed
    // fingers, and the jolt at the top shot it out at up to 27.
    const s = Math.hypot(p.vx, p.vy, p.vz);
    if (s > MAX_SPEED) { const k = MAX_SPEED / s; p.vx *= k; p.vy *= k; p.vz *= k; }

  for (let it = 0; it < POS_ITERS; it++) separate(findContacts(segs, null, 0, !settling));

  for (let i = prizes.length - 1; i >= 0; i--) {
    const p = prizes[i];
    if (!p.held && p.y < -.75) { scene.remove(p.mesh); prizes.splice(i, 1); if (!settling) win(p); }
  }
}

// ---------- Game flow ----------

// A round is judged when the next one starts (or, out of coins, before the level is lost), so a prize
// still dropping into the hole when the claw is back counts for it. A round that won a prize the goal
// wanted adds to the streak; STREAK_N in a row win a coin. One that didn't (or dropped a bomb in) ends it.
function endRound() {
  if (!roundOpen) return;
  roundOpen = false;
  streak = roundGood ? streak + 1 : 0;
  if (streak >= STREAK_N) { streak = 0; coins++; flashCoins('#80ed99'); sfx('coin'); }
}
const flashCoins = color => { coinFlash = 1.2; board.flashColor = color; };

function startRound() {
  if (state !== 'idle' || coins <= 0 || endT !== null) return;   // (not while a cleared or lost level's card is coming)
  endRound();
  roundOpen = true; roundGood = false;
  if (!FREE_PLAY) coins--;
  state = 'aim'; aimT = AIM_TIME; sfx('coin'); hud();
}

function startDrop() {
  if (state !== 'aim') return;
  state = 'drop'; claw.winch = 0; claw.t = 0; claw.landed = false; claw.target = null; claw.slipping = null; claw.lose = null; claw.letGo = 0; claw.reshut = false; claw.tripFrom = undefined; claw.dropping = null; keys.l = keys.r = keys.u = keys.d = false; sfx('drop');
}

// When the claw starts closing, pickTarget() notes the prize right under it whose top half the closed
// tips could reach. It stays loose while the fingers close around it; grabTarget() decides at the end.
function pickTarget() {
  const h = claw.head, tipY = clawPoint(clawFrame(), 0, 0, -CLOSED_TIP_DOWN)[1];
  let pick = null, bd = 1e9;
  for (const p of prizes) {
    const dx = Math.hypot(p.x - h.x, p.z - h.z);
    if (dx < p.r * .8 && p.y < h.y && tipY < p.y + p.r * .5 && dx < bd) { bd = dx; pick = p; }
  }
  claw.target = pick;
}

// How a prize of radius r, centred on the claw's axis at height oy (claw frame), sits in the claw with
// all fingers at one angle: { angle, oy } for where it rests, or null if it isn't held.
// - The closed fingers would press into it: they rest on it, a little open (the angle), which holds it
//   only if the tips end up under its middle.
// - It fits loose inside the closed claw (the curved fingers make a cage): it settles down onto the
//   inward-curling tips (the oy it drops to), unless it would drop right through between them.
function cradle(r, oy) {
  const fr = clawFrame();
  const at = th => fingers(FINGER_ANGLES.map(() => th - claw.open * OPEN_ANGLE));
  const ball = up => { const c = clawPoint(fr, 0, 0, up); return { x: c[0], y: c[1], z: c[2], r }; };
  const pen = (th, up) => Math.max(...at(th).map(fg => fingerPenOn(fg, ball(up))));
  const tipsUnder = (th, up) => Math.max(...at(th).map(fg => fg.t[1])) < ball(up).y - r * .1;
  if (pen(0, oy) > 0) {
    let lo = 0, hi = FLEX_MAX_ANGLE;
    if (pen(hi, oy) > 0) return null;
    for (let i = 0; i < 20; i++) { const m = (lo + hi) / 2; if (pen(m, oy) > 0) lo = m; else hi = m; }
    return tipsUnder(hi, oy) ? { angle: hi, oy } : null;
  }
  // Lower it bit by bit until it first touches a finger (heights: lower is more negative). Too far
  // down it would be past the tips and touch nothing, so a single deep probe can't tell.
  for (let up = oy - .01; up > oy - .6; up -= .01) {
    if (pen(0, up) > 0) return tipsUnder(0, up + .01) ? { angle: 0, oy: up + .01 } : null;
  }
  return null;   // it would drop right through
}

// When closing is done: the prize is caught only if it really is held (see cradle). If the fingers
// rest on it, all but one must touch it; if it sits loose in the closed cage, all fingers but one must
// have closed round it. One left splayed on a neighbour closes in once the claw lifts off the pile (the
// others' tips hold the prize meanwhile); two would leave too wide a gap. A prize only pinched at
// the top isn't caught: the claw rises without it. Once caught it rides in the claw (claw.hold, see
// carry): it stays where it lay until the rising fingers lift it, never moving up in the claw (no magnet).
function grabTarget() {
  const p = claw.target, h = claw.head;
  claw.target = null;
  if (!p) return;
  const dx = Math.hypot(p.x - h.x, p.z - h.z);
  if (dx > p.r * .8) return;
  const f = clawFrame(), rel = [p.x - h.x, p.y - h.y, p.z - h.z];
  const dot = v => rel[0] * v[0] + rel[1] * v[1] + rel[2] * v[2];

  claw.q = 1 - dx / (p.r * .8);   // grip quality, 1 = dead centre

  if (LOSE_PATTERN) claw.lose = LOSE_PATTERN[caught % LOSE_PATTERN.length];
  else {
    const lose = (LOSE_BASE + (1 - claw.q) * LOSE_OFF) * (p.rare ? 1.6 : 1) * (SPECIAL[p.kind]?.slip || 1);
    claw.lose = Math.random() < lose ? (Math.random() < .5 ? 'top' : 'early') : null;

// The prize stops riding in the claw and is a loose body again (a slip, or letting go over the hole)
function detach() {
  const p = claw.held, h = claw.head;

  p.held = false; claw.held = null;
  p.vx = h.vx; p.vy = h.vy; p.vz = h.vz;
  return p;
}

// Carry the held prize. It doesn't move about in the claw by itself: it stays where it lay on the pile
// while the claw closes and starts to rise, until the fingers come up under it and lift it (at its rest
// height, see cradle). On the way they push it in to the middle, only as far as they have risen. An
// earlier version slid it down and to the middle at a steady rate, the moment it was caught, which
// looked like it was arranging itself in the claw (October 2026).

  const lifted = hd.oy <= hd.restOy;

  // nor against a neighbour as it lifts off the pile (the neighbour is pushed aside instead). One left

  // give way a little after closing, which looked like the claw opening again.
  for (let i = 0; i < c.flex.length; i++) if (c.flex[i] > hd.flex) c.flex[i] += (hd.flex - c.flex[i]) * k;

// Once lifted, the prize isn't glued to the claw: it moves a little inside it (hd.wb, offsets and

// little (WOBBLE.bounce), rocks back as the claw starts or brakes and rolls back to the middle, as in
// a bowl (WOBBLE.k, damped by WOBBLE.c). The fingers below it and the box above it stop it, and it

  wb.vw += (d3(a, f.e2) - WOBBLE.k * wb.w - WOBBLE.c * wb.vw) * dt;

// Carriage motor: approach the target velocity with limited acceleration, so it ramps up and brakes
function driveCarriage(tx, tz, dt) {
  const c = claw, ax = tx - c.vx, az = tz - c.vz, a = Math.hypot(ax, az), m = ACC * dt;
  if (a > m) { c.vx += ax / a * m; c.vz += az / a * m; } else { c.vx = tx; c.vz = tz; }
  c.x += c.vx * dt; c.z += c.vz * dt;
  if (Math.abs(c.x) > LIMIT.x) { c.x = Math.sign(c.x) * LIMIT.x; c.vx = 0; }
  if (Math.abs(c.z) > LIMIT.z) { c.z = Math.sign(c.z) * LIMIT.z; c.vz = 0; }
}

// The head is a point mass on an elastic cable that can only pull (it goes slack when the head lands).
// Gravity plus the cable make it a pendulum under the carriage. Returns the carriage-to-head distance.
function swingHead(dt) {
  const c = claw, h = c.head, mass = HEAD_MASS + (c.held ? c.held.r ** 3 / .03 : 0);
  const dx = h.x - c.x, dy = h.y - CARRIAGE_Y, dz = h.z - c.z, dist = Math.hypot(dx, dy, dz);
  // While closing, and while the winch then reels in the slack, the claw rests where it landed (see
  // imOf). Left free during the reel-in, it sank into the pile by up to 0.3 before the cable pulled.
  if (state === 'close' || (state === 'lift' && c.len > dist)) { h.vx = h.vy = h.vz = 0; return dist; }
  let ax = 0, ay = -G, az = 0;
  if (dist > c.len) {
    const nx = dx / dist, ny = dy / dist, nz = dz / dist;
    const vrel = (h.vx - c.vx) * nx + h.vy * ny + (h.vz - c.vz) * nz;
    const f = Math.max(0, ROPE_K * (dist - c.len) + ROPE_C * vrel) / mass;
    ax -= f * nx; ay -= f * ny; az -= f * nz;

  // It comes from friction up at the carriage, which brakes a short pendulum hard and a long one
  // barely (it falls with the square of the cable length): heavy and steady at the top, but the claw
  // keeps the sway it had when it starts going down. A small floor stands for air drag.

  // over the round tops of the capsules under its fingers
  if (state === 'drop' && c.landed) { [h.x, h.z] = c.landed; h.vx = c.vx; h.vz = c.vz; }

  if (h.y < minY) { h.y = minY; if (h.vy < 0) h.vy *= -.2; h.vx *= .9; h.vz *= .9; }

  const s = clawWallPush(), sl = Math.hypot(...s);

  const top = CARRIAGE_Y - HOOK_UP - .05;

  if (Math.abs(h.z) > bz) { h.z = Math.sign(h.z) * bz; h.vz *= -.3; }

// The grip sometimes gives way. Whether a catch will be lost, and how, is settled when it is caught
// (claw.lose, see grabTarget: for now a fixed pattern, LOSE_PATTERN), and the claw never opens while
// it rises. The user asked for these two kinds (October 2026); before, a slip could start at any
// moment, mid-rise included, which looked odd. Either way the claw keeps going to the hole as usual,
// and the prize just falls, with the claw's speed, wherever that leaves it.
// - 'top': the winch pulls the claw's box up into the carriage (see the lift and hitTop). The blow
//   knocks the fingers open and the prize is loose from that moment, so nothing places it: it keeps
//   going up with the speed it had, knocks against the box as the claw bounces back down, and falls
//   out between the opening fingers. After TOP_SHUT_IN the motor shuts them again on the way
//   (restClose). The user found the earlier version, which opened the claw at its highest point on
//   its cable without any real blow, didn't feel like the hit shook the prize loose (October 2026).

      case 'coin': tone(988, 0, .08, 'square', .05); tone(1319, 0, .25, 'square', .05, .08); break;
      case 'drop': tone(600, 200, .6, 'triangle', .08); break;
      case 'clank': tone(180, 90, .12, 'square', .07); break;
      case 'clack': tone(320, 140, .07, 'square', .08); tone(90, 60, .1, 'triangle', .1); break;
      case 'clunk': tone(200, 90, .09, 'square', .08); tone(70, 45, .14, 'triangle', .12); break;
      case 'motor': tone(110, 170, .3, 'sawtooth', .025); break;
      case 'grab': tone(400, 800, .12, 'triangle', .08); break;
      case 'slip': tone(220, 80, .3, 'sawtooth', .05); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, .18, 'square', .05, i * .09)); break;
      case 'prize': [784, 988, 1175, 1568].forEach((f, i) => tone(f, f * 1.01, .22, 'triangle', .07, i * .07)); tone(1568, 2093, .4, 'sine', .05, .3); break;
      case 'boom': tone(160, 40, .45, 'sawtooth', .09); tone(60, 30, .5, 'triangle', .14); break;

// Background music, from the same little synth (there is no music file yet): a cheerful loop, an
// arpeggio over C, G, Am and F, a bar each, with a soft bass and a little tune over it, at MUSIC_BPM.
// Notes are scheduled a little ahead (every 100 ms, up to .3 s on). It starts with the first touch or
// key (browsers only play sound after one) and stops while the page is hidden.
const MUSIC_BPM = 108, MUSIC_VOL = .035;
const CHORDS = [[60, 64, 67], [55, 59, 62], [57, 60, 64], [53, 57, 60]];   // MIDI notes: C, G, Am, F
const TUNE = [76, 0, 79, 0, 76, 74, 72, 0,  74, 0, 79, 0, 74, 72, 71, 0,  72, 0, 76, 0, 72, 71, 69, 0,  69, 0, 72, 0, 74, 0, 0, 0];   // eighths, 0 = rest
const music = { on: false, next: 0, step: 0, timer: 0 };
const hz = m => 440 * 2 ** ((m - 69) / 12);
function note(m, at, d, type, v) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = hz(m);
  g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(v, at + .015); g.gain.exponentialRampToValueAtTime(.0005, at + d);
  o.connect(g).connect(ac.destination); o.start(at); o.stop(at + d + .05);
}
function musicTick() {
  const e = 30 / MUSIC_BPM;   // an eighth, in seconds
  while (music.next < ac.currentTime + .3) {
    const s = music.step % 32, ch = CHORDS[s >> 3], i = s % 8, at = music.next;
    note([ch[0], ch[1], ch[2], ch[0] + 12, ch[2], ch[1], ch[0] + 12, ch[2]][i], at, e * .9, 'triangle', MUSIC_VOL);
    if (i % 4 === 0) note(ch[0] - 12, at, e * 3.6, 'sine', MUSIC_VOL * 2.2);
    if (TUNE[s]) note(TUNE[s], at, e * 1.8, 'square', MUSIC_VOL * .45);
    music.next += e; music.step++;
  }
}
function musicStart() {
  if (music.on || musicMuted) return;
  try { audio(); } catch (e) { return; }
  music.on = true; music.next = ac.currentTime + .1;
  music.timer = setInterval(musicTick, 100);
}
function musicStop() { music.on = false; clearInterval(music.timer); }
for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => { if (!music.on && !document.hidden) musicStart(); }, { capture: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) musicStop(); });

// The pad, a joystick like the maze game's (it replaced a four-button d-pad, October 2026). Its base
// jumps to where the finger lands inside the pad and the knob follows the finger, up to STICK_R away:
// the direction steers the claw (up = away from you) and how far it is pushed sets the speed, with a
// small dead zone (STICK_DEAD). Touching it while idle starts the round, like the arrow keys.
const STICK_R = 52, STICK_DEAD = .18;
const stick = { id: null, bx: 0, by: 0, x: 0, y: 0, mag: 0 };
const $pad = $('pad'), $stick = $('stick'), $knob = $('knob');
function stickMove(cx, cy) {

  $knob.style.transform = `translate(${dx}px, ${dy}px)`;
  const m = Math.min(1, d / STICK_R);
  stick.mag = m < STICK_DEAD ? 0 : (m - STICK_DEAD) / (1 - STICK_DEAD);
  stick.x = d > 0 ? dx / Math.max(d, STICK_R) : 0; stick.y = d > 0 ? dy / Math.max(d, STICK_R) : 0;

// The daily challenge: a level made from the date (the same all day, its first pile too), to play on
// its own. It keeps the most stars won today and how many days in a row it was cleared. The user asked
// for it to play alone, without comparing with anyone (October 2026).
const DAILY_KEY = 'clawMachine.daily';
let daily = { day: '', stars: 0, streak: 0 };
try { daily = { ...daily, ...JSON.parse(localStorage.getItem(DAILY_KEY)) }; } catch (e) {}
const dayKey = d => d.toLocaleDateString('sv');   // YYYY-MM-DD, local time
const today = () => dayKey(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); };
const hashStr = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 2654435761) >>> 0, 2166136261);
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// Two or three of the world's capsules (sometimes a legendary one), one or two of each, with one or two
// twists. The world is one of those already open, picked by the date too.
function genDaily(day) {
  const r = mulberry32(hashStr(day)), pick = a => a.splice(r() * a.length | 0, 1)[0];
  const open = WORLDS.filter((w, i) => worldOpen(i)).length, world = Math.floor(r() * open);
  const slots = ['C1', 'C2', 'U1', 'U2', 'R1'], goal = [];
  for (let i = 0, n = 2 + (r() < .5); i < n; i++) goal.push([pick(slots), 1 + (r() < .5)]);
  if (r() < .3) goal[0] = ['L1', 1];
  const l = { goal }, twists = ['order', 'small', 'big', 'bombs', 'skull', 'bonus', 'pedestal'];
  for (let i = 0, n = 1 + (r() < .5); i < n; i++) {
    const t = pick(twists);
    if (t === 'order') l.order = true;
    if (t === 'small') l.size = [.25, .27];
    if (t === 'big' && !l.size) l.size = [.34, .36];
    if (t === 'bombs') l.traps = { ...l.traps, bomb: 2 };
    if (t === 'skull') l.traps = { ...l.traps, skull: 1 };
    if (t === 'bonus') l.bonus = 1;
    // (the first capsule, just one, goes on a pedestal)
    if (t === 'pedestal') { goal[0][1] = 1; l.stands = 'one'; l.onTop = [goal[0][0]]; }
  }
  l.coins = goal.reduce((s, [, n]) => s + n, 0) * 3 + 2 - (l.bonus ? 2 : 0);
  return cookLevel(l, world);
}
function startDaily() {
  const day = today();
  rnd = mulberry32(hashStr(day) + 1);
  startLevel(-1, genDaily(day));
}
// The daily challenge cleared with st stars: today's best and the run of days. Returns the run.
function dailyDone(st) {
  const day = today();
  if (daily.day !== day) { daily.streak = daily.day === yesterday() ? daily.streak + 1 : 1; daily.day = day; daily.stars = 0; }
  daily.stars = Math.max(daily.stars, st);
  try { localStorage.setItem(DAILY_KEY, JSON.stringify(daily)); } catch (e) {}
  return daily.streak;
}

// A carousel of pages, one world each, side by side (the gallery's and the exhibitor's): swiped, dragged
// with the mouse like a swipe (it settles on the next or previous page if it moved over 40 px), or
// stepped with the arrows; the dots show which page it is on. idx is the page shown: set when going to
// one, and read back from the scroll position once a swipe stops. The user asked for each page to fill
// the whole width (October 2026): the next one used to peek in at the side and looked cut off.
// The shelf must stay position: relative, since the pages' offsetLeft is measured from it.
function carousel(shelf, prev, next, dots) {
  const pages = () => [...shelf.children];
  const c = { idx: 0 };
  const near = () => {
    const mid = shelf.scrollLeft + shelf.clientWidth / 2;
    let best = 0, bd = 1e9;
    pages().forEach((el, i) => { const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });
    return best;
  };
  const mark = i => {
    pages().forEach((el, k) => el.classList.toggle('on', k === i));
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
    prev.disabled = i === 0; next.disabled = i === pages().length - 1;
  };
  c.show = (i, smooth = true) => {
    const el = pages()[i];
    if (!el) return;
    c.idx = c.going = i;
    shelf.scrollTo({ left: el.offsetLeft - (shelf.clientWidth - el.offsetWidth) / 2, behavior: smooth ? 'smooth' : 'instant' });
    mark(i);
  };
  // (call it once the screen shows: while hidden the pages have no size, so the scroll stayed on the
  // first page while the dots marked another, which the user saw)
  c.fill = (html, at) => { shelf.innerHTML = html; dots.innerHTML = pages().map(() => '<i></i>').join(''); c.show(at, false); };
  // (a dot goes to its page)
  dots.addEventListener('click', e => { const i = [...dots.children].indexOf(e.target); if (i >= 0) c.show(i); });
  // The dots follow the scroll as it goes, on the page most of which is in view, so they change as soon
  // as a swipe passes half way (they used to wait for the scroll to stop, which the user found slow,
  // October 2026). While show() slides to a page they stay on it, not on the ones it passes.
  let ticking = false;
  shelf.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const i = near();
      if (c.going != null) { if (i === c.going) c.going = null; return; }
      if (i !== c.idx) mark(c.idx = i);
    });
  });
  // The mouse works like a finger: dragged sideways it swipes the pages, up or down it scrolls the page
  // (as does the wheel). The drag only starts once the mouse has moved a few pixels, in the direction it
  // moved most, so a click on a card still reaches it.
  const drag = { id: null };
  shelf.addEventListener('pointerdown', () => { c.going = null; });   // (a finger or the mouse takes over from a slide)
  shelf.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    const page = pages()[c.idx];
    Object.assign(drag, { id: e.pointerId, x: e.clientX, y: e.clientY, left: shelf.scrollLeft, page, top: page ? page.scrollTop : 0, from: c.idx, on: null, v: 0, t: 0, lx: e.clientX });
  });
  shelf.addEventListener('pointermove', e => {
    if (e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on && Math.max(Math.abs(dx), Math.abs(dy)) > 6) {
      drag.on = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      shelf.setPointerCapture(e.pointerId); shelf.classList.add('drag');
    }
    if (drag.on === 'x') shelf.scrollLeft = drag.left - dx;
    if (drag.on === 'y' && drag.page) drag.page.scrollTop = drag.top - dy;
    // (how fast it is moving sideways, in px/ms, smoothed over the last moves, for a flick)
    const now = performance.now(), dt = now - (drag.t || now);
    if (dt > 0) drag.v = .7 * (drag.v || 0) + .3 * (e.clientX - drag.lx) / dt;
    drag.t = now; drag.lx = e.clientX;
  });
  // Let go, it settles on the page most of which is in view: dragged past half way it goes on to the
  // next one, short of that it goes back. A quick flick goes on to the next one however far it went.
  // Snapping stays off until it has slid there, or the browser's snap would cut the slide short with a
  // jump: the user found the release abrupt, going back to the middle (October 2026).
  let unsnap = 0;
  for (const ev of ['pointerup', 'pointercancel']) shelf.addEventListener(ev, e => {
    if (e.pointerId !== drag.id) return;
    drag.id = null;
    if (drag.on !== 'x') { shelf.classList.remove('drag'); return; }
    const ps = pages(), step = ps.length > 1 ? ps[1].offsetLeft - ps[0].offsetLeft : 1, moved = e.clientX - drag.x;
    let to = Math.round(drag.from + (drag.left - shelf.scrollLeft) / -step);
    if (Math.abs(drag.v || 0) > .5 && Math.abs(moved) > 20) to = drag.from + (drag.v < 0 ? 1 : -1);
    c.show(clamp(to, 0, ps.length - 1));
    clearTimeout(unsnap);
    unsnap = setTimeout(() => shelf.classList.remove('drag'), 450);
  });
  prev.addEventListener('click', () => c.show(Math.max(0, c.idx - 1)));
  next.addEventListener('click', () => c.show(Math.min(pages().length - 1, c.idx + 1)));
  return c;
}
const galCar = carousel($('shelf'), $('galPrev'), $('galNext'), $('galDots'));
const charCar = carousel($('charShelf'), $('charPrev'), $('charNext'), $('charDots'));
const worldCar = carousel($('worldShelf'), $('worldPrev'), $('worldNext'), $('worldDots'));
// The world the screens open on: the one being played
const worldNow = () => lv.world;
const lockedNote = w => `<p class="sub">Se abre al superar al jefe de ${WORLDS[w - 1].name}</p>`;

// The gallery (the capsule button, top left): a page per world with its nine capsules in a panel per
// rarity, each with its name on a label and how far its card is to complete (a bar to CHAR_EVERY, with the count inside it). A complete card
// glows and says so (with how many times it can be opened); tapping it opens it (openCard). Kinds not
// won yet show as dark silhouettes; a world not open yet is locked. The game holds still and isn't
// drawn while it is open. It opens on page `at`, by default the world being played.
function openGallery(at = worldNow()) {
  showScreen('gallery');
  galCar.fill(WORLDS.map((wd, w) => {
    const locked = !worldOpen(w), kinds = Object.fromEntries(worldKinds(w).map(k => [k.key, k]));
    const slot = k => {
      const id = `${wd.id}:${k.key.slice(1)}`, n = meta.balls[id] || 0, prog = meta.prog[id] || 0, c = capOf(k.key, kinds);
      const ready = Math.floor(prog / CHAR_EVERY), part = prog % CHAR_EVERY;
      return `<div class="slot t${k.tier}${n ? '' : ' none'}${ready ? ' ready' : ''}" data-w="${w}" data-b="${k.key.slice(1)}">` +
        `<span class="name">${k.name}</span><div class="pod"><div class="cap ${c.cls}" style="${c.style}"></div></div>` +
        (ready ? `<span class="open">¡Abrir!${ready > 1 ? ` ×${ready}` : ''}</span>`
          : `<span class="bar"><i style="width:${part / CHAR_EVERY * 100}%"></i><b>${locked ? '?' : `${part}/${CHAR_EVERY}`}</b></span>`) + `</div>`;
    };
    const slots = worldKinds(w).map(slot).join('');
    // (the banner counts the capsules won at least once, of the world's nine, like the collection's count)
    const have = worldKinds(w).filter(k => meta.balls[`${wd.id}:${k.key.slice(1)}`]).length;
    return `<section class="season${locked ? ' locked' : ''}">${banner(w, wd.name, locked ? '<span>🔒</span>' : `<span>${have}/9</span>`)}` +
      (locked ? lockedNote(w) : '') + `<div class="shelf">${slots}</div></section>`;   // (the user dropped the hint line, October 2026)
  }).join(''), at);
}
$('shelf').addEventListener('click', e => { const el = e.target.closest('.slot.ready'); if (el) openCard(+el.dataset.w, +el.dataset.b); });
// The exhibitor (the character button, top left): a page per world, a shelf per rarity (row 1 common to
// row 4 legendary, as on the concept sheets), and on it the five characters: the ones won with how
// many (they can repeat), the rest as dark silhouettes with "?".
function openChars() {
  showScreen('chars');
  charCar.fill(WORLDS.map((wd, w) => {
    const have = wd.chars.filter((c, i) => meta.chars[`${wd.id}:${i}`]).length;
    const rows = CHAR_TIERS.map((t, r) => `<div class="rack t${r}"><span class="rtitle">${t}</span><div class="row5">` + [0, 1, 2, 3, 4].map(c => {
      const i = r * 5 + c, n = meta.chars[`${wd.id}:${i}`] || 0;
      return `<span class="toy${n ? '' : ' none'}"><span class="plate">${n ? charName(w, i) : '?'}</span>` +
        `<span class="pic"><img src="${charSrc(w, i)}" alt="" loading="lazy" draggable="false">${n ? '' : '<i>?</i>'}</span>${n > 1 ? `<b>×${n}</b>` : ''}</span>`;
    }).join('') + '</div></div>').join('');
    return `<section class="season${worldOpen(w) ? '' : ' locked'}">${banner(w, wd.name, `<span>${have}/20</span>`)}${worldOpen(w) ? '' : lockedNote(w)}${rows}</section>`;
  }).join(''), worldNow());
  $('charBtn').classList.remove('new');
}
// Show one of the screens (and hide the others); the game holds still while one is open. Closing one
// goes back to the machine, and to the level's card if it had ended.
function showScreen(id) {
  for (const s of SCREENS) $(s).hidden = s !== id;
  $('over').hidden = true; paused = true; stickEnd();
  keys.l = keys.r = keys.u = keys.d = false;
}
function closeScreens() {
  for (const s of SCREENS) $(s).hidden = true;
  paused = false;
  if (state === 'over') $('over').hidden = false;
}
// From one screen to another: each has buttons for the others
for (const [btn, open] of [['galToLvl', openWorlds], ['lvlToGal', openGallery], ['galToChar', openChars], ['charToGal', openGallery], ['charToLvl', openWorlds], ['lvlToChar', openChars], ['lvlToWorlds', openWorlds], ['wToGal', openGallery], ['wToChar', openChars]]) $(btn).addEventListener('click', () => open());
$('galBtn').style.setProperty('--c', KINDS[0].css);
$('galBtn').addEventListener('click', () => openGallery());
$('charBtn').addEventListener('click', openChars);
for (const b of ['galBack', 'charBack']) $(b).addEventListener('click', closeScreens);
addEventListener('blur', () => { keys.l = keys.r = keys.u = keys.d = false; });
// On an iPhone, two quick taps zoomed the whole page in, as on a photo, and a pinch could too; the user
// noticed it (October 2026). Safari ignores the viewport's "no zoom" for that, so: a second touch that
// ends within 350 ms of the one before doesn't get its default (the zoom; the game reads its taps from
// pointer events, which still arrive), and pinch gestures are refused.
{
  let lastEnd = 0;
  document.addEventListener('touchend', e => { const now = performance.now(); if (now - lastEnd < 350) e.preventDefault(); lastEnd = now; }, { passive: false });
  for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
}

// ---------- Layout and loop ----------

// Frame the machine: the camera backs off just enough for the cabinet's corners (FIT_CORNERS) to fit
// between the top of the screen and the controls, and the view is shifted so the machine sits centred
// in that gap. The scoreboard is on the machine itself, so nothing takes room at the top. On wide
// screens the controls sit in the bottom corners, beside the machine, so they take no height.
const FIT_CORNERS = [];
for (const x of [-1, 1]) for (const y of [BOARD_TOP - BOARD_H - .06, MARQUEE_Y + MARQUEE_H / 2 + .03]) for (const z of [-1, 1]) FIT_CORNERS.push(new THREE.Vector3(x * (CAB_X / 2 + .05), y, z * (CAB_Z / 2 + .05)));
function fit() {
  const w = innerWidth, h = innerHeight, wide = w / h > 1.2;
  document.body.classList.toggle('wide', wide);
  const topPad = 8, botPad = wide ? 8 : $('controls').offsetHeight + 16, freeH = Math.max(150, h - topPad - botPad);
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.clearViewOffset();
  const v = new THREE.Vector3();
  // The machine's extent on screen, in pixels, with the camera this far back
  const extent = dist => {
    camera.position.copy(CAM_TARGET).addScaledVector(CAM_DIR, dist);
    camera.lookAt(CAM_TARGET); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    let top = 1e9, bottom = -1e9, width = 0;
    for (const p of FIT_CORNERS) {
      v.copy(p).project(camera);
      const y = (1 - v.y) / 2 * h;
      top = Math.min(top, y); bottom = Math.max(bottom, y); width = Math.max(width, Math.abs(v.x) * w);
    }
    return { top, bottom, width };
  };
  let lo = 3, hi = 80;
  for (let i = 0; i < 30; i++) {
    const m = (lo + hi) / 2, e = extent(m);
    if (e.bottom - e.top > freeH || e.width > w - 16) lo = m; else hi = m;
  }
  const e = extent(hi);
  camera.setViewOffset(w, h, 0, (e.top + e.bottom) / 2 - (topPad + freeH / 2), w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', fit);

let last = performance.now(), acc = 0, paused = false;   // paused: while the settings are open, or for inspecting with game.step
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000);
  last = now; acc = paused ? 0 : acc + dt;
  while (acc >= STEP) { update(STEP); physics(STEP, state === 'fill'); acc -= STEP; }
  if (!screenOpen()) draw(now);
  requestAnimationFrame(frame);
}

function draw(now) {
  for (const p of prizes) p.mesh.position.set(p.x, p.y, p.z);
  syncClaw();
  const tick = Math.floor(now / 160);
  // (the marquee's bulbs chase; when a capsule drops in they all blink at once a few times first, as the
  // user asked, October 2026, then chase again)
  const st = lightShow.at < 0 ? -1 : (now - lightShow.at) / 1000;
  for (const [b, i] of bulbs) b.material = st >= 0 && st < BULB_BLINK ? (Math.floor(st / .14) % 2 === 0 ? BULB_ON : BULB_OFF) : (i + tick) % 3 === 0 ? BULB_ON : BULB_OFF;
  lightsTick(now);
  if (skin?.chase && Math.floor(tick / 2) !== skinTick) { skinTick = Math.floor(tick / 2); marqueeTex.repaint(); }
  hudTime();
  renderer.render(scene, camera);
}

// Handle for poking at the game from the console
window.game = { get state() { return state; }, get paused() { return paused; }, set paused(v) { paused = v; }, get claw() { return claw; }, get prizes() { return prizes; }, get score() { return score; }, get level() { return level; }, get got() { return got; }, get meta() { return meta; }, get coins() { return coins; }, get bag() { return bag; }, levelCard, lightShow, lanterns, ballToast, startLevel, startDaily, showIntro, startRound, startDrop, segments, cable,
  // Run n simulation steps right now, without waiting for frames (fast, repeatable tests)
  step(n = 1) { for (let i = 0; i < n; i++) { update(STEP); physics(STEP, state === 'fill'); } },
  // Draw the current state right now (the browser pane may not be asking for frames)
  draw() { draw(performance.now()); },
  // Look at a point from close up (to inspect the claw); fit() puts the normal view back
  closeUp(x, y, z, dist = 1.6) {
    camera.clearViewOffset(); camera.position.set(x + dist * .35, y + dist * .45, z + dist);
    camera.lookAt(x, y, z); camera.updateProjectionMatrix(); draw(performance.now());
  },
  fit };

startLevel(level);
fit();
requestAnimationFrame(frame);
</script>
