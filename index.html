<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Claw Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1b1430; --ink: #fff6e0; --pink: #e8457a; --pink-dark: #8a1f48; --gold: #ffd23f; --panel: #2b1850; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--ink); font-family: Kalam, "Comic Sans MS", cursive; font-weight: 700;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  /* (buttons take taps but never a double-tap zoom: see the iPhone note by the touch guard) */
  button { touch-action: manipulation; }
  canvas { display: block; position: fixed; inset: 0; }
  #controls {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; align-items: center; gap: 28px; pointer-events: none;
  }
  body.wide #controls { justify-content: space-between; padding: 0 max(24px, 5vw); }
  /* Settings: pad on the right, the drop button on the left (for right-handed players) */
  body.swap #controls { flex-direction: row-reverse; }
  /* Pad: a joystick like the maze game's. Its base rests here; touched, it jumps to the finger and the
     knob follows it, and how far you push sets the speed. */
  #pad { position: relative; width: 150px; height: 150px; pointer-events: auto; touch-action: none; cursor: grab; }
  #stick { position: absolute; left: 50%; top: 50%; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; pointer-events: none;
    background: rgba(232, 69, 122, .22); border: 4px solid var(--pink-dark); box-shadow: 0 4px 0 rgba(138, 31, 72, .6); }
  #knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: var(--pink); border: 4px solid var(--pink-dark); box-shadow: 0 4px 0 var(--pink-dark); }
  #gear { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center; font: inherit; font-size: 26px; line-height: 1; color: var(--ink); cursor: pointer;
    background: var(--panel); border: 3px solid var(--gold); border-radius: 12px; }
  #lvlBtn, #galBtn, #charBtn { position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center; cursor: pointer; background: var(--panel); border: 3px solid var(--gold); border-radius: 12px;
    font: inherit; font-size: 26px; line-height: 1; color: var(--gold); }
  #galBtn { left: calc(max(10px, env(safe-area-inset-left)) + 52px); }
  #galBtn .cap { width: 24px; height: 24px; box-shadow: none; }
  #charBtn { left: calc(max(10px, env(safe-area-inset-left)) + 104px); }
  #charBtn img { width: 34px; height: 34px; }
  /* A capsule drawn in CSS for the gallery: its colour (--c) with a highlight, the lower half a little
     darker, and the dark band where the halves meet, tilted like a toy lying on a shelf */
  .cap { --c: #ff5d8f; position: relative; width: 76px; height: 76px; border-radius: 50%; overflow: hidden; transform: rotate(-18deg);
    background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .8) 0 6%, transparent 20%),
      radial-gradient(circle at 50% 38%, var(--c) 0 50%, color-mix(in srgb, var(--c) 55%, #000) 100%);
    box-shadow: 0 6px 0 rgba(0, 0, 0, .28); }
  .cap::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: rgba(0, 0, 0, .12); }
  .cap::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 12%; margin-top: -6%; background: #2a1d40; }
  .cap.mini { display: inline-block; width: 26px; height: 26px; box-shadow: none; flex: none; vertical-align: middle; }
  /* "Any colour" in a level's goal: a capsule of all the colours */
  .cap.any { background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .8) 0 6%, transparent 20%),
      conic-gradient(#ff5d8f 0 20%, #4cc9f0 0 40%, #80ed99 0 60%, #b388ff 0 80%, #ff9f43 0); }
  /* The gallery and the levels: screens of their own over the machine */
  /* (the title on top and the buttons at the bottom stay put; only what is between them scrolls, as in
     the maze game: the user asked for it, October 2026) */
  .screen { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background: #000; display: flex; flex-direction: column; align-items: center; }   /* (black, as the user asked) */
  .screen > * { flex: none; }
  .screen h2 { margin: 6px 0 0; font-size: 38px; color: var(--gold); text-shadow: 0 3px 0 var(--pink-dark); }
  .screen .sub { margin: 0 0 18px; font-size: 20px; opacity: .85; text-align: center; }
  /* The gallery's and the exhibitor's worlds side by side, one whole world at a time: swipe (dragged
     with the mouse on a computer) or the arrows to the next. The user asked for it (October 2026); the
     next one used to peek in at the side, which looked cut off. */
  .pages { position: relative; display: flex; gap: 24px; width: 100%; max-width: 900px; overflow-x: auto; scroll-snap-type: x mandatory; touch-action: pan-x pan-y;
    scrollbar-width: none; overscroll-behavior-x: contain; cursor: grab; flex: 1 1 auto; min-height: 0; }
  .pages::-webkit-scrollbar { display: none; }
  .pages.drag { scroll-snap-type: none; cursor: grabbing; }
  .pages img { -webkit-user-drag: none; }
  .season { flex: 0 0 100%; scroll-snap-align: center; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-width: none; padding: 0 2px 8px; }
  /* (no scroll bars: the finger, the mouse dragging and the wheel scroll them, as the user asked) */
  .season::-webkit-scrollbar, #lvlList::-webkit-scrollbar { display: none; }
  .nav { display: flex; align-items: center; gap: 14px; margin: 10px 0 12px; }
  .nav button { width: 40px; height: 40px; padding: 0; font: inherit; font-size: 28px; line-height: 1; color: var(--gold); background: var(--panel);
    border: 3px solid var(--gold); border-radius: 50%; cursor: pointer; }
  .nav button:disabled { opacity: .3; cursor: default; }
  /* On a phone (a touch screen) the pages are swiped, so the arrows go and the dots are enough, as the user asked (October 2026) */
  @media (hover: none) and (pointer: coarse) { .nav button { display: none; } .nav { margin: 14px 0 16px; } }
  /* The worlds screen has no arrows anywhere (the user asked); with the mouse it is dragged, or a dot clicked */
  #worldPrev, #worldNext { display: none; }
  .dots i { cursor: pointer; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); opacity: .3; }
  .dots i.on { opacity: 1; background: var(--gold); }
  .backs { margin-top: auto; padding-top: 4px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .back.alt { background: var(--panel); color: var(--ink); border-color: var(--gold); }
  .season h3 { display: flex; justify-content: space-between; margin: 0 4px 10px; font-size: 22px; color: var(--gold); }
  .season .sub { font-size: 16px; margin-bottom: 10px; }
  .season.locked .shelf, .season.locked .rack { opacity: .5; }
  /* The gallery's capsules: rarity, and a bar to the next character with how far along it is, small,
     inside it (the user asked for it in place of a big number and the total won, October 2026) */
  .slot .tier { font-size: 13px; line-height: 1; }
  .slot .bar { position: relative; width: 80%; height: 20px; border-radius: 10px; background: rgba(255, 255, 255, .12); overflow: hidden; }
  .slot .bar i { display: block; height: 100%; background: var(--gold); }
  .slot .bar b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: inherit; line-height: 1; color: #fff6e0; text-shadow: 0 1px 2px rgba(0, 0, 0, .9); }
  /* The exhibitor: a framed panel (rack) per rarity, its name on a tab over the top left corner, and in
     it five tiles, a character each with its name on a plate above it. From the user's reference
     (October 2026); before, it was a dark grey shelf with the characters standing on its board. Each
     rarity has its colours: the panel (--bg), its frame and tab (--rim), the tiles (--tile). */
  .rack { --bg: #f1e3c6; --rim: #8a5a36; --tile: #e4d0a8; --ink2: #4a2c14;
    position: relative; margin: 22px 2px 16px; padding: 26px 8px 10px; border: 4px solid var(--rim); border-radius: 18px;
    background: var(--bg); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .45), 0 6px 0 rgba(0, 0, 0, .35); }
  .rack.t1 { --bg: #d6f2d8; --rim: #3f8f57; --tile: #b9e3c0; --ink2: #1d4a2a; }
  .rack.t2 { --bg: #cfe8f6; --rim: #3a76a6; --tile: #afd3ea; --ink2: #173a5a; }
  .rack.t3 { --bg: #ffeeb8; --rim: #c08a1a; --tile: #f8db86; --ink2: #5a3b00; }
  .rack .rtitle { position: absolute; top: -18px; left: 12px; padding: 3px 14px 4px; border-radius: 10px; background: var(--rim); color: #fff;
    font-size: 18px; line-height: 1.1; transform: rotate(-3deg); text-shadow: 0 2px 0 rgba(0, 0, 0, .3); box-shadow: 0 3px 0 rgba(0, 0, 0, .3); }
  .row5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  /* A tile: the name's plate at the top, then the character over a soft spot of floor; a character not
     won yet is a dark silhouette with "?" and no name */
  .toy { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 3px; border-radius: 12px;
    background: radial-gradient(60% 10% at 50% 92%, rgba(0, 0, 0, .12), transparent 100%), var(--tile);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .5), inset 0 -2px 0 rgba(0, 0, 0, .08); }
  /* (the plate sits on the tile's top edge, half over it, as the user asked: its height is 1.2em + 4px.
     The picture keeps clear of it: at first it was pulled up under the plate with it, and the user saw
     the plate cover more of the character) */
  .toy .plate { position: relative; z-index: 1; max-width: 100%; margin: calc(-.6em - 2px) 0 5px; padding: 2px 6px; border-radius: 8px; background: rgba(255, 255, 255, .94); color: var(--ink2);
    font-size: clamp(11px, 2.6vw, 17px); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 2px 0 rgba(0, 0, 0, .12); }
  .toy.none .plate { visibility: hidden; }
  /* (every cut has the same scale and its base at the same height, so the characters keep their sizes
     as drawn and stand on one line; the picture is a little wider than the tile, and what sticks out at
     the sides may show past it, as the user asked: only the top and bottom are clipped) */
  .toy .pic { position: relative; width: 100%; clip-path: inset(0 -50%); }
  .toy img { display: block; width: 150%; max-width: none; aspect-ratio: 1; margin: -9% -25% -12%; object-fit: contain; pointer-events: none; }
  .toy.none img { filter: brightness(0); opacity: .72; }
  .toy .pic i { position: absolute; inset: 0 0 12%; display: flex; align-items: center; justify-content: center; font-style: normal;
    font-size: clamp(16px, 4.5vw, 30px); color: rgba(255, 255, 255, .45); }
  .toy b { position: absolute; bottom: -6px; right: -4px;   /* (at the bottom, clear of the name, as the user asked) */
    padding: 1px 6px; border-radius: 10px; font-size: 13px; line-height: 1.2;
    background: #ff4f7b; color: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
  /* A character just won, at the top of the screen for a moment */
  #toast { position: fixed; top: max(64px, calc(env(safe-area-inset-top) + 54px)); left: 50%; display: flex; align-items: center; gap: 10px;
    padding: 6px 16px 6px 6px; border-radius: 18px; background: var(--panel); border: 3px solid var(--gold); font-size: 20px;
    transform: translate(-50%, -160%); opacity: 0; pointer-events: none; white-space: nowrap; }
  #toast.show { animation: toast 3.2s ease both; }
  @keyframes toast { 0% { transform: translate(-50%, -160%); opacity: 0; } 10%, 85% { transform: translate(-50%, 0); opacity: 1; } 100% { transform: translate(-50%, -160%); opacity: 0; } }
  #toast img { width: 56px; height: 56px; }
  #toast small { display: block; font-size: 14px; }
  /* A world's cover as a banner: a strip of it with a title over its darkened lower part */
  /* (the gallery's and collection's world banners are a thin strip, as the user asked, October 2026: they
     were 104 px high, with the text at the bottom over a dark fade) */
  .banner { position: relative; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 60px; margin: 0 0 12px; padding: 4px 14px;
    border-radius: 14px; border: 3px solid var(--gold); background: #000 center 40% / cover no-repeat; overflow: hidden; }
  .banner::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, .72), rgba(0, 0, 0, .2) 70%, rgba(0, 0, 0, .45)); }
  .banner > * { position: relative; margin: 0; color: var(--gold); text-shadow: 0 2px 4px #000; }
  .banner h3, .banner h2 { display: block; margin: 0; font-size: 22px; }
  .banner span { font-size: 20px; }
  .banner.locked { filter: grayscale(1) brightness(.6); }
  #lvlBanner { width: 100%; max-width: 640px; height: 150px; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; padding: 10px 14px; border-radius: 16px; text-align: center; }
  #lvlBanner::before { background: linear-gradient(transparent 30%, rgba(0, 0, 0, .78)); }
  #lvlBanner h2 { font-size: clamp(24px, 7.5vw, 30px); line-height: 1.1; white-space: nowrap; }
  #lvlBanner span { font-size: 18px; color: var(--ink); }
  /* The worlds screen: a page per world with its cover, and the daily challenge as a strip above */
  /* (the worlds' carousel fades out at its sides, so covers slide in and out softly when swiped; each
     page keeps a margin as wide as the fade, so a cover at rest is never under it) */
  #worldShelf { --fade: 22px; -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent);
    mask-image: linear-gradient(to right, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent); }
  .wpage { display: flex; justify-content: center; padding: 0 22px 8px; }
  /* (on a computer the covers leave room at the sides, so the fade there is much wider) */
  @media (min-width: 760px) { #worldShelf { --fade: 160px; } }
  .cover { position: relative; height: 100%; max-width: 100%; aspect-ratio: 4 / 5; border-radius: 22px; border: 4px solid var(--gold); overflow: hidden;
    background: #000 center / cover no-repeat; box-shadow: 0 8px 24px rgba(0, 0, 0, .6); }
  .cover.locked { filter: grayscale(1) brightness(.55); border-color: #666; }
  /* (a dark fade at the top, under the world's name and progress, so they read on any art) */
  .cover::before { content: ''; position: absolute; inset: 0 0 auto; height: 34%; background: linear-gradient(rgba(0, 0, 0, .7), transparent); }
  /* (the world's name and progress at the top of the cover, Jugar alone at the bottom, nothing darkening
     the art: the user asked for it, October 2026) */
  .winfo { position: absolute; left: 0; right: 0; top: 0; padding: 14px 14px 0; text-align: center; }
  /* (only the world's name, as the user asked: "Mundo n" was dropped) */
  .winfo h3 { display: block; margin: 0; font-size: clamp(24px, 7.5vw, 32px); line-height: 1.1; white-space: nowrap; color: var(--gold); text-shadow: 0 2px 0 #000, 0 0 6px #000, 0 0 12px #000; }
  .winfo p { margin: 2px 0 0; font-size: clamp(13px, 3.9vw, 17px); text-shadow: 0 1px 0 #000, 0 0 5px #000, 0 0 10px #000; }
  .winfo .lock { font-size: 20px; }
  .wplay { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; }
  .wplay .play { font: inherit; font-size: 24px; color: #3a1f00; background: var(--gold); border: 4px solid #a8740a; border-radius: 16px; padding: 1px 44px;
    cursor: pointer; box-shadow: 0 5px 0 #a8740a; }
  .wplay .play:active { transform: translateY(4px); box-shadow: 0 1px 0 #a8740a; }
  #dailyBar { display: none; flex: none; align-items: center; justify-content: space-between; gap: 10px; width: 100%; max-width: 600px; margin: 6px 0 12px; padding: 8px 14px;
    font: inherit; font-size: 18px; color: var(--ink); background: var(--panel); border: 3px solid #4cc9f0; border-radius: 14px; cursor: pointer; text-align: left; }
  #dailyBar b { color: #4cc9f0; white-space: nowrap; }
  /* A world's boss level stands out */
  .lvl.boss { border-color: var(--pink); background: linear-gradient(90deg, #3a1530, var(--panel)); padding: 16px 14px; }
  .lvl.boss .n { background: var(--gold); }
  .lvl.boss .goal b { width: 100%; font-size: 20px; color: var(--pink); }
  /* A world just opened: its cover over the whole screen */
  #intro { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: #000; padding: 16px; }
  #introCover { position: relative; height: min(100%, 125vw); aspect-ratio: 4 / 5; max-width: 100%; border-radius: 22px; border: 4px solid var(--gold); overflow: hidden;
    background: #000 center / cover no-repeat; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 16px 28px; }
  #introCover::before { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0, 0, 0, .85)); }
  #introCover > * { position: relative; }
  #introCover small { font-size: 22px; color: var(--ink); }
  #introCover h2 { margin: 0 0 14px; font-size: clamp(30px, 9.5vw, 48px); line-height: 1.05; text-align: center; color: var(--gold); text-shadow: 0 3px 0 var(--pink-dark); }
  #intro.go #introCover { animation: introIn .7s cubic-bezier(.2, 1.3, .5, 1) both; }
  #intro.go #introCover > * { animation: fadeIn .5s .5s both; }
  @keyframes introIn { from { transform: scale(.6); opacity: 0; } }
  /* A complete card in the gallery: it glows and asks to be opened */
  .slot.ready { cursor: pointer; border-color: var(--gold); animation: ready 1.2s ease-in-out infinite alternate; }
  @keyframes ready { from { box-shadow: 0 0 0 rgba(255, 210, 63, 0); } to { box-shadow: 0 0 18px rgba(255, 210, 63, .75); } }
  .slot.ready .cap { animation: wiggle 1.2s ease-in-out infinite; }
  @keyframes wiggle { 0%, 70%, 100% { transform: rotate(-18deg); } 78% { transform: rotate(-30deg); } 86% { transform: rotate(-6deg); } 94% { transform: rotate(-22deg); } }
  .slot .open { margin: 2px 0; padding: 3px 10px; border-radius: 12px; background: var(--gold); color: #3a1f00; font-size: 16px; white-space: nowrap; }
  /* Opening a card: its capsule shakes, splits in two halves flying apart, and the character pops out
     of a glow in its rarity's colour */
  #reveal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .85); padding: 16px; }
  #revealStage { position: relative; width: 200px; height: 200px; margin: 0 auto 6px; }
  #revealStage > * { position: absolute; inset: 0; margin: auto; }
  #revealStage img { width: 190px; height: 190px; transform: scale(0); }
  #revealStage .glow { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, var(--g) 0, transparent 68%); opacity: 0; }
  #revealStage .half { width: 150px; height: 150px; }
  #revealStage .half .cap { display: block; width: 150px; height: 150px; transform: none; }
  #revealStage .half.top { clip-path: inset(0 0 50% 0); }
  #revealStage .half.bot { clip-path: inset(50% 0 0 0); }
  #reveal.go .half { animation: shake .7s ease-in-out both; }
  #reveal.go .half.top { animation: shake .7s ease-in-out, flyTop .55s .7s ease-in both; }
  #reveal.go .half.bot { animation: shake .7s ease-in-out, flyBot .55s .7s ease-in both; }
  #reveal.go img { animation: pop .5s .75s cubic-bezier(.3, 1.6, .5, 1) both; }
  #reveal.go .glow { animation: glow .8s .7s ease-out both; }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-9deg); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(5deg); } }
  @keyframes flyTop { to { transform: translate(-40px, -150px) rotate(-40deg); opacity: 0; } }
  @keyframes flyBot { to { transform: translate(40px, 150px) rotate(30deg); opacity: 0; } }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes glow { 0% { opacity: 0; transform: scale(.4); } 40% { opacity: 1; } 100% { opacity: .8; transform: scale(1.15); } }
  #revealText { font-size: 30px; line-height: 1.2; }
  #reveal.go #revealText, #reveal.go #revealOk { animation: fadeIn .4s 1s both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
  #revealText small { display: block; font-size: 18px; }
  /* The cards completed in a level, on its card */
  .card .won { display: block; margin-top: 10px; }
  .card .won button { display: block; margin: 8px auto 0; font-size: 20px; }
  /* Levels by world */
  #lvlList h3.world { margin: 10px 4px 0; font-size: 22px; color: var(--gold); }
  /* The rarity finishes on the CSS capsules: metallic (a hard shine) and rainbow */
  .cap.metal { background: radial-gradient(circle at 32% 26%, #fff 0 7%, rgba(255, 255, 255, .5) 12%, transparent 26%),
      linear-gradient(160deg, color-mix(in srgb, var(--c) 60%, #fff), var(--c) 40%, color-mix(in srgb, var(--c) 45%, #000) 75%, color-mix(in srgb, var(--c) 80%, #fff)); }
  .cap.rainbow { background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .8) 0 6%, transparent 20%),
      linear-gradient(#ff5d8f 0 17%, #ff9f43 0 33%, #ffd23f 0 50%, #80ed99 0 67%, #4cc9f0 0 83%, #b388ff 0); }
  .shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  /* (on a wide screen the capsules go five to a row and the characters are bigger) */
  @media (min-width: 760px) { .shelf { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  /* The other rarity finishes: white stripes (uncommon), white dots (rare) */
  .cap.stripes { background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .8) 0 6%, transparent 20%),
      repeating-linear-gradient(-50deg, rgba(255, 255, 255, .55) 0 12%, transparent 12% 30%),
      radial-gradient(circle at 50% 38%, var(--c) 0 50%, color-mix(in srgb, var(--c) 55%, #000) 100%); }

<script type="module">
import * as THREE from 'three';

// World units: the glass box is 4 wide (x), 3 deep (z), the floor is y = 0.

const BOX = { x: 2, z: 1.5 };
const HOLE = { x: -1.1, z: 0.6 };
const HOLE_WALL_H = 1.1;
const HOLE_WALLS = [   // the clear walls around the hole, as boxes
  { min: [HOLE.x - .03, 0, HOLE.z - .03], max: [HOLE.x + .03, HOLE_WALL_H, BOX.z] },
  { min: [-BOX.x, 0, HOLE.z - .03], max: [HOLE.x + .03, HOLE_WALL_H, HOLE.z + .03] },

// Each finger, closed, in its own plane: (out, down) from its hinge. Three straight parts: out and

const FINGER_SHAPE = [[0, 0], [.26, .18], [.25, .58], [.06, .74]];

const FINGER_REACH = PIVOT_DOWN + Math.max(...FINGER_SHAPE.flatMap(([u, d]) => [d, -u * Math.sin(OPEN_ANGLE) + d * Math.cos(OPEN_ANGLE)]));

const G = 14, STEP = 1 / 120;

// Claw dynamics: the carriage accelerates and brakes, the winch ramps up, and the head is a
// mass hanging from an elastic cable, so it swings, bounces and goes slack when it lands
// The head is heavy (HEAD_MASS) and its swing is damped against the carriage, so it sways a little and settles fast
const ACC = 2.2, WINCH_ACC = 8;
const HEAD_MASS = 2.5, ROPE_K = 2200, ROPE_C = 60, SWING_DRAG = 2.5;

const TIERS = [
  { name: 'Común', design: 'plain', w: .45, css: '#c9cfdb' },
  { name: 'Infrecuente', design: 'stripes', w: .28, css: '#80ed99' },

  { name: 'Legendaria', design: 'metal', w: .07, css: '#ffd23f' },

  { id: 'animales', name: 'Animalitos', skin: 'animales', balls: [['Marrón', '#9b5d34'], ['Crema', '#f1dcb0'], ['Naranja', '#ff9640'], ['Gris', '#a3aab5'], ['Rosa', '#ff9fbd'], ['Celeste', '#6fc2f0'], ['Verde', '#7fd66b'], ['Dorada', '#ffd23f']],

  { id: 'halloween', name: 'Dulce Halloween', skin: 'halloween', balls: [['Calabaza', '#ff8a1f'], ['Hueso', '#eee3c8'], ['Violeta', '#8f52e0'], ['Moco', '#93dc3c'], ['Fantasma', '#cfe3ff'], ['Sangre', '#d9283a'], ['Dorada', '#ffd23f'], ['Plateada', '#c8d0de']],

// ---------- Cable ----------
// The cable is a rope: a chain of point masses (Verlet) with gravity and inertia, pinned to the
// carriage at the top and the claw head at the bottom, whose links can't stretch past claw.len split
// evenly but can go slack. So it bows and ripples as the claw swings, starts and brakes, and sags when
// the claw rests on something. It is only drawn: the claw itself hangs from the elastic cable model in
// swingHead(), which this rope follows, since both use claw.len.
const cable = Array.from({ length: CABLE_NODES + 1 }, () => ({ x: 0, y: 0, z: 0, px: 0, py: 0, pz: 0 }));

// From the carriage to the hook on top of the claw's body
function cableEnds() { return [[claw.x, CARRIAGE_Y, claw.z], clawPoint(clawFrame(), 0, 0, HOOK_UP)]; }

function resetCable() {

function cableStep(dt) {

  pin(cable[0], a); pin(cable[n], b);

  // A tiny sideways nudge picks the side, and links that keep their length (like the strands of a
  // wire cable) make the extra length curve instead of collapsing. The pinned ends never move.

// Move overlapping bodies apart directly (no velocity change), sharing the push by inverse mass

// The finger segments one step ago, relative to the head, for their own motion (closing, tilting)

  for (const p of prizes) if (!p.held) p.vy -= G * dt;

  const segs = segments(), h = claw.head;
  const segsRel = segs.map(s => s.map(q => [q[0] - h.x, q[1] - h.y, q[2] - h.z]));
  const segVel = lastSegs ? segsRel.map((s, i) => s.map((q, j) => q.map((v, k) => (v - lastSegs[i][j][k]) / dt))) : null;

  const cs = findContacts(segs, segVel, MARGIN, !settling);
  solveContacts(cs, dt);

  claw.touching = cs.some(c => c.b === claw.head && c.jn > 0);

  const touching = new Set(cs.filter(c => c.jn > 0).map(c => c.a));
  if (claw.held) {
    const onHeld = new Set(cs.filter(c => c.jn > 0 && c.b === claw.held).map(c => c.a));

      const p = c.a;

  // under 2): a loose capsule wedged in the closed fingers was shot out by the jolt at the top
  for (const c of cs) {
    const p = c.a;
    if (c.jn <= 0 || c.b !== h) continue;

    if (s > CLAW_PUSH_MAX) { const k = CLAW_PUSH_MAX / s; p.vx = h.vx + v[0] * k; p.vy = h.vy + v[1] * k; p.vz = h.vz + v[2] * k; }
  }
  for (const p of prizes) {
    if (p.held) continue;
    // A safety net: nothing in the machine moves faster than MAX_SPEED (a capsule dropped from the top
    // reaches about 8). The bosses' giant capsule, too big to be held, can ride up wedged in the closed
    // fingers, and the jolt at the top shot it out at up to 27.
    const s = Math.hypot(p.vx, p.vy, p.vz);
    if (s > MAX_SPEED) { const k = MAX_SPEED / s; p.vx *= k; p.vy *= k; p.vz *= k; }

  }
}

// ---------- Game flow ----------

// A round is judged when the next one starts (or, out of coins, before the level is lost), so a prize
// still dropping into the hole when the claw is back counts for it. A round that won a prize the goal
// wanted adds to the streak; STREAK_N in a row win a coin. One that didn't (or dropped a bomb in) ends it.
function endRound() {
  if (!roundOpen) return;
  roundOpen = false;
  streak = roundGood ? streak + 1 : 0;
  if (streak >= STREAK_N) { streak = 0; coins++; flashCoins('#80ed99'); sfx('coin'); }
}
const flashCoins = color => { coinFlash = 1.2; board.flashColor = color; };

function startRound() {
  if (state !== 'idle' || coins <= 0 || endT !== null) return;   // (not while a cleared or lost level's card is coming)
  endRound();
  roundOpen = true; roundGood = false;
  if (!FREE_PLAY) coins--;
  state = 'aim'; aimT = AIM_TIME; sfx('coin'); hud();
}

function startDrop() {
  if (state !== 'aim') return;
  state = 'drop'; claw.winch = 0; claw.t = 0; claw.landed = false; claw.target = null; claw.slipping = null; claw.lose = null; claw.letGo = 0; claw.reshut = false; claw.tripFrom = undefined; claw.dropping = null; keys.l = keys.r = keys.u = keys.d = false; sfx('drop');
}

// When the claw starts closing, pickTarget() notes the prize right under it whose top half the closed
// tips could reach. It stays loose while the fingers close around it; grabTarget() decides at the end.
function pickTarget() {
  const h = claw.head, tipY = clawPoint(clawFrame(), 0, 0, -CLOSED_TIP_DOWN)[1];
  let pick = null, bd = 1e9;
  for (const p of prizes) {
    const dx = Math.hypot(p.x - h.x, p.z - h.z);
    if (dx < p.r * .8 && p.y < h.y && tipY < p.y + p.r * .5 && dx < bd) { bd = dx; pick = p; }
  }
  claw.target = pick;
}

// How a prize of radius r, centred on the claw's axis at height oy (claw frame), sits in the claw with
// all fingers at one angle: { angle, oy } for where it rests, or null if it isn't held.
// - The closed fingers would press into it: they rest on it, a little open (the angle), which holds it
//   only if the tips end up under its middle.
// - It fits loose inside the closed claw (the curved fingers make a cage): it settles down onto the
//   inward-curling tips (the oy it drops to), unless it would drop right through between them.
function cradle(r, oy) {
  const fr = clawFrame();
  const at = th => fingers(FINGER_ANGLES.map(() => th - claw.open * OPEN_ANGLE));
  const ball = up => { const c = clawPoint(fr, 0, 0, up); return { x: c[0], y: c[1], z: c[2], r }; };
  const pen = (th, up) => Math.max(...at(th).map(fg => fingerPenOn(fg, ball(up))));
  const tipsUnder = (th, up) => Math.max(...at(th).map(fg => fg.t[1])) < ball(up).y - r * .1;
  if (pen(0, oy) > 0) {
    let lo = 0, hi = FLEX_MAX_ANGLE;
    if (pen(hi, oy) > 0) return null;
    for (let i = 0; i < 20; i++) { const m = (lo + hi) / 2; if (pen(m, oy) > 0) lo = m; else hi = m; }
    return tipsUnder(hi, oy) ? { angle: hi, oy } : null;
  }
  // Lower it bit by bit until it first touches a finger (heights: lower is more negative). Too far
  // down it would be past the tips and touch nothing, so a single deep probe can't tell.
  for (let up = oy - .01; up > oy - .6; up -= .01) {
    if (pen(0, up) > 0) return tipsUnder(0, up + .01) ? { angle: 0, oy: up + .01 } : null;
  }
  return null;   // it would drop right through
}

// When closing is done: the prize is caught only if it really is held (see cradle). If the fingers
// rest on it, all but one must touch it; if it sits loose in the closed cage, all fingers but one must
// have closed round it. One left splayed on a neighbour closes in once the claw lifts off the pile (the
// others' tips hold the prize meanwhile); two would leave too wide a gap. A prize only pinched at
// the top isn't caught: the claw rises without it. Once caught it rides in the claw (claw.hold, see
// carry): it stays where it lay until the rising fingers lift it, never moving up in the claw (no magnet).

// The prize stops riding in the claw and is a loose body again (a slip, or letting go over the hole)

  p.held = false; claw.held = null;
  p.vx = h.vx; p.vy = h.vy; p.vz = h.vz;

// Carriage motor: approach the target velocity with limited acceleration, so it ramps up and brakes
function driveCarriage(tx, tz, dt) {

  c.x += c.vx * dt; c.z += c.vz * dt;
  if (Math.abs(c.x) > LIMIT.x) { c.x = Math.sign(c.x) * LIMIT.x; c.vx = 0; }
  if (Math.abs(c.z) > LIMIT.z) { c.z = Math.sign(c.z) * LIMIT.z; c.vz = 0; }

// The head is a point mass on an elastic cable that can only pull (it goes slack when the head lands).
// Gravity plus the cable make it a pendulum under the carriage. Returns the carriage-to-head distance.
function swingHead(dt) {
  const c = claw, h = c.head, mass = HEAD_MASS + (c.held ? c.held.r ** 3 / .03 : 0);
  const dx = h.x - c.x, dy = h.y - CARRIAGE_Y, dz = h.z - c.z, dist = Math.hypot(dx, dy, dz);

  // imOf). Left free during the reel-in, it sank into the pile by up to 0.3 before the cable pulled.

  // It comes from friction up at the carriage, which brakes a short pendulum hard and a long one

// The grip sometimes gives way. Whether a catch will be lost, and how, is settled when it is caught
// (claw.lose, see grabTarget: for now a fixed pattern, LOSE_PATTERN), and the claw never opens while
// it rises. The user asked for these two kinds (October 2026); before, a slip could start at any
// moment, mid-rise included, which looked odd. Either way the claw keeps going to the hole as usual,
// and the prize just falls, with the claw's speed, wherever that leaves it.
// - 'top': the winch pulls the claw's box up into the carriage (see the lift and hitTop). The blow
//   knocks the fingers open and the prize is loose from that moment, so nothing places it: it keeps
//   going up with the speed it had, knocks against the box as the claw bounces back down, and falls
//   out between the opening fingers. After TOP_SHUT_IN the motor shuts them again on the way
//   (restClose). The user found the earlier version, which opened the claw at its highest point on
//   its cable without any real blow, didn't feel like the hit shook the prize loose (October 2026).
// - 'early': on the way back, once the claw has covered LOSE_EARLY_AT of the trip, it opens, a bit
//   faster than letting go over the hole (LOSE_EARLY_RATE), and stays open; it shuts over the hole.

  if (c.reshut) {

// cuts it and lets the cable back out to its normal length, so the claw bounces down on it. The blow

// fingers and got flung by them.
function loosen(dt, rate) {

// A prize in the hole scores on the board, with a jingle. There is no floating "+1" / "+5 ¡Dorada!"
// text any more: the user asked to drop it (October 2026).
// The specials do their thing instead: a bomb takes a coin (and ends the streak), the skull loses the
// level, a +2 capsule gives two coins.
function win(p) {
  if (state === 'over' || (endT !== null && !endWon)) return;
  if (p.kind === 'bomb') { coins = Math.max(0, coins - 1); roundGood = false; streak = 0; flashCoins('#ff5d8f'); sfx('boom'); hud(); return; }
  if (p.kind === 'skull') { if (endT === null) { endT = CLEAR_DELAY; endWon = false; lostTo = 'skull'; } sfx('boom'); return; }

}

function update(dt) {
  const c = claw;
  if (endT !== null && state !== 'over' && (endT -= dt) <= 0) levelCard(endWon);
  if (coinFlash > 0 && (coinFlash -= dt) <= 0) hud();
  // Where the carriage wants to go; it only moves while aiming and on the way back
  let tx = 0, tz = 0;
  if (state === 'aim') {
    tx = ((keys.r ? 1 : 0) - (keys.l ? 1 : 0)) * MOVE;
    tz = ((keys.d ? 1 : 0) - (keys.u ? 1 : 0)) * MOVE;
    if (stick.mag > 0) { tx = stick.x * stick.mag * MOVE; tz = stick.y * stick.mag * MOVE; }   // the pad
  } else if (state === 'return') {
    // Brake in time to stop over the hole
    const dx = HOME.x - c.x, dz = HOME.z - c.z, d = Math.hypot(dx, dz);
    const s = Math.min(MOVE, Math.sqrt(2 * ACC * .8 * d));
    if (d > 1e-4) { tx = dx / d * s; tz = dz / d * s; }
  }
  driveCarriage(tx, tz, dt);

  switch (state) {
    case 'aim':
      aimT -= dt;
      if (aimT <= 0) startDrop();
      break;
    case 'drop':
      // The drop takes a fixed time, as on a real machine: touching a prize on the way doesn't stop
      // it. Whatever the claw lands on, it rests there with its weight and sinks into the pile as it
      // pushes prizes aside (held in place sideways once landed, see swingHead). The winch keeps
      // letting out up to DROP_SLACK of loose cable, which bows out above the claw.
      c.t += dt;
      c.open = Math.min(1, c.open + OPEN_RATE * dt);   // it opens as it starts down (closed at the top)
      c.winch = Math.min(DROP, c.winch + WINCH_ACC * dt);
      c.len = Math.min(L_MAX, c.len + c.winch * dt, c.dist + DROP_SLACK);
      // Landed means the cable is slack because the claw rests on something it touches. Slack alone
      // isn't enough: a swinging claw slackens its elastic cable for a moment at each end of the swing,
      // and taking that for a landing pinned it in mid-air and killed the sway.
      if (!c.landed && c.len - c.dist > .03 && c.touching) { c.landed = [c.head.x, c.head.z]; sfx('clank'); }
      if (c.t >= DROP_TIME + DROP_REST) { state = 'close'; c.winch = 0; c.closeV = 0; pickTarget(); }
      break;
    case 'close': {
      // The motor closes all the way: each finger gives way against whatever it meets, prizes and the
      // hole walls alike (see flexFingers). Then it keeps squeezing for CLOSE_HOLD, so fingers that
      // had given way on the pile while landing get time to work their way back in.
      // It closes hard: the motor speeds up to CLOSE_SPEED, so the fingers sweep in fast and shove
      // what they meet (it used to close at a steady 2.2, which felt soft), and it clacks shut.
      c.closeV = Math.min(CLOSE_SPEED, (c.closeV || 0) + CLOSE_ACC * dt);
      const wasOpen = c.open > 0;
      c.open = Math.max(0, c.open - dt * c.closeV);
      if (wasOpen && c.open === 0) sfx('clack');
      c.closedFor = c.open > 0 ? 0 : (c.closedFor || 0) + dt;
      if (c.closedFor >= CLOSE_HOLD) {
        c.closedFor = 0;
        grabTarget();
        if (c.held) sfx('grab');
        state = 'lift'; c.t = 0;   // the winch first reels in the slack, so the cable straightens before it pulls
      }
      break;
    }
    case 'lift': {
      // A catch to be lost at the top: the winch overruns its stop and slams the claw's box into the
      // carriage, which ends the lift (see hitTop)
      const slam = c.held && c.lose === 'top';
      c.winch = Math.min(LIFT, c.winch + WINCH_ACC * dt);
      c.len = Math.max(slam ? 0 : L_MIN, c.len - c.winch * dt); c.t += dt;
      if (!slam && c.len <= L_MIN) { state = 'return'; c.winch = 0; sfx('clank'); }
      break;
    }
    case 'return':
      slip(dt);
      if (Math.hypot(HOME.x - c.x, HOME.z - c.z) < .01 && Math.hypot(c.vx, c.vz) < .05) {
        c.x = HOME.x; c.z = HOME.z; c.vx = c.vz = 0; state = 'settle'; c.t = 0;
      }
      break;

      // Wait over the hole for the swing to die down (up to a second) before letting go; with nothing
      // in the claw there is nothing to drop straight, so it opens right away
      c.t += dt; slip(dt);

        // (already open when a lost catch made it let go on the way: then there is nothing to open)
        if (c.open >= 1) { state = 'wait'; c.t = 0; c.shutIn = OPEN_HOLD; c.closeV = 0; }
        else { state = 'release'; c.openV = 0; sfx('motor'); }

      c.openV = Math.min(RELEASE_SPEED, c.openV + RELEASE_ACC * dt);
      loosen(dt, c.openV);
      if (c.open >= 1) { state = 'wait'; c.t = 0; c.shutIn = OPEN_HOLD; c.closeV = 0; sfx('clunk'); c.head.vy += JOLT; }
      break;
    case 'wait':
      c.t += dt;
      if (c.t > WAIT_TIME && endT === null) {
        // Out of coins, the last round is judged once its prize is in: a streak may still win a coin
        const quiet = c.t > LOSE_WAIT || prizes.every(p => Math.hypot(p.vx, p.vy, p.vz) < .3 && !(p.x < HOLE.x && p.z > HOLE.z));
        if (coins <= 0 && !FREE_PLAY && quiet) endRound();
        if (coins > 0 || FREE_PLAY) {
          state = 'idle';
          // Restock from the top when the pile runs low or is out of a kind the level still needs
          const miss = needed().length;
          if (prizes.length < RESTOCK_BELOW || miss) spawn(Math.max(PRIZE_COUNT - prizes.length, miss), 5);
          hud();
        // Out of coins: the level is lost, once nothing is still on its way into the hole (or after
        // LOSE_WAIT at most), so a last prize dropping in still counts
        } else if (quiet) levelCard(false);
      }
      break;
  }
  // Empty and done, it shuts again, so it is closed at the top for the next round
  if (state === 'wait' || state === 'idle' || state === 'aim') restClose(dt);
  c.dist = swingHead(dt);
  cableStep(dt);
  if (c.held) carry(dt); else flexFingers(dt);
}

// After letting go the claw stays open for OPEN_HOLD, then the motor shuts it the way it grabs: it
// speeds up to CLOSE_SPEED and stops with a clack and a jolt. The next round can start meanwhile; a
// drop opens it again.
function restClose(dt) {
  const c = claw;
  if (c.open <= 0 || (c.shutIn = (c.shutIn || 0) - dt) > 0) return;
  if (!c.closeV) sfx('motor');

  c.open = Math.max(0, c.open - c.closeV * dt);
  if (c.open === 0) { c.closeV = 0; sfx('clack'); c.head.vy += JOLT * .6; }

// The card over the machine (#over): a title, some text and a main button, plus "Niveles" unless it is
// a level's opening tip
let cardMain = null;
function card({ title, html, main, onMain, levels = false }) {

  $('ovLevels').hidden = !levels; cardMain = onMain; $('over').hidden = false;
}
const closeCard = () => { $('over').hidden = true; };

// A level is over: cleared (with its stars for the coins left, and on to the next), or lost, for lack

// saved here. The daily challenge keeps its own record (see dailyDone).
function levelCard(cleared) {
  state = 'over'; endT = null; stickEnd();

  if (cleared) {
    const st = starsFor(coins), last = level === LEVELS.length - 1;
    let html = starsHtml(st) + '<br>' + (coins ? `Te sobraron ${coins} ficha${coins === 1 ? '' : 's'}` : '¡Justo con la última ficha!');
    if (st < 3) html += `<br><small>3 ★ con ${lv.stars[1]} fichas de sobra</small>`;
    if (level < 0) html += `<br>Racha: ${dailyDone(st)} día${daily.streak === 1 ? '' : 's'} seguidos`;
    else {

      main: newWorld ? '¡Nuevo mundo!' : next ? 'Siguiente nivel' : 'Jugar de nuevo', onMain: newWorld ? () => showIntro((level + 1) / 5) : next ? () => startLevel(level + 1) : retry, levels: true });
  } else {

  const next = { coins: FREE_PLAY ? '∞' : coins, goal: level + ':' + lv.goal.map(goalLeft).join(), time: state === 'aim' ? String(Math.ceil(aimT)) : '–', low: state === 'aim' && aimT < 5, hint,
    flash: coinFlash > 0 && board.flashColor };

let ac = null;
function sfx(name) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    const tone = (f, f2, d, type, v, at = 0) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + at);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + at + d);
      g.gain.setValueAtTime(v, t + at); g.gain.exponentialRampToValueAtTime(0.001, t + at + d);
      o.connect(g).connect(ac.destination); o.start(t + at); o.stop(t + at + d + .02);
    };
    switch (name) {
      case 'coin': tone(988, 0, .08, 'square', .05); tone(1319, 0, .25, 'square', .05, .08); break;
      case 'drop': tone(600, 200, .6, 'triangle', .08); break;
      case 'clank': tone(180, 90, .12, 'square', .07); break;
      case 'clack': tone(320, 140, .07, 'square', .08); tone(90, 60, .1, 'triangle', .1); break;
      case 'clunk': tone(200, 90, .09, 'square', .08); tone(70, 45, .14, 'triangle', .12); break;
      case 'motor': tone(110, 170, .3, 'sawtooth', .025); break;
      case 'grab': tone(400, 800, .12, 'triangle', .08); break;
      case 'slip': tone(220, 80, .3, 'sawtooth', .05); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, .18, 'square', .05, i * .09)); break;
      case 'prize': [784, 988, 1175, 1568].forEach((f, i) => tone(f, f * 1.01, .22, 'triangle', .07, i * .07)); tone(1568, 2093, .4, 'sine', .05, .3); break;
      case 'boom': tone(160, 40, .45, 'sawtooth', .09); tone(60, 30, .5, 'triangle', .14); break;
    }
  } catch (e) {}
}

const KEY_DIR = { ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r', ArrowUp: 'u', w: 'u', ArrowDown: 'd', s: 'd' };
addEventListener('keydown', e => {

// The pad, a joystick like the maze game's (it replaced a four-button d-pad, October 2026). Its base
// jumps to where the finger lands inside the pad and the knob follows the finger, up to STICK_R away:
// the direction steers the claw (up = away from you) and how far it is pushed sets the speed, with a
// small dead zone (STICK_DEAD). Touching it while idle starts the round, like the arrow keys.
const STICK_R = 52, STICK_DEAD = .18;

const $pad = $('pad'), $stick = $('stick'), $knob = $('knob');
function stickMove(cx, cy) {

  if (d > STICK_R) { dx *= STICK_R / d; dy *= STICK_R / d; }
  $knob.style.transform = `translate(${dx}px, ${dy}px)`;
  const m = Math.min(1, d / STICK_R);

  stick.x = d > 0 ? dx / Math.max(d, STICK_R) : 0; stick.y = d > 0 ? dy / Math.max(d, STICK_R) : 0;

  for (let i = 0; i < 30; i++) {
    const m = (lo + hi) / 2, e = extent(m);
    if (e.bottom - e.top > freeH || e.width > w - 16) lo = m; else hi = m;
  }
  const e = extent(hi);
  camera.setViewOffset(w, h, 0, (e.top + e.bottom) / 2 - (topPad + freeH / 2), w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', fit);

let last = performance.now(), acc = 0, paused = false;   // paused: while the settings are open, or for inspecting with game.step
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000);
  last = now; acc = paused ? 0 : acc + dt;
  while (acc >= STEP) { update(STEP); physics(STEP, false); acc -= STEP; }
  if (!screenOpen()) draw(now);
  requestAnimationFrame(frame);
}

function draw(now) {
  for (const p of prizes) p.mesh.position.set(p.x, p.y, p.z);
  syncClaw();
  const tick = Math.floor(now / 160);
  for (const [b, i] of bulbs) b.material = (i + tick) % 3 === 0 ? BULB_ON : BULB_OFF;
  if (skin?.chase && Math.floor(tick / 2) !== skinTick) { skinTick = Math.floor(tick / 2); marqueeTex.repaint(); }
  hudTime();
  renderer.render(scene, camera);
}

// Handle for poking at the game from the console
window.game = { get state() { return state; }, get paused() { return paused; }, set paused(v) { paused = v; }, get claw() { return claw; }, get prizes() { return prizes; }, get score() { return score; }, get level() { return level; }, get got() { return got; }, get meta() { return meta; }, startLevel, startDaily, showIntro, startRound, startDrop, segments, cable,
  // Run n simulation steps right now, without waiting for frames (fast, repeatable tests)
  step(n = 1) { for (let i = 0; i < n; i++) { update(STEP); physics(STEP, false); } },
  // Draw the current state right now (the browser pane may not be asking for frames)
  draw() { draw(performance.now()); },
  // Look at a point from close up (to inspect the claw); fit() puts the normal view back
  closeUp(x, y, z, dist = 1.6) {
    camera.clearViewOffset(); camera.position.set(x + dist * .35, y + dist * .45, z + dist);
    camera.lookAt(x, y, z); camera.updateProjectionMatrix(); draw(performance.now());
  },
  fit };

startLevel(level);
fit();
requestAnimationFrame(frame);
</script>
</body>
