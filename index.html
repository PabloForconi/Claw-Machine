<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claw Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1b1430; --ink: #fff6e0; --pink: #e8457a; --pink-dark: #8a1f48; --gold: #ffd23f; --panel: #2b1850; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--ink); font-family: Kalam, "Comic Sans MS", cursive; font-weight: 700;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px;
    background: var(--panel); border: 4px solid var(--pink-dark); border-radius: 18px; padding: 4px 14px;
  }
  #hud div { text-align: center; min-width: 74px; }
  #hud small { display: block; font-size: 13px; color: #b9a8e0; line-height: 1.2; }
  #hud span { font-size: 26px; line-height: 1.1; }
  #hud span.low { color: #ff5d8f; }
  #hint {
    position: fixed; top: 74px; left: 0; right: 0; text-align: center; font-size: 20px; line-height: 1.2; padding: 0 16px;
    text-shadow: 0 2px 0 var(--bg), 0 0 8px var(--bg); animation: pulse 1.4s ease-in-out infinite; pointer-events: none;
  }
  @keyframes pulse { 50% { opacity: .45; } }
  #controls {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; align-items: center; gap: 28px; pointer-events: none;
  }
  body.wide #controls { justify-content: space-between; padding: 0 max(24px, 5vw); }
  #pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 2px; }
  #pad button[data-dir="u"] { grid-area: 1 / 2; }
  #pad button[data-dir="l"] { grid-area: 2 / 1; }
  #pad button[data-dir="r"] { grid-area: 2 / 3; }
  #pad button[data-dir="d"] { grid-area: 3 / 2; }
  #controls button {
    pointer-events: auto; font: inherit; color: var(--ink); background: var(--pink); border: 4px solid var(--pink-dark);
    border-radius: 16px; font-size: 22px; cursor: pointer; box-shadow: 0 5px 0 var(--pink-dark); padding: 0;
  }
  #controls button:active, #controls button.on { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-dark); }
  #controls #bd {
    width: 120px; height: 120px; border-radius: 50%; font-size: 26px;
    background: var(--gold); color: #3a1f00; border-color: #a8740a; box-shadow: 0 6px 0 #a8740a;
  }
  .pop {
    position: fixed; transform: translate(-50%, -50%); font-size: 30px; pointer-events: none; white-space: nowrap;
    text-shadow: 0 3px 0 var(--bg), 0 0 6px var(--bg); animation: rise 1.2s ease-out forwards;
  }
  @keyframes rise { to { transform: translate(-50%, -150%); opacity: 0; } }
  #over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 5, 25, .65); padding: 16px; }
  .card { background: var(--panel); border: 5px solid var(--gold); border-radius: 22px; padding: 22px 30px; text-align: center; max-width: 360px; width: 100%; }
  .card h2 { margin: 0 0 8px; font-size: 34px; color: var(--gold); }
  .card p { margin: 0 0 18px; font-size: 22px; line-height: 1.4; }
  .card button { font: inherit; font-size: 24px; color: #3a1f00; background: var(--gold); border: 4px solid #a8740a; border-radius: 16px; padding: 8px 24px; cursor: pointer; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <div><small>FICHAS</small><span id="hCoins">10</span></div>
  <div><small>PUNTOS</small><span id="hScore">0</span></div>
  <div><small>TIEMPO</small><span id="hTime">–</span></div>
</div>
<div id="hint">Tocá las flechas o ¡BAJAR! para jugar (1 ficha)</div>
<div id="controls">
  <div id="pad">
    <button data-dir="u" aria-label="Atrás">▲</button>
    <button data-dir="l" aria-label="Izquierda">◀</button>
    <button data-dir="r" aria-label="Derecha">▶</button>
    <button data-dir="d" aria-label="Adelante">▼</button>
  </div>
  <button id="bd">¡BAJAR!</button>
</div>
<div id="over" hidden>
  <div class="card">
    <h2>¡Sin fichas!</h2>
    <p id="ovStats"></p>
    <button id="again">Jugar de nuevo</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// World units: the glass box is 4 wide (x), 3 deep (z), the floor is y = 0.
// The prize hole is the front-left corner: x < HOLE.x and z > HOLE.z.
const BOX = { x: 2, z: 1.5 };
const HOLE = { x: -1.1, z: 0.6 };
const HOLE_WALL_H = 1.1;
const WALLS = [   // the clear walls around the hole, as boxes
  { min: [HOLE.x - .03, 0, HOLE.z - .03], max: [HOLE.x + .03, HOLE_WALL_H, BOX.z] },
  { min: [-BOX.x, 0, HOLE.z - .03], max: [HOLE.x + .03, HOLE_WALL_H, HOLE.z + .03] },
];
const HOME = { x: (-BOX.x + HOLE.x) / 2, z: (HOLE.z + BOX.z) / 2 };
const LIMIT = { x: 1.7, z: 1.2 };
const CARRIAGE_Y = 4.3, HEAD0 = 4.0;
const G = 14, STEP = 1 / 120;
const MOVE = 1.6, DROP = 2.2, LIFT = 1.8;
// Claw dynamics: the carriage accelerates and brakes, the winch ramps up, and the head is a
// mass hanging from an elastic cable, so it swings, bounces and goes slack when it lands
// The head is heavy (HEAD_MASS) and its swing is damped against the carriage, so it sways a little and settles fast
const ACC = 2.2, WINCH_ACC = 8;
const HEAD_MASS = 2.5, ROPE_K = 2200, ROPE_C = 60, SWING_DRAG = 2.5;
const HEAD_MIN_Y = .72;                                   // the finger tips touch the floor here
const L_MIN = CARRIAGE_Y - HEAD0, L_MAX = CARRIAGE_Y - HEAD_MIN_Y + .2;
const DROP_REST = .3;   // after paying out all the cable, the claw sits this long before closing
// Finger give: how fast a pressed finger swings up (radians per unit of overlap, per step), how far
// it can, how fast it springs back (radians per second), and the widest a finger can ever swing
const FLEX_GAIN = 6, FLEX_MAX = .8, FLEX_RETURN = 1.5, FLEX_MAX_ANGLE = 1.4;
const AIM_TIME = 15, START_COINS = 10, PRIZE_COUNT = 26;
const COLORS = [0xff5d8f, 0x4cc9f0, 0x80ed99, 0xb388ff, 0xff9f43];
const FINGER_ANGLES = [-Math.PI / 2, -Math.PI / 2 + 2.094, -Math.PI / 2 + 4.189];
const BEST_KEY = 'clawMachine.best';

let prizes = [], claw, coins, score, won, state, aimT, best = 0;
const keys = { l: false, r: false, u: false, d: false };

try { best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);

// ---------- Renderer, camera, lights ----------

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1430);
scene.fog = new THREE.Fog(0x1b1430, 14, 30);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
const CAM_TARGET = new THREE.Vector3(0, 1.6, 0), CAM_DIR = new THREE.Vector3(0, .5, .87).normalize();

scene.add(new THREE.HemisphereLight(0xd8ccff, 0x2a1840, 1.4));
const front = new THREE.DirectionalLight(0xfff0e0, 1.2);
front.position.set(2, 6, 8);
scene.add(front);
// Straight-down light: the claw's shadow lands right under it, which is how you aim in depth
const top = new THREE.DirectionalLight(0xffffff, 1.6);
top.position.set(0, 10, 0.001);
top.castShadow = true;
top.shadow.mapSize.set(2048, 2048);
Object.assign(top.shadow.camera, { left: -2.6, right: 2.6, top: 2.2, bottom: -2.2, near: 1, far: 14 });
top.shadow.bias = -0.0005;
scene.add(top);
const glow = new THREE.PointLight(0xffc0e0, 6, 8, 1.5);
glow.position.set(0, 3.8, 0.6);
scene.add(glow);

// ---------- Machine ----------

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .55, ...extra });
const PINK = mat(0xe8457a, { roughness: .4 }), PINK_DARK = mat(0x8a1f48), METAL = mat(0xd5dbe8, { metalness: .8, roughness: .3 });
const GOLD = mat(0xf4c430, { metalness: .7, roughness: .3 });

function box(w, h, d, material, x, y, z, rounded = false) {
  const m = new THREE.Mesh(rounded ? new RoundedBoxGeometry(w, h, d, 3, Math.min(w, h, d) * .2) : new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z); scene.add(m); return m;
}

function canvasTex(w, h, paint) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.repaint = () => { paint(c.getContext('2d'), w, h); tex.needsUpdate = true; };
  tex.repaint();
  return tex;
}

const dots = (bg) => {
  const t = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(255,255,255,.12)';
    for (const [x, y] of [[32, 32], [96, 96]]) { g.beginPath(); g.arc(x, y, 9, 0, 7); g.fill(); }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
};

// Floor slab with the hole cut out: two boxes forming an L, plus thick rims all round
const floorTex = dots('#5a43a0'); floorTex.repeat.set(6, 4.5);
const FLOOR = mat(0xffffff, { map: floorTex });
const slabA = box(BOX.x - HOLE.x, .6, BOX.z * 2, FLOOR, (HOLE.x + BOX.x) / 2, -.3, 0);
const slabB = box(HOLE.x + BOX.x, .6, HOLE.z + BOX.z, FLOOR, (HOLE.x - BOX.x) / 2, -.3, (HOLE.z - BOX.z) / 2);
slabA.receiveShadow = slabB.receiveShadow = true;
box(4.7, .62, .35, PINK, 0, -.29, BOX.z + .175);
box(4.7, .62, .35, PINK, 0, -.29, -BOX.z - .175);
box(.35, .62, 3.7, PINK, BOX.x + .175, -.29, 0);
box(.35, .62, 3.7, PINK, -BOX.x - .175, -.29, 0);
const holeIn = box(.88, .6, .88, new THREE.MeshStandardMaterial({ color: 0x120a20, side: THREE.BackSide }), HOME.x, -.3, HOME.z);
holeIn.receiveShadow = true;
box(4.7, 1.1, 3.7, PINK, 0, -1.15, 0, true);

// Prize door on the front
const doorTex = canvasTex(256, 128, (g, w, h) => {
  g.fillStyle = '#1b1430'; g.beginPath(); g.roundRect(4, 4, w - 8, h - 8, 22); g.fill();
  g.strokeStyle = '#ffd23f'; g.lineWidth = 8; g.stroke();
  g.fillStyle = '#ffd23f'; g.font = '700 54px Kalam, cursive'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('PREMIOS', w / 2, h / 2 + 4);
});
const door = new THREE.Mesh(new THREE.PlaneGeometry(1, .5), new THREE.MeshBasicMaterial({ map: doorTex, transparent: true }));
door.position.set(HOME.x, -.95, 1.86); scene.add(door);

// Pillars, roof, back wall, glass
for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(.35, 4.6, .35, PINK, sx * (BOX.x + .175), 2.3, sz * (BOX.z + .175), true);
box(4.7, .3, 3.7, PINK, 0, 4.75, 0, true);
const backTex = dots('#2e2058'); backTex.repeat.set(6, 7);
const back = new THREE.Mesh(new THREE.PlaneGeometry(BOX.x * 2, 4.6), mat(0xffffff, { map: backTex }));
back.position.set(0, 2.3, -BOX.z); back.receiveShadow = true; scene.add(back);
const GLASS = new THREE.MeshStandardMaterial({ color: 0xbfe6ff, transparent: true, opacity: .07, roughness: 0, depthWrite: false });
const glassF = new THREE.Mesh(new THREE.PlaneGeometry(BOX.x * 2, 4.6), GLASS);
glassF.position.set(0, 2.3, BOX.z); scene.add(glassF);
for (const sx of [-1, 1]) {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(BOX.z * 2, 4.6), GLASS);
  g.position.set(sx * BOX.x, 2.3, 0); g.rotation.y = Math.PI / 2; scene.add(g);
}
// Clear walls around the hole, with a yellow top edge
const ACRYLIC = new THREE.MeshStandardMaterial({ color: 0xffd23f, transparent: true, opacity: .28, depthWrite: false });
for (const w of WALLS) {
  const s = w.max.map((v, i) => v - w.min[i]), c = w.max.map((v, i) => (v + w.min[i]) / 2);
  box(s[0], s[1], s[2], ACRYLIC, c[0], c[1], c[2]);
  box(s[0] + .02, .05, s[2] + .02, GOLD, c[0], HOLE_WALL_H, c[2]);
}

// Marquee with chasing bulbs
const marqueeTex = canvasTex(1024, 192, (g, w, h) => {
  g.fillStyle = '#3a1f6b'; g.fillRect(0, 0, w, h);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '700 120px Kalam, cursive';
  g.lineWidth = 16; g.strokeStyle = '#8a1f48'; g.strokeText('CLAW MACHINE', w / 2, h / 2 + 8);
  g.fillStyle = '#ffd23f'; g.fillText('CLAW MACHINE', w / 2, h / 2 + 8);
});
document.fonts.load('700 120px Kalam').then(() => { marqueeTex.repaint(); doorTex.repaint(); }).catch(() => {});
box(4.7, .9, .3, [PINK, PINK, PINK, PINK, new THREE.MeshBasicMaterial({ map: marqueeTex }), PINK], 0, 5.35, BOX.z + .2);
const bulbs = [];
const BULB_ON = new THREE.MeshBasicMaterial({ color: 0xfff3b0 }), BULB_OFF = new THREE.MeshBasicMaterial({ color: 0x8a6a2a });
for (let i = 0; i < 22; i++) for (const y of [4.95, 5.75]) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(.045, 10, 8), BULB_OFF);
  b.position.set(-2.2 + i * 4.4 / 21, y, BOX.z + .37); scene.add(b); bulbs.push([b, i]);
}

// Room floor
const room = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), mat(0x241a40));
room.rotation.x = -Math.PI / 2; room.position.y = -1.7; room.receiveShadow = true; scene.add(room);

// ---------- Claw meshes ----------

const RAIL = mat(0xc9c3d8, { metalness: .6, roughness: .35 });
for (const sx of [-1, 1]) box(.1, .1, BOX.z * 2, RAIL, sx * (BOX.x - .05), CARRIAGE_Y + .05, 0);
const bridge = box(BOX.x * 2, .08, .14, RAIL, 0, CARRIAGE_Y + .05, 0);
const carriage = box(.34, .18, .34, mat(0xefeaf7), 0, CARRIAGE_Y - .04, 0, true);
const cable = new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, 1, 6), mat(0xdddddd));
const head = new THREE.Mesh(new THREE.SphereGeometry(.17, 20, 14), GOLD);
scene.add(cable, head);
const SEG = new THREE.CylinderGeometry(.035, .035, 1, 8), JOINT = new THREE.SphereGeometry(.05, 10, 8);
const fingerMeshes = FINGER_ANGLES.map(() => {
  const m = { a: new THREE.Mesh(SEG, METAL), b: new THREE.Mesh(SEG, METAL), k: new THREE.Mesh(JOINT, METAL), t: new THREE.Mesh(JOINT, METAL) };
  for (const x of Object.values(m)) { x.castShadow = true; scene.add(x); }
  return m;
});
for (const m of [carriage, cable, head, bridge]) m.castShadow = true;

const UP = new THREE.Vector3(0, 1, 0), vA = new THREE.Vector3(), vB = new THREE.Vector3();
function setSeg(mesh, a, b) {
  vA.set(...a); vB.set(...b);
  mesh.position.addVectors(vA, vB).multiplyScalar(.5);
  vB.sub(vA); const L = vB.length();
  mesh.scale.set(1, L, 1); mesh.quaternion.setFromUnitVectors(UP, vB.divideScalar(L));
}

// The claw hangs along the cable: d points down the cable, e1 and e2 span the plane across it
// (for a vertical cable, e1 = +x and e2 = +z)
function clawFrame() {
  const h = claw.head, dx = h.x - claw.x, dy = h.y - CARRIAGE_Y, dz = h.z - claw.z, n = Math.hypot(dx, dy, dz) || 1;
  const d = [dx / n, dy / n, dz / n];
  let e1 = [1 - d[0] * d[0], -d[0] * d[1], -d[0] * d[2]];
  const m = Math.hypot(...e1); e1 = e1.map(v => v / m);
  const e2 = [d[1] * e1[2] - d[2] * e1[1], d[2] * e1[0] - d[0] * e1[2], d[0] * e1[1] - d[1] * e1[0]];
  return { d, e1, e2 };
}

// A point given in the claw's frame: across the cable (u, w) and up from the head (up)
function clawPoint(f, u, w, up) {
  const h = claw.head;
  return [h.x, h.y, h.z].map((v, i) => v + u * f.e1[i] + w * f.e2[i] - up * f.d[i]);
}

// Each finger lives in its own plane through the cable: pivot → knee → tip.
// open (0..1) swings them all outwards around the pivot, and each finger's flex (radians) swings it
// further on its own: a finger pressing on a prize gives way upwards (see flexFingers).
function fingers(flex = claw.flex) {
  const f = clawFrame(), out = [];
  FINGER_ANGLES.forEach((a, i) => {
    const th = Math.min(FLEX_MAX_ANGLE, claw.open * .8 + flex[i]), c = Math.cos(th), s = Math.sin(th);
    const loc = (u, d) => [.12 + u * c + d * s, -.08 - (-u * s + d * c)];
    const ca = Math.cos(a), sa = Math.sin(a);
    const P = ([rr, yy]) => clawPoint(f, rr * ca, rr * sa, yy);
    out.push({ p: P([.12, -.08]), k: P(loc(.26, .32)), t: P(loc(-.1, .72)) });
  });
  return out;
}

// How deep a finger digs into the prizes it isn't holding
function fingerPenOn(fg, p) {
  let m = -1e9;
  for (const [a, b] of [[fg.p, fg.k], [fg.k, fg.t]]) {
    const q = closestOnSeg([p.x, p.y, p.z], a, b);
    m = Math.max(m, p.r + FINGER_R - Math.hypot(p.x - q[0], p.y - q[1], p.z - q[2]));
  }
  return m;
}

// The prize the claw is closing on doesn't count: the fingers grip it instead of giving way
function fingerPen(fg) {
  let m = 0;
  for (const p of prizes) if (p !== claw.target && p !== claw.held) m = Math.max(m, fingerPenOn(fg, p));
  return m;
}

// How deep each finger, opened this much, is into the prize (negative: the gap left)
function fingerPensOn(p, open) {
  const was = claw.open; claw.open = open;
  const pens = fingers().map(fg => fingerPenOn(fg, p));
  claw.open = was;
  return pens;
}

// How many fingers, opened this much, touch the prize (within gap)
const fingersOn = (p, open, gap = .004) => fingerPensOn(p, open).filter(d => d > -gap).length;

// Done closing on the prize: all three fingers on it, or every finger that isn't has given way on
// something else (a neighbour, a wall) and two are on it, or it is jammed and a finger starts to dig in.
// Until then the fingers that touch it keep pushing it towards the others, which centres it.
function gripDone(p, open) {
  const pens = fingerPensOn(p, open), on = pens.map(d => d > -.004);
  if (Math.max(...pens) > .03) return true;
  const n = on.filter(Boolean).length;
  return n === 3 || (n >= 2 && on.every((o, i) => o || claw.flex[i] > .05));
}

// The fingers are hinged with some give: one that presses into a prize the claw isn't holding swings
// up and out until it rests on it instead of digging in, and springs back once it can.
function flexFingers(dt) {
  const fl = claw.flex, now = fingers();
  for (let i = 0; i < fl.length; i++) {
    const pen = fingerPen(now[i]);
    if (pen > .002) { fl[i] = Math.min(FLEX_MAX, fl[i] + pen * FLEX_GAIN); continue; }
    if (fl[i] <= 0) continue;
    // Spring back only as far as the finger stays clear
    const back = fl.slice(); back[i] = Math.max(0, fl[i] - FLEX_RETURN * dt);
    if (fingerPen(fingers(back)[i]) <= .002) fl[i] = back[i];
  }
}

function syncClaw() {
  const h = claw.head;
  bridge.position.z = claw.z;
  carriage.position.set(claw.x, CARRIAGE_Y - .04, claw.z);
  setSeg(cable, [claw.x, CARRIAGE_Y, claw.z], [h.x, h.y, h.z]);
  head.position.set(h.x, h.y, h.z);
  fingers().forEach((f, i) => {
    const m = fingerMeshes[i];
    setSeg(m.a, f.p, f.k); setSeg(m.b, f.k, f.t); m.k.position.set(...f.k); m.t.position.set(...f.t);
  });
}

// ---------- Prizes ----------

const HEMI_TOP = new THREE.SphereGeometry(1, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2);
const HEMI_BOT = new THREE.SphereGeometry(1, 28, 14, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
const BAND = new THREE.TorusGeometry(1, .04, 6, 32);
const TOY = new THREE.SphereGeometry(.42, 16, 12), EYE = new THREE.SphereGeometry(.07, 8, 6), STAR = new THREE.OctahedronGeometry(.45);
const CLEAR = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: .32, roughness: .05, clearcoat: 1, depthWrite: false });
const DARK = mat(0x1b1430), BAND_MAT = mat(0x3a2a55);
const colorMats = new Map();
const colorMat = c => colorMats.get(c) || colorMats.set(c, mat(c, { roughness: .35 })).get(c);
const GOLD_SHELL = mat(0xffd23f, { metalness: .6, roughness: .25 }), STAR_MAT = mat(0xff9f1c, { emissive: 0x552200 });

function mkPrize(x, y, z) {
  const rare = Math.random() < .12, col = COLORS[Math.random() * COLORS.length | 0];
  const r = rare ? .27 : .28 + Math.random() * .08;
  const g = new THREE.Group();
  const bot = new THREE.Mesh(HEMI_BOT, rare ? GOLD_SHELL : colorMat(col));
  const topM = new THREE.Mesh(HEMI_TOP, CLEAR);
  const band = new THREE.Mesh(BAND, BAND_MAT); band.rotation.x = Math.PI / 2;
  bot.castShadow = bot.receiveShadow = true;
  g.add(bot, band);
  if (rare) { const s = new THREE.Mesh(STAR, STAR_MAT); s.position.y = .4; g.add(s); }
  else {
    const toy = new THREE.Mesh(TOY, colorMat(col)); toy.position.y = .38; g.add(toy);
    for (const sx of [-1, 1]) { const e = new THREE.Mesh(EYE, DARK); e.position.set(sx * .15, .48, .36); g.add(e); }
  }
  g.add(topM);
  g.scale.setScalar(r);
  g.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
  scene.add(g);
  const p = { x, y, z, vx: (Math.random() - .5) * .4, vy: 0, vz: (Math.random() - .5) * .4, wx: 0, wy: 0, wz: 0, r, rare, held: false, mesh: g };
  setMass(p, (r / .3) ** 3);   // bigger capsules are heavier
  return p;
}

function spawn(n, y0) {
  for (let i = 0; i < n; i++) {
    let x, z;
    do { x = (Math.random() * 2 - 1) * 1.7; z = (Math.random() * 2 - 1) * 1.2; } while (x < HOLE.x + .5 && z > HOLE.z - .5);
    prizes.push(mkPrize(x, y0 + i * .5, z));
  }
}

function reset() {
  for (const p of prizes) scene.remove(p.mesh);
  prizes = [];
  // x, z, vx, vz: the carriage; len: cable paid out; winch: its current speed; head: the hanging claw
  claw = {
    x: HOME.x, z: HOME.z, vx: 0, vz: 0, len: L_MIN, winch: 0, dist: L_MIN, open: 1, flex: [0, 0, 0], held: null, q: 0, t: 0,
    head: { x: HOME.x, y: CARRIAGE_Y - L_MIN, z: HOME.z, vx: 0, vy: 0, vz: 0, r: .17 },
  };
  setMass(claw.head, HEAD_MASS, false);
  lastSegs = null;
  state = 'idle'; coins = START_COINS; score = 0; won = 0;
  spawn(PRIZE_COUNT, 1);
  for (let i = 0; i < 1200; i++) physics(STEP, true);   // let the pile settle before showing it
  $('over').hidden = true;
  hud();
}

// ---------- Physics: spheres with gravity, walls, the hole walls and the claw fingers as kinematic segments ----------

const FINGER_R = .04;   // collision radius of a finger segment (the mesh is .035)

// The two segments of each finger, pivot → knee and knee → tip
function segments() {
  const out = [];
  for (const f of fingers()) out.push([f.p, f.k], [f.k, f.t]);
  return out;
}

const closestOnSeg = (p, a, b) => lerp3(a, b, segParam(p, a, b));

// The push that gets the whole claw (head, sampled finger segments and a held prize) out of the
// hole's clear walls. The claw is rigid, so every point moves by the same push.
function clawWallPush() {
  const h = claw.head, pts = [[h.x, h.y, h.z, h.r]];
  for (const [a, b] of segments()) for (let i = 0; i <= 6; i++) {
    const t = i / 6;
    pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, FINGER_R]);
  }
  const s = [0, 0, 0];
  for (const w of WALLS) for (const [x0, y0, z0, r] of pts) {
    const p = [x0 + s[0], y0 + s[1], z0 + s[2]];
    const q = p.map((v, i) => clamp(v, w.min[i], w.max[i]));
    const d = Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
    if (d >= r) continue;
    if (d > 0) { for (let i = 0; i < 3; i++) s[i] += (p[i] - q[i]) / d * (r - d); continue; }
    // The point is inside the wall: out through the nearest face
    let best = 1e9, axis = 0, dir = 1;
    for (let i = 0; i < 3; i++) for (const [face, sg] of [[w.min[i], -1], [w.max[i], 1]]) {
      const dist = Math.abs(p[i] - face) + r;
      if (dist < best) { best = dist; axis = i; dir = sg; }
    }
    s[axis] += dir * best;
  }
  return s;
}

// Would the fingers, opened this much, run into a hole wall?
function wallBlocks(open) {
  const was = claw.open; claw.open = open;
  const blocked = Math.hypot(...clawWallPush()) > .005;
  claw.open = was;
  return blocked;
}

// How far the finger tips are from the claw's axis at a given opening; a prize falls out once this passes its radius
function tipRadial(open) {
  const th = open * .8;
  return .12 - .1 * Math.cos(th) + .72 * Math.sin(th);
}

// ---------- Contact solver ----------
// A small rigid-body solver for the spheres, run every STEP:
//   1. gravity;
//   2. find contacts, with a small margin so resting contacts are found every step;
//   3. solve contact impulses SOLVER_ITERS times: normal impulses (with restitution on hard impacts)
//      and Coulomb friction at the contact point, which also spins the spheres, so they roll, stack
//      and stop instead of sliding around;
//   4. move and rotate;
//   5. push apart whatever still overlaps, without adding velocity.
// The other side of a contact is another prize, the claw head (dynamic and heavy), a finger segment or
// the held prize (kinematic: they push with their own velocity), or the floor, glass and hole walls.

const SOLVER_ITERS = 12, POS_ITERS = 4, MARGIN = .01, SLOP = .003;
const MU = { prize: .45, claw: .7, floor: .6, glass: .15, wall: .3 };     // friction
const BOUNCE = { prize: .3, claw: 0, floor: .3, glass: .3, wall: .35 };   // restitution (the claw lands dead)
const BOUNCE_MIN = .6;   // slower impacts don't bounce, so resting contacts stay calm
const ROLL_DAMP = 1.2;   // rolling resistance, per second, while touching something
const ZERO = [0, 0, 0];

// Mass and inverse inertia (solid sphere); bodies that don't spin get iI = 0
function setMass(b, m, spins = true) { b.im = 1 / m; b.iI = spins ? 1 / (.4 * m * b.r * b.r) : 0; }

// The head stays put while the claw closes: it rests where it landed, and a finger that runs into a
// neighbour gives way (flexFingers) instead of lifting the whole claw off the prize it is closing on.
// Otherwise, pushes through the fingers or the held prize (contacts with their own vb) only reach the
// head in part: the motor is strong and the fingers shove prizes aside instead of the claw riding up
// on every one they touch.
const CLAW_FEEDBACK = .3;
const imOf = (b, c) => (b === claw.head && state === 'close') ? 0 : b.im * (c && c.vb ? CLAW_FEEDBACK : 1);

function segParam(p, a, b) {
  const ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  return clamp(((p[0] - a[0]) * ab[0] + (p[1] - a[1]) * ab[1] + (p[2] - a[2]) * ab[2]) / (ab[0] ** 2 + ab[1] ** 2 + ab[2] ** 2), 0, 1);
}
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// n points from the prize a towards the other side; pen > 0 is overlap, pen < 0 a gap.
// b is the other body, or null for static surfaces (then vb is their velocity, zero). The fingers and the
// held prize are part of the claw: their contacts have b = the head, so the reaction pushes the whole claw,
// and vb is their own motion relative to the head (closing, tilting). Their velocity is the head's current
// velocity plus that, so when a contact brakes the claw the fingers brake with it instead of pushing on.
function findContacts(segs, segVel, margin, withClaw) {
  const out = [], h = claw.head;
  for (let i = 0; i < prizes.length; i++) {
    const a = prizes[i];
    const add = (b, nx, ny, nz, pen, kind, vb) => {
      if (pen > -margin) out.push({ a, b, n: [nx, ny, nz], pen, kind, vb, jn: 0, jt: [0, 0, 0] });
    };
    const toPoint = (q, qr, kind, vb, b = null) => {
      const dx = q[0] - a.x, dy = q[1] - a.y, dz = q[2] - a.z, d = Math.hypot(dx, dy, dz);
      if (d > 1e-9) add(b, dx / d, dy / d, dz / d, a.r + qr - d, kind, vb);
    };
    for (let j = i + 1; j < prizes.length; j++) {
      const b = prizes[j];
      toPoint([b.x, b.y, b.z], b.r, 'prize', null, b);
    }
    if (withClaw) {
      toPoint([h.x, h.y, h.z], h.r, 'claw', null, h);
      segs.forEach(([s0, s1], k) => {
        const t = segParam([a.x, a.y, a.z], s0, s1);
        toPoint(lerp3(s0, s1, t), FINGER_R, 'claw', segVel ? lerp3(segVel[k][0], segVel[k][1], t) : ZERO, h);
      });
    }
    if (!(a.x < HOLE.x && a.z > HOLE.z)) add(null, 0, -1, 0, a.r - a.y, 'floor', ZERO);   // no floor over the hole
    add(null, -1, 0, 0, a.r - (a.x + BOX.x), 'glass', ZERO);
    add(null, 1, 0, 0, a.r - (BOX.x - a.x), 'glass', ZERO);
    add(null, 0, 0, -1, a.r - (a.z + BOX.z), 'glass', ZERO);
    add(null, 0, 0, 1, a.r - (BOX.z - a.z), 'glass', ZERO);
    for (const w of WALLS) {
      const q = [clamp(a.x, w.min[0], w.max[0]), clamp(a.y, w.min[1], w.max[1]), clamp(a.z, w.min[2], w.max[2])];
      if (Math.hypot(a.x - q[0], a.y - q[1], a.z - q[2]) > 1e-9) { toPoint(q, 0, 'wall', ZERO); continue; }
      // The centre is inside the wall: out through the nearest face
      let best = 1e9, axis = 0, dir = 1;
      const p = [a.x, a.y, a.z];
      for (let k = 0; k < 3; k++) for (const [face, sg] of [[w.min[k], -1], [w.max[k], 1]]) {
        const dist = Math.abs(p[k] - face);
        if (dist < best) { best = dist; axis = k; dir = sg; }
      }
      const n = [0, 0, 0]; n[axis] = -dir;
      add(null, n[0], n[1], n[2], best + a.r, 'wall', ZERO);
    }
  }
  return out;
}

// Velocity of the other side relative to the prize, at the contact point
function relVel(c) {
  const a = c.a, b = c.b, n = c.n;
  const rax = n[0] * a.r, ray = n[1] * a.r, raz = n[2] * a.r;
  const va = [a.vx + a.wy * raz - a.wz * ray, a.vy + a.wz * rax - a.wx * raz, a.vz + a.wx * ray - a.wy * rax];
  let vb = c.vb;
  if (b && vb) vb = [b.vx + vb[0], b.vy + vb[1], b.vz + vb[2]];
  else if (b) {
    const rbx = -n[0] * b.r, rby = -n[1] * b.r, rbz = -n[2] * b.r, wx = b.wx || 0, wy = b.wy || 0, wz = b.wz || 0;
    vb = [b.vx + wy * rbz - wz * rby, b.vy + wz * rbx - wx * rbz, b.vz + wx * rby - wy * rbx];
  }
  return [vb[0] - va[0], vb[1] - va[1], vb[2] - va[2]];
}

// Impulse J on b at its contact point, and -J on a at its own
function applyImpulse(c, jx, jy, jz) {
  const a = c.a, b = c.b, n = c.n;
  a.vx -= jx * a.im; a.vy -= jy * a.im; a.vz -= jz * a.im;
  const rax = n[0] * a.r, ray = n[1] * a.r, raz = n[2] * a.r;
  a.wx -= a.iI * (ray * jz - raz * jy); a.wy -= a.iI * (raz * jx - rax * jz); a.wz -= a.iI * (rax * jy - ray * jx);
  if (!b) return;
  const im = imOf(b, c);
  b.vx += jx * im; b.vy += jy * im; b.vz += jz * im;
  if (b.iI && im && !c.vb) {
    const rbx = -n[0] * b.r, rby = -n[1] * b.r, rbz = -n[2] * b.r;
    b.wx += b.iI * (rby * jz - rbz * jy); b.wy += b.iI * (rbz * jx - rbx * jz); b.wz += b.iI * (rbx * jy - rby * jx);
  }
}

const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];

function solveContacts(cs, dt) {
  for (const c of cs) {
    const vn = dot(relVel(c), c.n);
    // Across a gap the bodies may still approach, just not past touching (no tunnelling, no fake bumps)
    c.target = c.pen < 0 ? c.pen / dt : (vn < -BOUNCE_MIN ? -BOUNCE[c.kind] * vn : 0);
  }
  for (let it = 0; it < SOLVER_ITERS; it++) for (const c of cs) {
    const a = c.a, b = c.b, n = c.n, imb = b ? imOf(b, c) : 0;
    // Normal: never pull, only push
    let v = relVel(c);
    const jn0 = c.jn;
    c.jn = Math.max(0, jn0 + (c.target - dot(v, n)) / (a.im + imb));
    const j = c.jn - jn0;
    if (j) applyImpulse(c, n[0] * j, n[1] * j, n[2] * j);
    // Friction: oppose sliding at the contact point, up to MU times the normal impulse
    v = relVel(c);
    const vn = dot(v, n), tx = v[0] - vn * n[0], ty = v[1] - vn * n[1], tz = v[2] - vn * n[2];
    const k = a.im + imb + a.r * a.r * a.iI + (b && imb && !c.vb ? b.r * b.r * (b.iI || 0) : 0);
    let jt = [c.jt[0] - tx / k, c.jt[1] - ty / k, c.jt[2] - tz / k];
    const max = MU[c.kind] * c.jn, len = Math.hypot(...jt);
    if (len > max) jt = jt.map(x => x * max / len);
    applyImpulse(c, jt[0] - c.jt[0], jt[1] - c.jt[1], jt[2] - c.jt[2]);
    c.jt = jt;
  }
}

// Move overlapping bodies apart directly (no velocity change), sharing the push by inverse mass
function separate(cs) {
  for (const c of cs) {
    if (c.pen <= SLOP) continue;
    const a = c.a, b = c.b, imb = b ? imOf(b, c) : 0, s = (c.pen - SLOP) * .9 / (a.im + imb), n = c.n;
    a.x -= n[0] * s * a.im; a.y -= n[1] * s * a.im; a.z -= n[2] * s * a.im;
    if (b && imb) { b.x += n[0] * s * imb; b.y += n[1] * s * imb; b.z += n[2] * s * imb; }
  }
}

// The finger segments one step ago, relative to the head, for their own motion (closing, tilting)
let lastSegs = null;
const rollAxis = new THREE.Vector3(), rollQ = new THREE.Quaternion();
function physics(dt, settling) {
  for (const p of prizes) p.vy -= G * dt;

  const segs = segments(), h = claw.head;
  const segsRel = segs.map(s => s.map(q => [q[0] - h.x, q[1] - h.y, q[2] - h.z]));
  const segVel = lastSegs ? segsRel.map((s, i) => s.map((q, j) => q.map((v, k) => (v - lastSegs[i][j][k]) / dt))) : null;
  lastSegs = segsRel;

  const cs = findContacts(segs, segVel, MARGIN, !settling);
  solveContacts(cs, dt);

  const touching = new Set(cs.filter(c => c.jn > 0).map(c => c.a));
  for (const p of prizes) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (touching.has(p)) { const k = 1 - ROLL_DAMP * dt; p.wx *= k; p.wy *= k; p.wz *= k; }
    const w = Math.hypot(p.wx, p.wy, p.wz);
    if (w > 1e-4) p.mesh.quaternion.premultiply(rollQ.setFromAxisAngle(rollAxis.set(p.wx / w, p.wy / w, p.wz / w), w * dt));
  }
  for (let it = 0; it < POS_ITERS; it++) separate(findContacts(segs, null, 0, !settling));

  for (let i = prizes.length - 1; i >= 0; i--) {
    const p = prizes[i];
    if (p.y < -.75) { scene.remove(p.mesh); prizes.splice(i, 1); if (!settling) win(p); }
  }
}

// ---------- Game flow ----------

function startRound() {
  if (state !== 'idle' || coins <= 0) return;
  coins--; state = 'aim'; aimT = AIM_TIME; sfx('coin'); hud();
}

function startDrop() {
  if (state !== 'aim') return;
  state = 'drop'; claw.winch = 0; claw.t = 0; claw.landed = false; claw.target = null; claw.slipping = false; keys.l = keys.r = keys.u = keys.d = false; sfx('drop');
}

// The prize the claw closes on: centred under the head, between the fingers
// It is caught when the closed finger tips end up below the top half of it; the lower they wrap
// around it, the better the grip, so a claw resting high on a packed pile only pinches the top.
// Grabbing is physical, in two parts. When the claw starts closing, pickTarget() only notes the prize
// right under it; that prize stays loose, so the closing fingers really push it (and centre it).
// The fingers stop once two of them pinch it. When they are done, grabTarget() decides: it is caught
// only if two fingers touch it, it is still inside the claw, and the tips are below its top half.
// It is held where it is, never pulled in (no magnet).
function pickTarget() {
  const h = claw.head, tipY = clawPoint(clawFrame(), 0, 0, -.8)[1];
  let pick = null, bd = 1e9;
  for (const p of prizes) {
    const dx = Math.hypot(p.x - h.x, p.z - h.z);
    if (dx < p.r * .8 && p.y < h.y && tipY < p.y + p.r * .5 && dx < bd) { bd = dx; pick = p; }
  }
  claw.target = pick;
}

function grabTarget() {
  const p = claw.target, h = claw.head;
  claw.target = null;
  // The fingers stopped one step before touching, so allow a small gap here
  if (!p || fingersOn(p, claw.open, .02) < 2) return;
  const tipY = Math.min(...fingers().map(fg => fg.t[1]));   // a finger resting on a neighbour sits higher
  const dx = Math.hypot(p.x - h.x, p.z - h.z);
  if (dx > p.r * .8 || tipY > p.y + p.r * .5) return;
  const centred = 1 - dx / (p.r * .8), depth = clamp((p.y + p.r * .5 - tipY) / (p.r * .8), 0, 1);
  claw.q = centred * (.35 + .65 * depth);   // grip quality, 1 = dead centre and wrapped below the middle
  // It stays a loose body resting on the fingers: it settles into the cradle as the claw lifts, a
  // finger that sprang back off a neighbour pushes it to the middle, and it sways with the claw
  claw.held = p;
}

// The held prize is still in the claw while it rests in the cage under the head; if it falls out
// (a poor grip, a swing), the claw has lost it
function stillHeld(p) {
  const h = claw.head;
  return Math.hypot(p.x - h.x, p.z - h.z) < p.r + .2 && p.y < h.y && p.y > h.y - 1.4;
}

// Carriage motor: approach the target velocity with limited acceleration, so it ramps up and brakes
function driveCarriage(tx, tz, dt) {
  const c = claw, ax = tx - c.vx, az = tz - c.vz, a = Math.hypot(ax, az), m = ACC * dt;
  if (a > m) { c.vx += ax / a * m; c.vz += az / a * m; } else { c.vx = tx; c.vz = tz; }
  c.x += c.vx * dt; c.z += c.vz * dt;
  if (Math.abs(c.x) > LIMIT.x) { c.x = Math.sign(c.x) * LIMIT.x; c.vx = 0; }
  if (Math.abs(c.z) > LIMIT.z) { c.z = Math.sign(c.z) * LIMIT.z; c.vz = 0; }
}

// The head is a point mass on an elastic cable that can only pull (it goes slack when the head lands).
// Gravity plus the cable make it a pendulum under the carriage. Returns the carriage-to-head distance.
function swingHead(dt) {
  const c = claw, h = c.head, mass = HEAD_MASS + (c.held ? c.held.r ** 3 / .03 : 0);
  const dx = h.x - c.x, dy = h.y - CARRIAGE_Y, dz = h.z - c.z, dist = Math.hypot(dx, dy, dz);
  // While closing, the claw rests where it landed (see imOf)
  if (state === 'close') { h.vx = h.vy = h.vz = 0; return dist; }
  let ax = 0, ay = -G, az = 0;
  if (dist > c.len) {
    const nx = dx / dist, ny = dy / dist, nz = dz / dist;
    const vrel = (h.vx - c.vx) * nx + h.vy * ny + (h.vz - c.vz) * nz;
    const f = Math.max(0, ROPE_K * (dist - c.len) + ROPE_C * vrel) / mass;
    ax -= f * nx; ay -= f * ny; az -= f * nz;
  }
  // Damping acts on the swing relative to the carriage, so it doesn't make the claw lag while moving.
  // It comes from friction up at the carriage, which brakes a short pendulum hard and a long one
  // barely (it falls with the square of the cable length): heavy and steady at the top, but the claw
  // keeps the sway it had when it starts going down. A small floor stands for air drag.
  const k = SWING_DRAG * dt, ks = k * clamp((L_MIN / Math.max(dist, L_MIN)) ** 2, .2, 1);
  h.vx += ax * dt - (h.vx - c.vx) * ks; h.vy += ay * dt - h.vy * k * .2; h.vz += az * dt - (h.vz - c.vz) * ks;
  h.x += h.vx * dt; h.y += h.vy * dt; h.z += h.vz * dt;
  if (h.y < HEAD_MIN_Y) { h.y = HEAD_MIN_Y; if (h.vy < 0) h.vy *= -.2; h.vx *= .9; h.vz *= .9; }
  // The hole walls stop the claw: it rests on their top edge or slides off their sides
  const s = clawWallPush(), sl = Math.hypot(...s);
  if (sl > 0) {
    h.x += s[0]; h.y += s[1]; h.z += s[2];
    const n = s.map(v => v / sl), vn = h.vx * n[0] + h.vy * n[1] + h.vz * n[2];
    if (vn < 0) { h.vx -= 1.2 * vn * n[0]; h.vy -= 1.2 * vn * n[1]; h.vz -= 1.2 * vn * n[2]; }
  }
  if (h.y > CARRIAGE_Y - .2) { h.y = CARRIAGE_Y - .2; if (h.vy > 0) h.vy = 0; }
  const bx = BOX.x - .3, bz = BOX.z - .3;
  if (Math.abs(h.x) > bx) { h.x = Math.sign(h.x) * bx; h.vx *= -.3; }
  if (Math.abs(h.z) > bz) { h.z = Math.sign(h.z) * bz; h.vz *= -.3; }
  return dist;
}

// On top of the physics (a prize only pinched at the top just falls out as the claw lifts), the grip
// sometimes gives way: more often off centre and for gold prizes. A slip doesn't snap the claw open:
// the grip gives way gradually (see loosen) until the prize passes between the tips.
function slip(dt) {
  const c = claw, p = c.held;
  if (c.slipping) { loosen(dt, .8); return; }
  if (!p || (state === 'lift' && c.t < .25)) return;
  const rate = (.03 + (1 - c.q) * .2) * (p.rare ? 1.6 : 1);
  if (Math.random() < rate * dt) c.slipping = true;
}

// Open the fingers at this rate; the held prize falls out on its own once the tips clear it
function loosen(dt, rate) {
  const c = claw;
  c.open = Math.min(1, c.open + rate * dt);
  if (c.held && tipRadial(c.open) >= c.held.r + FINGER_R) {
    if (c.slipping) sfx('slip');
    c.held = null; c.slipping = false;
  }
}

function win(p) {
  const pts = p.rare ? 5 : 1;
  score += pts; won++;
  pop([HOME.x, 1.4, HOME.z], p.rare ? '+5 ¡Dorada!' : '+1', p.rare ? '#ffd23f' : '#80ed99');
  sfx('win'); hud();
}

const vPop = new THREE.Vector3();
function pop(pos, text, col) {
  vPop.set(...pos).project(camera);
  const el = document.createElement('div');
  el.className = 'pop'; el.textContent = text; el.style.color = col;
  el.style.left = (vPop.x + 1) / 2 * innerWidth + 'px'; el.style.top = (1 - vPop.y) / 2 * innerHeight + 'px';
  el.addEventListener('animationend', () => el.remove());
  document.body.append(el);
}

function update(dt) {
  const c = claw;
  // Where the carriage wants to go; it only moves while aiming and on the way back
  let tx = 0, tz = 0;
  if (state === 'aim') {
    tx = ((keys.r ? 1 : 0) - (keys.l ? 1 : 0)) * MOVE;
    tz = ((keys.d ? 1 : 0) - (keys.u ? 1 : 0)) * MOVE;
  } else if (state === 'return') {
    // Brake in time to stop over the hole
    const dx = HOME.x - c.x, dz = HOME.z - c.z, d = Math.hypot(dx, dz);
    const s = Math.min(MOVE, Math.sqrt(2 * ACC * .8 * d));
    if (d > 1e-4) { tx = dx / d * s; tz = dz / d * s; }
  }
  driveCarriage(tx, tz, dt);

  switch (state) {
    case 'aim':
      aimT -= dt;
      if (aimT <= 0) startDrop();
      break;
    case 'drop':
      // The winch pays out the whole cable in a fixed time, as on a real machine: touching a prize on
      // the way doesn't stop it. Whatever the claw lands on, it rests there with its weight (the cable
      // goes slack) and sinks into the pile; once the time is up and it has settled, it closes.
      c.winch = Math.min(DROP, c.winch + WINCH_ACC * dt);
      c.len = Math.min(L_MAX, c.len + c.winch * dt);
      if (!c.landed && c.len - c.dist > .06) { c.landed = true; sfx('clank'); }
      if (c.len >= L_MAX && (c.t += dt) >= DROP_REST) { state = 'close'; c.winch = 0; pickTarget(); }
      break;
    case 'close': {
      // The fingers close until they cradle the prize under the claw (gripDone), or they run into a
      // hole wall, or all the way if there is nothing
      const next = Math.max(0, c.open - dt * 2.2);
      const stopped = (c.target && gripDone(c.target, next)) || wallBlocks(next);
      if (!stopped) c.open = next;
      if (stopped || c.open <= 0) {
        grabTarget();
        if (c.held) sfx('grab');
        state = 'lift'; c.t = 0; c.len = Math.min(c.len, c.dist);   // take up the slack first
      }
      break;
    }
    case 'lift':
      c.winch = Math.min(LIFT, c.winch + WINCH_ACC * dt);
      c.len = Math.max(L_MIN, c.len - c.winch * dt); c.t += dt; slip(dt);
      if (c.len <= L_MIN) { state = 'return'; c.winch = 0; sfx('clank'); }
      break;
    case 'return':
      slip(dt);
      if (Math.hypot(HOME.x - c.x, HOME.z - c.z) < .01 && Math.hypot(c.vx, c.vz) < .05) {
        c.x = HOME.x; c.z = HOME.z; c.vx = c.vz = 0; state = 'settle'; c.t = 0;
      }
      break;
    case 'settle': {
      // Wait over the hole for the swing to die down (up to a second) before letting go
      c.t += dt; slip(dt);
      const h = c.head;
      if (Math.hypot(h.x - c.x, h.z - c.z) < .05 && Math.hypot(h.vx, h.vz) < .25 || c.t > 1) state = 'release';
      break;
    }
    case 'release':
      c.slipping = false;
      loosen(dt, 2);
      if (c.open >= 1) { state = 'wait'; c.t = 0; }
      break;
    case 'wait':
      c.t += dt;
      if (c.t > 1.2) {
        if (coins > 0) {
          state = 'idle';
          if (prizes.length < 10) spawn(12, 5);   // restock from the top
        } else gameOver();
        hud();
      }
      break;
  }
  c.dist = swingHead(dt);
  flexFingers(dt);
  if (c.held && !stillHeld(c.held)) { c.held = null; c.slipping = false; sfx('slip'); }
}

function gameOver() {
  state = 'over';
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(BEST_KEY, best); } catch (e) {} }
  $('ovStats').innerHTML = `Premios: ${won}<br>Puntos: ${score}<br>${rec && score > 0 ? '¡Nuevo récord!' : 'Récord: ' + best}`;
  $('over').hidden = false;
}

let shownTime = '';
function hud() {
  $('hCoins').textContent = coins;
  $('hScore').textContent = score;
  $('hint').hidden = state !== 'idle';
}
function hudTime() {
  const t = state === 'aim' ? String(Math.ceil(aimT)) : '–';
  if (t !== shownTime) { shownTime = t; $('hTime').textContent = t; $('hTime').classList.toggle('low', state === 'aim' && aimT < 5); }
}

// ---------- Sound (tiny synth, no assets) ----------

let ac = null;
function sfx(name) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    const tone = (f, f2, d, type, v, at = 0) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + at);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + at + d);
      g.gain.setValueAtTime(v, t + at); g.gain.exponentialRampToValueAtTime(0.001, t + at + d);
      o.connect(g).connect(ac.destination); o.start(t + at); o.stop(t + at + d + .02);
    };
    switch (name) {
      case 'coin': tone(988, 0, .08, 'square', .05); tone(1319, 0, .25, 'square', .05, .08); break;
      case 'drop': tone(600, 200, .6, 'triangle', .08); break;
      case 'clank': tone(180, 90, .12, 'square', .07); break;
      case 'grab': tone(400, 800, .12, 'triangle', .08); break;
      case 'slip': tone(220, 80, .3, 'sawtooth', .05); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, .18, 'square', .05, i * .09)); break;
    }
  } catch (e) {}
}

// ---------- Input ----------

// Moving while idle spends a coin and starts the round
function press(dir) {
  if (state === 'idle') startRound();
  keys[dir] = true;
}
function dropButton() { if (state === 'idle') startRound(); else startDrop(); }

const KEY_DIR = { ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r', ArrowUp: 'u', w: 'u', ArrowDown: 'd', s: 'd' };
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === ' ' || k === 'Enter' || KEY_DIR[k]) e.preventDefault();
  if (e.repeat) return;
  if (state === 'over') { if (k === ' ' || k === 'Enter') reset(); return; }
  if (KEY_DIR[k]) press(KEY_DIR[k]);
  else if (k === ' ' || k === 'Enter') dropButton();
});
addEventListener('keyup', e => {
  const dir = KEY_DIR[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (dir) keys[dir] = false;
});

for (const b of document.querySelectorAll('#pad button')) {
  const dir = b.dataset.dir;
  b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); b.classList.add('on'); press(dir); });
  const up = () => { keys[dir] = false; b.classList.remove('on'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
}
$('bd').addEventListener('pointerdown', dropButton);
$('again').addEventListener('click', reset);
addEventListener('blur', () => { keys.l = keys.r = keys.u = keys.d = false; });

// ---------- Layout and loop ----------

// Back the camera off until the whole machine fits between the HUD and the controls,
// and shift the view so it is centred in that gap. On wide screens the controls sit
// in the bottom corners, beside the machine, so they take no height.
function fit() {
  const w = innerWidth, h = innerHeight, wide = w / h > 1.2;
  document.body.classList.toggle('wide', wide);
  const topPad = 112, botPad = wide ? 16 : $('controls').offsetHeight + 20, freeH = Math.max(150, h - topPad - botPad);
  renderer.setSize(w, h);
  camera.aspect = w / h;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(3.9 / (t * freeH / h), 3.2 / (t * w / h));
  camera.position.copy(CAM_TARGET).addScaledVector(CAM_DIR, dist);
  camera.lookAt(CAM_TARGET);
  camera.setViewOffset(w, h, 0, (botPad - topPad) / 2, w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', fit);

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000);
  last = now; acc += dt;
  while (acc >= STEP) { update(STEP); physics(STEP, false); acc -= STEP; }
  for (const p of prizes) p.mesh.position.set(p.x, p.y, p.z);
  syncClaw();
  const tick = Math.floor(now / 160);
  for (const [b, i] of bulbs) b.material = (i + tick) % 3 === 0 ? BULB_ON : BULB_OFF;
  hudTime();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// Handle for poking at the game from the console
window.game = { get state() { return state; }, get claw() { return claw; }, get prizes() { return prizes; }, get score() { return score; }, startRound, startDrop, segments,
  // Run n simulation steps right now, without waiting for frames (fast, repeatable tests)
  step(n = 1) { for (let i = 0; i < n; i++) { update(STEP); physics(STEP, false); } } };

reset();
fit();
requestAnimationFrame(frame);
</script>
</body>
