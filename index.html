<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claw Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1b1430; --ink: #fff6e0; --pink: #e8457a; --pink-dark: #8a1f48; --gold: #ffd23f; --panel: #2b1850; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--ink); font-family: Kalam, "Comic Sans MS", cursive; font-weight: 700;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px;
    background: var(--panel); border: 4px solid var(--pink-dark); border-radius: 18px; padding: 4px 14px;
  }
  #hud div { text-align: center; min-width: 74px; }
  #hud small { display: block; font-size: 13px; color: #b9a8e0; line-height: 1.2; }
  #hud span { font-size: 26px; line-height: 1.1; }
  #hud span.low { color: #ff5d8f; }
  #hint {
    position: fixed; top: 74px; left: 0; right: 0; text-align: center; font-size: 20px; line-height: 1.2; padding: 0 16px;
    text-shadow: 0 2px 0 var(--bg), 0 0 8px var(--bg); animation: pulse 1.4s ease-in-out infinite; pointer-events: none;
  }
  @keyframes pulse { 50% { opacity: .45; } }
  #controls {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; align-items: center; gap: 28px; pointer-events: none;
  }
  body.wide #controls { justify-content: space-between; padding: 0 max(24px, 5vw); }
  #pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 2px; }
  #pad button[data-dir="u"] { grid-area: 1 / 2; }
  #pad button[data-dir="l"] { grid-area: 2 / 1; }
  #pad button[data-dir="r"] { grid-area: 2 / 3; }
  #pad button[data-dir="d"] { grid-area: 3 / 2; }
  #controls button {
    pointer-events: auto; font: inherit; color: var(--ink); background: var(--pink); border: 4px solid var(--pink-dark);
    border-radius: 16px; font-size: 22px; cursor: pointer; box-shadow: 0 5px 0 var(--pink-dark); padding: 0;
  }
  #controls button:active, #controls button.on { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-dark); }
  #controls #bd {
    width: 120px; height: 120px; border-radius: 50%; font-size: 26px;
    background: var(--gold); color: #3a1f00; border-color: #a8740a; box-shadow: 0 6px 0 #a8740a;
  }
  .pop {
    position: fixed; transform: translate(-50%, -50%); font-size: 30px; pointer-events: none; white-space: nowrap;
    text-shadow: 0 3px 0 var(--bg), 0 0 6px var(--bg); animation: rise 1.2s ease-out forwards;
  }
  @keyframes rise { to { transform: translate(-50%, -150%); opacity: 0; } }
  #over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 5, 25, .65); padding: 16px; }
  .card { background: var(--panel); border: 5px solid var(--gold); border-radius: 22px; padding: 22px 30px; text-align: center; max-width: 360px; width: 100%; }
  .card h2 { margin: 0 0 8px; font-size: 34px; color: var(--gold); }
  .card p { margin: 0 0 18px; font-size: 22px; line-height: 1.4; }
  .card button { font: inherit; font-size: 24px; color: #3a1f00; background: var(--gold); border: 4px solid #a8740a; border-radius: 16px; padding: 8px 24px; cursor: pointer; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <div><small>FICHAS</small><span id="hCoins">10</span></div>
  <div><small>PUNTOS</small><span id="hScore">0</span></div>
  <div><small>TIEMPO</small><span id="hTime">–</span></div>
</div>
<div id="hint">Tocá las flechas o ¡BAJAR! para jugar (1 ficha)</div>
<div id="controls">
  <div id="pad">
    <button data-dir="u" aria-label="Atrás">▲</button>
    <button data-dir="l" aria-label="Izquierda">◀</button>
    <button data-dir="r" aria-label="Derecha">▶</button>
    <button data-dir="d" aria-label="Adelante">▼</button>
  </div>
  <button id="bd">¡BAJAR!</button>
</div>
<div id="over" hidden>
  <div class="card">
    <h2>¡Sin fichas!</h2>
    <p id="ovStats"></p>
    <button id="again">Jugar de nuevo</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// World units: the glass box is 4 wide (x), 3 deep (z), the floor is y = 0.
// The prize hole is the front-left corner: x < HOLE.x and z > HOLE.z.
const BOX = { x: 2, z: 1.5 };
const HOLE = { x: -1.1, z: 0.6 };
const HOLE_WALL_H = 1.1;
const WALLS = [   // the clear walls around the hole, as boxes
  { min: [HOLE.x - .03, 0, HOLE.z - .03], max: [HOLE.x + .03, HOLE_WALL_H, BOX.z] },
  { min: [-BOX.x, 0, HOLE.z - .03], max: [HOLE.x + .03, HOLE_WALL_H, HOLE.z + .03] },
];
const HOME = { x: (-BOX.x + HOLE.x) / 2, z: (HOLE.z + BOX.z) / 2 };
const LIMIT = { x: 1.7, z: 1.2 };
const CARRIAGE_Y = 4.3, HEAD0 = 4.0;
const G = 14, STEP = 1 / 120;
const MOVE = 1.6, DROP = 2.2, LIFT = 1.8;
const AIM_TIME = 15, START_COINS = 10, PRIZE_COUNT = 26;
const COLORS = [0xff5d8f, 0x4cc9f0, 0x80ed99, 0xb388ff, 0xff9f43];
const FINGER_ANGLES = [-Math.PI / 2, -Math.PI / 2 + 2.094, -Math.PI / 2 + 4.189];
const BEST_KEY = 'clawMachine.best';

let prizes = [], claw, coins, score, won, state, aimT, best = 0;
const keys = { l: false, r: false, u: false, d: false };

try { best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) {}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const headY = () => HEAD0 - claw.len;
const $ = id => document.getElementById(id);

// ---------- Renderer, camera, lights ----------

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1430);
scene.fog = new THREE.Fog(0x1b1430, 14, 30);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
const CAM_TARGET = new THREE.Vector3(0, 1.6, 0), CAM_DIR = new THREE.Vector3(0, .5, .87).normalize();

scene.add(new THREE.HemisphereLight(0xd8ccff, 0x2a1840, 1.4));
const front = new THREE.DirectionalLight(0xfff0e0, 1.2);
front.position.set(2, 6, 8);
scene.add(front);
// Straight-down light: the claw's shadow lands right under it, which is how you aim in depth
const top = new THREE.DirectionalLight(0xffffff, 1.6);
top.position.set(0, 10, 0.001);
top.castShadow = true;
top.shadow.mapSize.set(2048, 2048);
Object.assign(top.shadow.camera, { left: -2.6, right: 2.6, top: 2.2, bottom: -2.2, near: 1, far: 14 });
top.shadow.bias = -0.0005;
scene.add(top);
const glow = new THREE.PointLight(0xffc0e0, 6, 8, 1.5);
glow.position.set(0, 3.8, 0.6);
scene.add(glow);

// ---------- Machine ----------

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .55, ...extra });
const PINK = mat(0xe8457a, { roughness: .4 }), PINK_DARK = mat(0x8a1f48), METAL = mat(0xd5dbe8, { metalness: .8, roughness: .3 });
const GOLD = mat(0xf4c430, { metalness: .7, roughness: .3 });

function box(w, h, d, material, x, y, z, rounded = false) {
  const m = new THREE.Mesh(rounded ? new RoundedBoxGeometry(w, h, d, 3, Math.min(w, h, d) * .2) : new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z); scene.add(m); return m;
}

function canvasTex(w, h, paint) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.repaint = () => { paint(c.getContext('2d'), w, h); tex.needsUpdate = true; };
  tex.repaint();
  return tex;
}

const dots = (bg) => {
  const t = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(255,255,255,.12)';
    for (const [x, y] of [[32, 32], [96, 96]]) { g.beginPath(); g.arc(x, y, 9, 0, 7); g.fill(); }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
};

// Floor slab with the hole cut out: two boxes forming an L, plus thick rims all round
const floorTex = dots('#5a43a0'); floorTex.repeat.set(6, 4.5);
const FLOOR = mat(0xffffff, { map: floorTex });
const slabA = box(BOX.x - HOLE.x, .6, BOX.z * 2, FLOOR, (HOLE.x + BOX.x) / 2, -.3, 0);
const slabB = box(HOLE.x + BOX.x, .6, HOLE.z + BOX.z, FLOOR, (HOLE.x - BOX.x) / 2, -.3, (HOLE.z - BOX.z) / 2);
slabA.receiveShadow = slabB.receiveShadow = true;
box(4.7, .62, .35, PINK, 0, -.29, BOX.z + .175);
box(4.7, .62, .35, PINK, 0, -.29, -BOX.z - .175);
box(.35, .62, 3.7, PINK, BOX.x + .175, -.29, 0);
box(.35, .62, 3.7, PINK, -BOX.x - .175, -.29, 0);
const holeIn = box(.88, .6, .88, new THREE.MeshStandardMaterial({ color: 0x120a20, side: THREE.BackSide }), HOME.x, -.3, HOME.z);
holeIn.receiveShadow = true;
box(4.7, 1.1, 3.7, PINK, 0, -1.15, 0, true);

// Prize door on the front
const doorTex = canvasTex(256, 128, (g, w, h) => {
  g.fillStyle = '#1b1430'; g.beginPath(); g.roundRect(4, 4, w - 8, h - 8, 22); g.fill();
  g.strokeStyle = '#ffd23f'; g.lineWidth = 8; g.stroke();
  g.fillStyle = '#ffd23f'; g.font = '700 54px Kalam, cursive'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('PREMIOS', w / 2, h / 2 + 4);
});
const door = new THREE.Mesh(new THREE.PlaneGeometry(1, .5), new THREE.MeshBasicMaterial({ map: doorTex, transparent: true }));
door.position.set(HOME.x, -.95, 1.86); scene.add(door);

// Pillars, roof, back wall, glass
for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(.35, 4.6, .35, PINK, sx * (BOX.x + .175), 2.3, sz * (BOX.z + .175), true);
box(4.7, .3, 3.7, PINK, 0, 4.75, 0, true);
const backTex = dots('#2e2058'); backTex.repeat.set(6, 7);
const back = new THREE.Mesh(new THREE.PlaneGeometry(BOX.x * 2, 4.6), mat(0xffffff, { map: backTex }));
back.position.set(0, 2.3, -BOX.z); back.receiveShadow = true; scene.add(back);
const GLASS = new THREE.MeshStandardMaterial({ color: 0xbfe6ff, transparent: true, opacity: .07, roughness: 0, depthWrite: false });
const glassF = new THREE.Mesh(new THREE.PlaneGeometry(BOX.x * 2, 4.6), GLASS);
glassF.position.set(0, 2.3, BOX.z); scene.add(glassF);
for (const sx of [-1, 1]) {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(BOX.z * 2, 4.6), GLASS);
  g.position.set(sx * BOX.x, 2.3, 0); g.rotation.y = Math.PI / 2; scene.add(g);
}
// Clear walls around the hole, with a yellow top edge
const ACRYLIC = new THREE.MeshStandardMaterial({ color: 0xffd23f, transparent: true, opacity: .28, depthWrite: false });
for (const w of WALLS) {
  const s = w.max.map((v, i) => v - w.min[i]), c = w.max.map((v, i) => (v + w.min[i]) / 2);
  box(s[0], s[1], s[2], ACRYLIC, c[0], c[1], c[2]);
  box(s[0] + .02, .05, s[2] + .02, GOLD, c[0], HOLE_WALL_H, c[2]);
}

// Marquee with chasing bulbs
const marqueeTex = canvasTex(1024, 192, (g, w, h) => {
  g.fillStyle = '#3a1f6b'; g.fillRect(0, 0, w, h);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '700 120px Kalam, cursive';
  g.lineWidth = 16; g.strokeStyle = '#8a1f48'; g.strokeText('CLAW MACHINE', w / 2, h / 2 + 8);
  g.fillStyle = '#ffd23f'; g.fillText('CLAW MACHINE', w / 2, h / 2 + 8);
});
document.fonts.load('700 120px Kalam').then(() => { marqueeTex.repaint(); doorTex.repaint(); }).catch(() => {});
box(4.7, .9, .3, [PINK, PINK, PINK, PINK, new THREE.MeshBasicMaterial({ map: marqueeTex }), PINK], 0, 5.35, BOX.z + .2);
const bulbs = [];
const BULB_ON = new THREE.MeshBasicMaterial({ color: 0xfff3b0 }), BULB_OFF = new THREE.MeshBasicMaterial({ color: 0x8a6a2a });
for (let i = 0; i < 22; i++) for (const y of [4.95, 5.75]) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(.045, 10, 8), BULB_OFF);
  b.position.set(-2.2 + i * 4.4 / 21, y, BOX.z + .37); scene.add(b); bulbs.push([b, i]);
}

// Room floor
const room = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), mat(0x241a40));
room.rotation.x = -Math.PI / 2; room.position.y = -1.7; room.receiveShadow = true; scene.add(room);

// ---------- Claw meshes ----------

const RAIL = mat(0xc9c3d8, { metalness: .6, roughness: .35 });
for (const sx of [-1, 1]) box(.1, .1, BOX.z * 2, RAIL, sx * (BOX.x - .05), CARRIAGE_Y + .05, 0);
const bridge = box(BOX.x * 2, .08, .14, RAIL, 0, CARRIAGE_Y + .05, 0);
const carriage = box(.34, .18, .34, mat(0xefeaf7), 0, CARRIAGE_Y - .04, 0, true);
const cable = new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, 1, 6), mat(0xdddddd));
const head = new THREE.Mesh(new THREE.SphereGeometry(.17, 20, 14), GOLD);
scene.add(cable, head);
const SEG = new THREE.CylinderGeometry(.035, .035, 1, 8), JOINT = new THREE.SphereGeometry(.05, 10, 8);
const fingerMeshes = FINGER_ANGLES.map(() => {
  const m = { a: new THREE.Mesh(SEG, METAL), b: new THREE.Mesh(SEG, METAL), k: new THREE.Mesh(JOINT, METAL), t: new THREE.Mesh(JOINT, METAL) };
  for (const x of Object.values(m)) { x.castShadow = true; scene.add(x); }
  return m;
});
for (const m of [carriage, cable, head, bridge]) m.castShadow = true;

const UP = new THREE.Vector3(0, 1, 0), vA = new THREE.Vector3(), vB = new THREE.Vector3();
function setSeg(mesh, a, b) {
  vA.set(...a); vB.set(...b);
  mesh.position.addVectors(vA, vB).multiplyScalar(.5);
  vB.sub(vA); const L = vB.length();
  mesh.scale.set(1, L, 1); mesh.quaternion.setFromUnitVectors(UP, vB.divideScalar(L));
}

// Each finger lives in its own vertical plane around the head: pivot → knee → tip.
// open (0..1) swings it outwards around the pivot.
function fingers() {
  const hy = headY(), th = claw.open * .8, c = Math.cos(th), s = Math.sin(th), out = [];
  const loc = (u, d) => [.12 + u * c + d * s, -.08 - (-u * s + d * c)];
  for (const a of FINGER_ANGLES) {
    const ca = Math.cos(a), sa = Math.sin(a);
    const P = ([rr, yy]) => [claw.x + rr * ca, hy + yy, claw.z + rr * sa];
    out.push({ p: P([.12, -.08]), k: P(loc(.26, .32)), t: P(loc(-.1, .72)) });
  }
  return out;
}

function syncClaw() {
  const hy = headY();
  bridge.position.z = claw.z;
  carriage.position.set(claw.x, CARRIAGE_Y - .04, claw.z);
  setSeg(cable, [claw.x, CARRIAGE_Y, claw.z], [claw.x, hy, claw.z]);
  head.position.set(claw.x, hy, claw.z);
  fingers().forEach((f, i) => {
    const m = fingerMeshes[i];
    setSeg(m.a, f.p, f.k); setSeg(m.b, f.k, f.t); m.k.position.set(...f.k); m.t.position.set(...f.t);
  });
}

// ---------- Prizes ----------

const HEMI_TOP = new THREE.SphereGeometry(1, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2);
const HEMI_BOT = new THREE.SphereGeometry(1, 28, 14, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
const BAND = new THREE.TorusGeometry(1, .04, 6, 32);
const TOY = new THREE.SphereGeometry(.42, 16, 12), EYE = new THREE.SphereGeometry(.07, 8, 6), STAR = new THREE.OctahedronGeometry(.45);
const CLEAR = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: .32, roughness: .05, clearcoat: 1, depthWrite: false });
const DARK = mat(0x1b1430), BAND_MAT = mat(0x3a2a55);
const colorMats = new Map();
const colorMat = c => colorMats.get(c) || colorMats.set(c, mat(c, { roughness: .35 })).get(c);
const GOLD_SHELL = mat(0xffd23f, { metalness: .6, roughness: .25 }), STAR_MAT = mat(0xff9f1c, { emissive: 0x552200 });

function mkPrize(x, y, z) {
  const rare = Math.random() < .12, col = COLORS[Math.random() * COLORS.length | 0];
  const r = rare ? .27 : .28 + Math.random() * .08;
  const g = new THREE.Group();
  const bot = new THREE.Mesh(HEMI_BOT, rare ? GOLD_SHELL : colorMat(col));
  const topM = new THREE.Mesh(HEMI_TOP, CLEAR);
  const band = new THREE.Mesh(BAND, BAND_MAT); band.rotation.x = Math.PI / 2;
  bot.castShadow = bot.receiveShadow = true;
  g.add(bot, band);
  if (rare) { const s = new THREE.Mesh(STAR, STAR_MAT); s.position.y = .4; g.add(s); }
  else {
    const toy = new THREE.Mesh(TOY, colorMat(col)); toy.position.y = .38; g.add(toy);
    for (const sx of [-1, 1]) { const e = new THREE.Mesh(EYE, DARK); e.position.set(sx * .15, .48, .36); g.add(e); }
  }
  g.add(topM);
  g.scale.setScalar(r);
  g.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
  scene.add(g);
  return { x, y, z, vx: (Math.random() - .5) * .4, vy: 0, vz: (Math.random() - .5) * .4, r, rare, held: false, mesh: g };
}

function spawn(n, y0) {
  for (let i = 0; i < n; i++) {
    let x, z;
    do { x = (Math.random() * 2 - 1) * 1.7; z = (Math.random() * 2 - 1) * 1.2; } while (x < HOLE.x + .5 && z > HOLE.z - .5);
    prizes.push(mkPrize(x, y0 + i * .5, z));
  }
}

function reset() {
  for (const p of prizes) scene.remove(p.mesh);
  prizes = [];
  claw = { x: HOME.x, z: HOME.z, len: 0, open: 1, held: null, q: 0, ox: 0, oy: 0, oz: 0, t: 0 };
  state = 'idle'; coins = START_COINS; score = 0; won = 0;
  spawn(PRIZE_COUNT, 1);
  for (let i = 0; i < 1200; i++) physics(STEP, true);   // let the pile settle before showing it
  $('over').hidden = true;
  hud();
}

// ---------- Physics: spheres with gravity, walls, the hole walls and the claw as kinematic spheres ----------

function colliders() {
  const out = [{ x: claw.x, y: headY(), z: claw.z, r: .17 }];
  const mid = (a, b) => a.map((v, i) => (v + b[i]) / 2);
  for (const f of fingers()) for (const q of [mid(f.p, f.k), f.k, mid(f.k, f.t), f.t]) out.push({ x: q[0], y: q[1], z: q[2], r: .06 });
  return out;
}

function collide(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, d = Math.hypot(dx, dy, dz), m = a.r + b.r;
  if (d >= m || d === 0) return;
  const wa = a.held ? 0 : 1, wb = b.held ? 0 : 1, ws = wa + wb;
  if (!ws) return;
  const nx = dx / d, ny = dy / d, nz = dz / d, p = m - d;
  a.x -= nx * p * wa / ws; a.y -= ny * p * wa / ws; a.z -= nz * p * wa / ws;
  b.x += nx * p * wb / ws; b.y += ny * p * wb / ws; b.z += nz * p * wb / ws;
  const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny + (b.vz - a.vz) * nz;
  if (rv < 0) {
    const j = -1.2 * rv / ws;
    a.vx -= j * nx * wa; a.vy -= j * ny * wa; a.vz -= j * nz * wa;
    b.vx += j * nx * wb; b.vy += j * ny * wb; b.vz += j * nz * wb;
  }
}

// Push a prize out of a point it overlaps (kr = 0 for box corners) and drop its velocity into it
function pushFrom(p, cx, cy, cz, kr, bounce = 1) {
  let dx = p.x - cx, dy = p.y - cy, dz = p.z - cz, d = Math.hypot(dx, dy, dz);
  const m = p.r + kr;
  if (d >= m) return;
  if (d === 0) { dx = 0; dy = 1; dz = 0; d = 1; }
  const nx = dx / d, ny = dy / d, nz = dz / d;
  p.x = cx + nx * m; p.y = cy + ny * m; p.z = cz + nz * m;
  const vn = p.vx * nx + p.vy * ny + p.vz * nz;
  if (vn < 0) { p.vx -= bounce * vn * nx; p.vy -= bounce * vn * ny; p.vz -= bounce * vn * nz; }
}

function bounds(p) {
  if (p.x - p.r < -BOX.x) { p.x = -BOX.x + p.r; if (p.vx < 0) p.vx *= -.3; }
  if (p.x + p.r > BOX.x) { p.x = BOX.x - p.r; if (p.vx > 0) p.vx *= -.3; }
  if (p.z - p.r < -BOX.z) { p.z = -BOX.z + p.r; if (p.vz < 0) p.vz *= -.3; }
  if (p.z + p.r > BOX.z) { p.z = BOX.z - p.r; if (p.vz > 0) p.vz *= -.3; }
  // The floor only exists outside the hole
  if (!(p.x < HOLE.x && p.z > HOLE.z) && p.y - p.r < 0) {
    p.y = p.r; if (p.vy < 0) p.vy *= -.2; p.vx *= .96; p.vz *= .96;
  }
  for (const w of WALLS) {
    pushFrom(p, clamp(p.x, w.min[0], w.max[0]), clamp(p.y, w.min[1], w.max[1]), clamp(p.z, w.min[2], w.max[2]), 0, 1.3);
  }
}

const rollAxis = new THREE.Vector3(), rollQ = new THREE.Quaternion();
function physics(dt, settling) {
  for (const p of prizes) {
    if (p.held) continue;
    p.vy -= G * dt; p.vx *= .998; p.vz *= .998;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    const sp = Math.hypot(p.vx, p.vz);
    if (sp > 1e-3) {
      rollAxis.set(p.vz / sp, 0, -p.vx / sp);
      p.mesh.quaternion.premultiply(rollQ.setFromAxisAngle(rollAxis, sp * dt / p.r));
    }
  }
  const kin = settling ? [] : colliders();
  for (let it = 0; it < 3; it++) {
    for (let i = 0; i < prizes.length; i++) {
      const a = prizes[i];
      for (let j = i + 1; j < prizes.length; j++) collide(a, prizes[j]);
      if (!a.held) { for (const k of kin) pushFrom(a, k.x, k.y, k.z, k.r); bounds(a); }
    }
  }
  for (let i = prizes.length - 1; i >= 0; i--) {
    const p = prizes[i];
    if (!p.held && p.y < -.75) { scene.remove(p.mesh); prizes.splice(i, 1); if (!settling) win(p); }
  }
}

// ---------- Game flow ----------

function startRound() {
  if (state !== 'idle' || coins <= 0) return;
  coins--; state = 'aim'; aimT = AIM_TIME; sfx('coin'); hud();
}

function startDrop() {
  if (state !== 'aim') return;
  state = 'drop'; keys.l = keys.r = keys.u = keys.d = false; sfx('drop');
}

// The prize the claw closes on: centred under the head, between the fingers
function pickGrab() {
  const hy = headY();
  let pick = null, bd = 1e9;
  for (const p of prizes) {
    const dx = Math.hypot(p.x - claw.x, p.z - claw.z);
    if (dx < p.r * .8 && p.y < hy && p.y > hy - .5 - p.r && dx < bd) { bd = dx; pick = p; }
  }
  if (pick) {
    claw.q = 1 - bd / (pick.r * .8);   // grip quality, 1 = dead centre
    claw.ox = pick.x - claw.x; claw.oy = pick.y - hy; claw.oz = pick.z - claw.z;
    claw.held = pick; pick.held = true;
  }
}

// Off-centre grabs and gold prizes slip more often
function slip(dt) {
  const p = claw.held;
  if (!p || (state === 'lift' && claw.t < .25)) return;
  const rate = (.08 + (1 - claw.q) * .9) * (p.rare ? 1.6 : 1);
  if (Math.random() < rate * dt) {
    p.held = false; p.vx = (Math.random() - .5) * .6; p.vz = (Math.random() - .5) * .6; p.vy = 0;
    claw.held = null; claw.open = .5;
    sfx('slip'); pop([p.x, p.y + .4, p.z], '¡Uy!', '#fff6e0');
  }
}

function win(p) {
  const pts = p.rare ? 5 : 1;
  score += pts; won++;
  pop([HOME.x, 1.4, HOME.z], p.rare ? '+5 ¡Dorada!' : '+1', p.rare ? '#ffd23f' : '#80ed99');
  sfx('win'); hud();
}

const vPop = new THREE.Vector3();
function pop(pos, text, col) {
  vPop.set(...pos).project(camera);
  const el = document.createElement('div');
  el.className = 'pop'; el.textContent = text; el.style.color = col;
  el.style.left = (vPop.x + 1) / 2 * innerWidth + 'px'; el.style.top = (1 - vPop.y) / 2 * innerHeight + 'px';
  el.addEventListener('animationend', () => el.remove());
  document.body.append(el);
}

function update(dt) {
  const c = claw;
  switch (state) {
    case 'aim': {
      aimT -= dt;
      c.x = clamp(c.x + ((keys.r ? 1 : 0) - (keys.l ? 1 : 0)) * MOVE * dt, -LIMIT.x, LIMIT.x);
      c.z = clamp(c.z + ((keys.d ? 1 : 0) - (keys.u ? 1 : 0)) * MOVE * dt, -LIMIT.z, LIMIT.z);
      if (aimT <= 0) startDrop();
      break;
    }
    case 'drop': {
      c.len += DROP * dt;
      const hy = headY();
      let hit = hy <= .75;
      for (const p of prizes) if (Math.hypot(p.x - c.x, p.z - c.z) < p.r * .7 && hy - .15 <= p.y + p.r) hit = true;
      if (hit) { state = 'close'; pickGrab(); sfx('clank'); }
      break;
    }
    case 'close':
      c.open = Math.max(0, c.open - dt * 2.2);
      if (c.held) { const k = dt * 6; c.ox *= 1 - k; c.oz *= 1 - k; c.oy += (-.13 - c.held.r - c.oy) * k; }
      if (c.open <= 0) { if (c.held) sfx('grab'); state = 'lift'; c.t = 0; }
      break;
    case 'lift':
      c.len = Math.max(0, c.len - LIFT * dt); c.t += dt; slip(dt);
      if (c.len <= 0) state = 'return';
      break;
    case 'return': {
      const dx = HOME.x - c.x, dz = HOME.z - c.z, d = Math.hypot(dx, dz), s = Math.min(d, MOVE * dt);
      if (d > 1e-4) { c.x += dx / d * s; c.z += dz / d * s; }
      slip(dt);
      if (d < .005) state = 'release';
      break;
    }
    case 'release':
      c.open = Math.min(1, c.open + dt * 2);
      if (c.held && c.open > .35) { c.held.held = false; c.held.vx = c.held.vy = c.held.vz = 0; c.held = null; }
      if (c.open >= 1) { state = 'wait'; c.t = 0; }
      break;
    case 'wait':
      c.t += dt;
      if (c.t > 1.2) {
        if (coins > 0) {
          state = 'idle';
          if (prizes.length < 10) spawn(12, 5);   // restock from the top
        } else gameOver();
        hud();
      }
      break;
  }
  if (c.held) {
    const p = c.held;
    p.x = c.x + c.ox; p.y = headY() + c.oy; p.z = c.z + c.oz; p.vx = p.vy = p.vz = 0;
  }
}

function gameOver() {
  state = 'over';
  const rec = score > best;
  if (rec) { best = score; try { localStorage.setItem(BEST_KEY, best); } catch (e) {} }
  $('ovStats').innerHTML = `Premios: ${won}<br>Puntos: ${score}<br>${rec && score > 0 ? '¡Nuevo récord!' : 'Récord: ' + best}`;
  $('over').hidden = false;
}

let shownTime = '';
function hud() {
  $('hCoins').textContent = coins;
  $('hScore').textContent = score;
  $('hint').hidden = state !== 'idle';
}
function hudTime() {
  const t = state === 'aim' ? String(Math.ceil(aimT)) : '–';
  if (t !== shownTime) { shownTime = t; $('hTime').textContent = t; $('hTime').classList.toggle('low', state === 'aim' && aimT < 5); }
}

// ---------- Sound (tiny synth, no assets) ----------

let ac = null;
function sfx(name) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    const tone = (f, f2, d, type, v, at = 0) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + at);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + at + d);
      g.gain.setValueAtTime(v, t + at); g.gain.exponentialRampToValueAtTime(0.001, t + at + d);
      o.connect(g).connect(ac.destination); o.start(t + at); o.stop(t + at + d + .02);
    };
    switch (name) {
      case 'coin': tone(988, 0, .08, 'square', .05); tone(1319, 0, .25, 'square', .05, .08); break;
      case 'drop': tone(600, 200, .6, 'triangle', .08); break;
      case 'clank': tone(180, 90, .12, 'square', .07); break;
      case 'grab': tone(400, 800, .12, 'triangle', .08); break;
      case 'slip': tone(220, 80, .3, 'sawtooth', .05); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, .18, 'square', .05, i * .09)); break;
    }
  } catch (e) {}
}

// ---------- Input ----------

// Moving while idle spends a coin and starts the round
function press(dir) {
  if (state === 'idle') startRound();
  keys[dir] = true;
}
function dropButton() { if (state === 'idle') startRound(); else startDrop(); }

const KEY_DIR = { ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r', ArrowUp: 'u', w: 'u', ArrowDown: 'd', s: 'd' };
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === ' ' || k === 'Enter' || KEY_DIR[k]) e.preventDefault();
  if (e.repeat) return;
  if (state === 'over') { if (k === ' ' || k === 'Enter') reset(); return; }
  if (KEY_DIR[k]) press(KEY_DIR[k]);
  else if (k === ' ' || k === 'Enter') dropButton();
});
addEventListener('keyup', e => {
  const dir = KEY_DIR[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (dir) keys[dir] = false;
});

for (const b of document.querySelectorAll('#pad button')) {
  const dir = b.dataset.dir;
  b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); b.classList.add('on'); press(dir); });
  const up = () => { keys[dir] = false; b.classList.remove('on'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
}
$('bd').addEventListener('pointerdown', dropButton);
$('again').addEventListener('click', reset);
addEventListener('blur', () => { keys.l = keys.r = keys.u = keys.d = false; });

// ---------- Layout and loop ----------

// Back the camera off until the whole machine fits between the HUD and the controls,
// and shift the view so it is centred in that gap. On wide screens the controls sit
// in the bottom corners, beside the machine, so they take no height.
function fit() {
  const w = innerWidth, h = innerHeight, wide = w / h > 1.2;
  document.body.classList.toggle('wide', wide);
  const topPad = 112, botPad = wide ? 16 : $('controls').offsetHeight + 20, freeH = Math.max(150, h - topPad - botPad);
  renderer.setSize(w, h);
  camera.aspect = w / h;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(3.9 / (t * freeH / h), 3.2 / (t * w / h));
  camera.position.copy(CAM_TARGET).addScaledVector(CAM_DIR, dist);
  camera.lookAt(CAM_TARGET);
  camera.setViewOffset(w, h, 0, (botPad - topPad) / 2, w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', fit);

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000);
  last = now; acc += dt;
  while (acc >= STEP) { update(STEP); physics(STEP, false); acc -= STEP; }
  for (const p of prizes) p.mesh.position.set(p.x, p.y, p.z);
  syncClaw();
  const tick = Math.floor(now / 160);
  for (const [b, i] of bulbs) b.material = (i + tick) % 3 === 0 ? BULB_ON : BULB_OFF;
  hudTime();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// Handle for poking at the game from the console
window.game = { get state() { return state; }, get claw() { return claw; }, get prizes() { return prizes; }, get score() { return score; }, startRound, startDrop };

reset();
fit();
requestAnimationFrame(frame);
</script>
</body>
