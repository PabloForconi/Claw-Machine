}
let newSeason = null;   // the gallery season just opened, to tell about on the next card
let lostTo = null;      // 'skull' when the skull lost the level (otherwise it was the coins)

function update(dt) {
  const c = claw;
  if (endT !== null && state !== 'over' && (endT -= dt) <= 0) levelCard(endWon);
  if (coinFlash > 0 && (coinFlash -= dt) <= 0) hud();
  // Where the carriage wants to go; it only moves while aiming and on the way back
  let tx = 0, tz = 0;
  if (state === 'aim') {
    tx = ((keys.r ? 1 : 0) - (keys.l ? 1 : 0)) * MOVE;
    tz = ((keys.d ? 1 : 0) - (keys.u ? 1 : 0)) * MOVE;
    if (stick.mag > 0) { tx = stick.x * stick.mag * MOVE; tz = stick.y * stick.mag * MOVE; }   // the pad
  } else if (state === 'return') {
    // Brake in time to stop over the hole
    const dx = HOME.x - c.x, dz = HOME.z - c.z, d = Math.hypot(dx, dz);
    const s = Math.min(MOVE, Math.sqrt(2 * ACC * .8 * d));
    if (d > 1e-4) { tx = dx / d * s; tz = dz / d * s; }
  }
  driveCarriage(tx, tz, dt);

  switch (state) {
    case 'aim':
      aimT -= dt;
      if (aimT <= 0) startDrop();
      break;
    case 'drop':
      // The drop takes a fixed time, as on a real machine: touching a prize on the way doesn't stop
      // it. Whatever the claw lands on, it rests there with its weight and sinks into the pile as it
      // pushes prizes aside (held in place sideways once landed, see swingHead). The winch keeps
      // letting out up to DROP_SLACK of loose cable, which bows out above the claw.
      c.t += dt;
      c.open = Math.min(1, c.open + OPEN_RATE * dt);   // it opens as it starts down (closed at the top)
      c.winch = Math.min(DROP, c.winch + WINCH_ACC * dt);
      c.len = Math.min(L_MAX, c.len + c.winch * dt, c.dist + DROP_SLACK);
      // Landed means the cable is slack because the claw rests on something it touches. Slack alone
      // isn't enough: a swinging claw slackens its elastic cable for a moment at each end of the swing,
      // and taking that for a landing pinned it in mid-air and killed the sway.
      if (!c.landed && c.len - c.dist > .03 && c.touching) { c.landed = [c.head.x, c.head.z]; sfx('clank'); }
      if (c.t >= DROP_TIME + DROP_REST) { state = 'close'; c.winch = 0; c.closeV = 0; pickTarget(); }
      break;
    case 'close': {
      // The motor closes all the way: each finger gives way against whatever it meets, prizes and the
      // hole walls alike (see flexFingers). Then it keeps squeezing for CLOSE_HOLD, so fingers that
      // had given way on the pile while landing get time to work their way back in.
      // It closes hard: the motor speeds up to CLOSE_SPEED, so the fingers sweep in fast and shove
      // what they meet (it used to close at a steady 2.2, which felt soft), and it clacks shut.
      c.closeV = Math.min(CLOSE_SPEED, (c.closeV || 0) + CLOSE_ACC * dt);
      const wasOpen = c.open > 0;
      c.open = Math.max(0, c.open - dt * c.closeV);
      if (wasOpen && c.open === 0) sfx('clack');
      c.closedFor = c.open > 0 ? 0 : (c.closedFor || 0) + dt;
      if (c.closedFor >= CLOSE_HOLD) {
        c.closedFor = 0;
        grabTarget();
        if (c.held) sfx('grab');
        state = 'lift'; c.t = 0;   // the winch first reels in the slack, so the cable straightens before it pulls
      }
      break;
    }
    case 'lift': {
      // A catch to be lost at the top: the winch overruns its stop and slams the claw's box into the
      // carriage, which ends the lift (see hitTop)
      const slam = c.held && c.lose === 'top';
      c.winch = Math.min(LIFT, c.winch + WINCH_ACC * dt);
      c.len = Math.max(slam ? 0 : L_MIN, c.len - c.winch * dt); c.t += dt;
      if (!slam && c.len <= L_MIN) { state = 'return'; c.winch = 0; sfx('clank'); }
      break;
    }
    case 'return':
      slip(dt);
      if (Math.hypot(HOME.x - c.x, HOME.z - c.z) < .01 && Math.hypot(c.vx, c.vz) < .05) {
        c.x = HOME.x; c.z = HOME.z; c.vx = c.vz = 0; state = 'settle'; c.t = 0;
      }
      break;
    case 'settle': {
      // Wait over the hole for the swing to die down (up to a second) before letting go; with nothing
      // in the claw there is nothing to drop straight, so it opens right away
      c.t += dt; slip(dt);
      const h = c.head;
      if (!c.held || Math.hypot(h.x - c.x, h.z - c.z) < .05 && Math.hypot(h.vx, h.vz) < .25 || c.t > 1) {
        // (already open when a lost catch made it let go on the way: then there is nothing to open)
        if (c.open >= 1) { state = 'wait'; c.t = 0; c.shutIn = OPEN_HOLD; c.closeV = 0; }
        else { state = 'release'; c.openV = 0; sfx('motor'); }
      }
      break;
    }
    case 'release':
      c.slipping = null;
      c.openV = Math.min(RELEASE_SPEED, c.openV + RELEASE_ACC * dt);
      loosen(dt, c.openV);
      if (c.open >= 1) { state = 'wait'; c.t = 0; c.shutIn = OPEN_HOLD; c.closeV = 0; sfx('clunk'); c.head.vy += JOLT; }
      break;
    case 'wait':
      c.t += dt;
      if (c.t > WAIT_TIME && endT === null) {
        // Out of coins, the last round is judged once its prize is in: a streak may still win a coin
        const quiet = c.t > LOSE_WAIT || prizes.every(p => Math.hypot(p.vx, p.vy, p.vz) < .3 && !(p.x < HOLE.x && p.z > HOLE.z));
        if (coins <= 0 && !FREE_PLAY && quiet) endRound();
        if (coins > 0 || FREE_PLAY) {
          state = 'idle';
          // Restock from the top when the pile runs low or is out of a kind the level still needs
          const miss = needed().length;
          if (prizes.length < RESTOCK_BELOW || miss) spawn(Math.max(PRIZE_COUNT - prizes.length, miss), 5);
          hud();
        // Out of coins: the level is lost, once nothing is still on its way into the hole (or after
        // LOSE_WAIT at most), so a last prize dropping in still counts
        } else if (quiet) levelCard(false);
      }
      break;
  }
  // Empty and done, it shuts again, so it is closed at the top for the next round
  if (state === 'wait' || state === 'idle' || state === 'aim') restClose(dt);
  c.dist = swingHead(dt);
  cableStep(dt);
  if (c.held) carry(dt); else flexFingers(dt);
}

// After letting go the claw stays open for OPEN_HOLD, then the motor shuts it the way it grabs: it
// speeds up to CLOSE_SPEED and stops with a clack and a jolt. The next round can start meanwhile; a
// drop opens it again.
function restClose(dt) {
  const c = claw;
  if (c.open <= 0 || (c.shutIn = (c.shutIn || 0) - dt) > 0) return;
  if (!c.closeV) sfx('motor');
  c.closeV = Math.min(CLOSE_SPEED, (c.closeV || 0) + CLOSE_ACC * dt);
  c.open = Math.max(0, c.open - c.closeV * dt);
  if (c.open === 0) { c.closeV = 0; sfx('clack'); c.head.vy += JOLT * .6; }
}

// The card over the machine (#over): a title, some text and a main button, plus "Niveles" unless it is
// a level's opening tip
let cardMain = null;
function card({ title, html, main, onMain, levels = false }) {
  $('ovTitle').textContent = title; $('ovStats').innerHTML = html; $('again').textContent = main;
  $('ovLevels').hidden = !levels; cardMain = onMain; $('over').hidden = false;
}
const closeCard = () => { $('over').hidden = true; };

// A level is over: cleared (with its stars for the coins left, and on to the next), or lost, for lack
// of coins (with what was still missing) or to the skull, with a retry. The stars and the unlocking are
// saved here. The daily challenge keeps its own record (see dailyDone).
function levelCard(cleared) {
  state = 'over'; endT = null; stickEnd();
  const retry = () => level < 0 ? startDaily() : startLevel(level);
  if (cleared) {
    const st = starsFor(coins), last = level === LEVELS.length - 1;
    let html = starsHtml(st) + '<br>' + (coins ? `Te sobraron ${coins} ficha${coins === 1 ? '' : 's'}` : '¡Justo con la última ficha!');
    if (st < 3) html += `<br><small>3 ★ con ${lv.stars[1]} fichas de sobra</small>`;
    if (level < 0) html += `<br>Racha: ${dailyDone(st)} día${daily.streak === 1 ? '' : 's'} seguidos`;
    else {
      bestStars[level] = Math.max(bestStars[level] || 0, st);
      levelsDone = Math.max(levelsDone, level + 1);
      try { localStorage.setItem(LEVELS_KEY, levelsDone); localStorage.setItem(STARS_KEY, JSON.stringify(bestStars)); } catch (e) {}
      if (last) html += '<br>¡Completaste todos los niveles!';
    }
    if (newSeason) { html += `<br>¡Nueva temporada en la galería: ${newSeason}!`; newSeason = null; }
    const next = level >= 0 && !last;
    card({ title: level < 0 ? '¡Desafío superado!' : `¡Nivel ${level + 1} superado!`, html, main: next ? 'Siguiente nivel' : 'Jugar de nuevo', onMain: next ? () => startLevel(level + 1) : retry, levels: true });
  } else {
    const skull = lostTo === 'skull';
    const html = skull ? 'Cayó la calavera al hueco: perdiste el nivel.'
      : 'Te faltaron:<br>' + lv.goal.filter(goalLeft).map(g => `<span class="goal">${capHtml(g.key)} ${goalLeft(g)}</span>`).join('');
    card({ title: skull ? '¡La calavera!' : '¡Sin fichas!', html, main: 'Reintentar', onMain: retry, levels: true });
  }
  sfx(cleared ? 'win' : 'clunk');
}
// Stars as ★★☆ (the ones not won dimmed)
const starsHtml = (n, cls = 'stars') => `<span class="${cls}">${'★'.repeat(n)}<i>${'★'.repeat(3 - n)}</i></span>`;

// A little CSS capsule of a kind ('any' is all the colours; a special one shows its sign)
const capHtml = key => key === 'any' ? '<span class="cap mini any"></span>'
  : `<span class="cap mini${SPECIAL[key]?.sign ? ' sign' : ''}" style="--c:${kindCss(key)}${SPECIAL[key]?.sign ? `;--fg:${SPECIAL[key].fg}" data-sign="${SPECIAL[key].sign}` : ''}"></span>`;

// Update the scoreboard on the base; it is only repainted when something on it changes. While idle its
// hint says how to play, or that one more catch wins a coin when a streak is going.
function hud() {
  const hint = state !== 'idle' ? '' : streak === STREAK_N - 1 ? '¡Uno más seguido y ganás una ficha!' : FREE_PLAY ? 'Mové el pad o tocá ¡BAJAR!' : 'Mové el pad o tocá ¡BAJAR! (1 ficha)';
  const next = { coins: FREE_PLAY ? '∞' : coins, goal: level + ':' + lv.goal.map(goalLeft).join(), time: state === 'aim' ? String(Math.ceil(aimT)) : '–', low: state === 'aim' && aimT < 5, hint,
    flash: coinFlash > 0 && board.flashColor };
  if (Object.keys(next).some(k => next[k] !== board[k])) { Object.assign(board, next); boardTex.repaint(); }
}
const hudTime = hud;

// ---------- Sound (tiny synth, no assets) ----------

let ac = null;
function sfx(name) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    const tone = (f, f2, d, type, v, at = 0) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + at);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + at + d);
      g.gain.setValueAtTime(v, t + at); g.gain.exponentialRampToValueAtTime(0.001, t + at + d);
      o.connect(g).connect(ac.destination); o.start(t + at); o.stop(t + at + d + .02);
    };
    switch (name) {
      case 'coin': tone(988, 0, .08, 'square', .05); tone(1319, 0, .25, 'square', .05, .08); break;
      case 'drop': tone(600, 200, .6, 'triangle', .08); break;
      case 'clank': tone(180, 90, .12, 'square', .07); break;
      case 'clack': tone(320, 140, .07, 'square', .08); tone(90, 60, .1, 'triangle', .1); break;
      case 'clunk': tone(200, 90, .09, 'square', .08); tone(70, 45, .14, 'triangle', .12); break;
      case 'motor': tone(110, 170, .3, 'sawtooth', .025); break;
      case 'grab': tone(400, 800, .12, 'triangle', .08); break;
      case 'slip': tone(220, 80, .3, 'sawtooth', .05); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, .18, 'square', .05, i * .09)); break;
      case 'boom': tone(160, 40, .45, 'sawtooth', .09); tone(60, 30, .5, 'triangle', .14); break;
    }
  } catch (e) {}
}

// ---------- Input ----------

// Moving while idle spends a coin and starts the round
function press(dir) {
  if (state === 'idle') startRound();
  keys[dir] = true;
}
function dropButton() { if (state === 'idle') startRound(); else startDrop(); }

const KEY_DIR = { ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r', ArrowUp: 'u', w: 'u', ArrowDown: 'd', s: 'd' };
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  // In the gallery and the levels the keys don't play (Escape goes back to the machine)
  if (screenOpen()) { if (k === 'Escape') { if (!$('levels').hidden) closeLevels(); else closeGallery(); } return; }
  if (k === ' ' || k === 'Enter' || KEY_DIR[k]) e.preventDefault();
  if (e.repeat) return;
  if (!$('over').hidden) { if (k === ' ' || k === 'Enter') $('again').click(); return; }
  if (KEY_DIR[k]) press(KEY_DIR[k]);
  else if (k === ' ' || k === 'Enter') dropButton();
});
addEventListener('keyup', e => {
  const dir = KEY_DIR[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (dir) keys[dir] = false;
});

// The pad, a joystick like the maze game's (it replaced a four-button d-pad, October 2026). Its base
// jumps to where the finger lands inside the pad and the knob follows the finger, up to STICK_R away:
// the direction steers the claw (up = away from you) and how far it is pushed sets the speed, with a
// small dead zone (STICK_DEAD). Touching it while idle starts the round, like the arrow keys.
const STICK_R = 52, STICK_DEAD = .18;
const stick = { id: null, bx: 0, by: 0, x: 0, y: 0, mag: 0 };
const $pad = $('pad'), $stick = $('stick'), $knob = $('knob');
function stickMove(cx, cy) {
  let dx = cx - stick.bx, dy = cy - stick.by;
  const d = Math.hypot(dx, dy);
  if (d > STICK_R) { dx *= STICK_R / d; dy *= STICK_R / d; }
  $knob.style.transform = `translate(${dx}px, ${dy}px)`;
  const m = Math.min(1, d / STICK_R);
  stick.mag = m < STICK_DEAD ? 0 : (m - STICK_DEAD) / (1 - STICK_DEAD);
  stick.x = d > 0 ? dx / Math.max(d, STICK_R) : 0; stick.y = d > 0 ? dy / Math.max(d, STICK_R) : 0;
}
function stickEnd() {
  stick.id = null; stick.mag = 0; $stick.style.left = $stick.style.top = ''; $knob.style.transform = '';
}
$pad.addEventListener('pointerdown', e => {
  if (stick.id !== null) return;
  e.preventDefault();
  try { $pad.setPointerCapture(e.pointerId); } catch (_) {}
  const r = $pad.getBoundingClientRect();
  stick.id = e.pointerId; stick.bx = e.clientX; stick.by = e.clientY;
  $stick.style.left = (e.clientX - r.left) + 'px'; $stick.style.top = (e.clientY - r.top) + 'px';
  stickMove(e.clientX, e.clientY);
  if (state === 'idle') startRound();
});
$pad.addEventListener('pointermove', e => { if (e.pointerId === stick.id) { e.preventDefault(); stickMove(e.clientX, e.clientY); } });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) $pad.addEventListener(ev, e => { if (e.pointerId === stick.id) stickEnd(); });
$pad.addEventListener('contextmenu', e => e.preventDefault());
$('bd').addEventListener('pointerdown', dropButton);

// Settings (the gear, top right): the pad can go on the right and the drop button on the left, for
// right-handed players. Kept in localStorage. The game holds still while the panel is open.
const SWAP_KEY = 'clawMachine.padRight';
const CLEAR_DELAY = .9, LOSE_WAIT = 3;   // seconds: before a cleared level's card; most a lost one waits for a falling prize
function setSwap(on) {
  document.body.classList.toggle('swap', on); $('swap').checked = on;
  try { localStorage.setItem(SWAP_KEY, on ? '1' : '0'); } catch (e) {}
}
try { setSwap(localStorage.getItem(SWAP_KEY) === '1'); } catch (e) {}
$('swap').addEventListener('change', e => setSwap(e.target.checked));
$('gear').addEventListener('click', () => { $('opts').hidden = false; paused = true; stickEnd(); });
$('optsOk').addEventListener('click', () => { $('opts').hidden = true; paused = false; });
$('again').addEventListener('click', () => cardMain && cardMain());
$('ovLevels').addEventListener('click', () => { $('over').hidden = true; openLevels(); });

// The daily challenge: a level made from the date (the same all day, its first pile too), to play on
// its own. It keeps the most stars won today and how many days in a row it was cleared. The user asked
// for it to play alone, without comparing with anyone (October 2026).
const DAILY_KEY = 'clawMachine.daily';
let daily = { day: '', stars: 0, streak: 0 };
try { daily = { ...daily, ...JSON.parse(localStorage.getItem(DAILY_KEY)) }; } catch (e) {}
const dayKey = d => d.toLocaleDateString('sv');   // YYYY-MM-DD, local time
const today = () => dayKey(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); };
const hashStr = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 2654435761) >>> 0, 2166136261);
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// Two or three colours (sometimes a gold one), one or two of each, with one or two twists
function genDaily(day) {
  const r = mulberry32(hashStr(day)), pick = a => a.splice(r() * a.length | 0, 1)[0];
  const names = KINDS.slice(0, 5).map(k => k.name), goal = [];
  for (let i = 0, n = 2 + (r() < .5); i < n; i++) goal.push([pick(names), 1 + (r() < .5)]);
  if (r() < .3) goal[0] = ['Dorada', 1];
  const l = { goal }, twists = ['order', 'small', 'big', 'bombs', 'skull', 'bonus', 'pedestal'];
  for (let i = 0, n = 1 + (r() < .5); i < n; i++) {
    const t = pick(twists);
    if (t === 'order') l.order = true;
    if (t === 'small') l.size = [.25, .27];
    if (t === 'big' && !l.size) l.size = [.34, .36];
    if (t === 'bombs') l.traps = { ...l.traps, bomb: 2 };
    if (t === 'skull') l.traps = { ...l.traps, skull: 1 };
    if (t === 'bonus') l.bonus = 1;
    // (the first colour, just one, goes on a pedestal)
    if (t === 'pedestal') { goal[0][1] = 1; l.stands = 'one'; l.onTop = [goal[0][0]]; }
  }
  l.coins = goal.reduce((s, [, n]) => s + n, 0) * 3 + 2 - (l.bonus ? 2 : 0);
  return cookLevel(l);
}
function startDaily() {
  const day = today();
  rnd = mulberry32(hashStr(day) + 1);
  startLevel(-1, genDaily(day));
}
// The daily challenge cleared with st stars: today's best and the run of days. Returns the run.
function dailyDone(st) {
  const day = today();
  if (daily.day !== day) { daily.streak = daily.day === yesterday() ? daily.streak + 1 : 1; daily.day = day; daily.stars = 0; }
  daily.stars = Math.max(daily.stars, st);
  try { localStorage.setItem(DAILY_KEY, JSON.stringify(daily)); } catch (e) {}
  return daily.streak;
}

// What a level has besides its goal, as little tags for the levels screen
function levelTags(l, boss) {
  const t = [];
  if (boss) t.push('<span class="tag boss">JEFE</span>');
  if (l.order) t.push('<span class="tag">en orden</span>');
  if (l.size) t.push(`<span class="tag">${l.size[1] <= .28 ? 'chicas' : l.size[0] >= .33 ? 'grandes' : 'de varios tamaños'}</span>`);
  for (const [k, n] of Object.entries(l.traps || {})) t.push(`<span class="tag">${capHtml(k)}${k === 'bomb' ? (n > 1 ? 'bombas' : 'bomba') : 'calavera'}</span>`);
  if (l.bonus) t.push(`<span class="tag">${capHtml('bonus')}fichas</span>`);
  if (l.stands) t.push(`<span class="tag">${{ one: 'pedestal', two: '2 pedestales', three: '3 pedestales', stairs: 'escalera' }[l.stands]}</span>`);
  if (l.bury) t.push('<span class="tag">enterrada</span>');
  return t.length ? `<span class="tags">${t.join('')}</span>` : '';
}
const goalHtml = l => l.goal.map(g => `<span>${capHtml(g.key)}${g.key === 'any' ? 'Cualquiera ' : ''}×${g.n}</span>`).join(l.order ? '<span>›</span>' : '');

// The levels screen (the star, top left): the daily challenge, then every level with its goal, coins
// and twists; cleared ones show their stars, the first not cleared is open to play and the rest are
// locked. Picking one starts it (the one being played just goes back to it, unless it is over). The
// game holds still while it is open.
function openLevels() {
  const total = bestStars.reduce((s, v) => s + (v || 0), 0), dl = genDaily(today());
  const run = daily.day === today() || daily.day === yesterday() ? daily.streak : 0;
  $('lvlSub').innerHTML = `Superaste ${levelsDone} de ${LEVELS.length} · ★ ${total} de ${LEVELS.length * 3}`;
  $('lvlList').innerHTML = `<button class="lvl daily${level < 0 ? ' cur' : ''}" data-i="-1"><span class="n">☀</span><span class="goal"><b>Desafío del día</b>${goalHtml(dl)}` +
    `<span class="coins">${dl.coins} fichas${run ? ` · racha: ${run} día${run === 1 ? '' : 's'}` : ''}</span>${levelTags(dl)}</span>` +
    `<span class="st">${daily.day === today() ? starsHtml(daily.stars, 'stars sm') : '▶'}</span></button>` +
    LEVELS.map((l, i) => {
      const locked = i > levelsDone, st = i < levelsDone ? starsHtml(bestStars[i] || 1, 'stars sm') : locked ? '🔒' : '▶';
      return `<button class="lvl${i === level ? ' cur' : ''}${locked ? ' locked' : ''}" data-i="${i}"${locked ? ' disabled' : ''}>` +
        `<span class="n">${i + 1}</span><span class="goal">${goalHtml(l)}<span class="coins">${l.coins} fichas</span>${levelTags(l, (i + 1) % 5 === 0)}</span><span class="st">${st}</span></button>`;
    }).join('');
  $('levels').hidden = false; paused = true; stickEnd();
  keys.l = keys.r = keys.u = keys.d = false;
}
function closeLevels() {
  $('levels').hidden = true; paused = false;
  if (state === 'over') $('over').hidden = false;   // back to the card of the level that ended
}
$('lvlList').addEventListener('click', e => {
  const b = e.target.closest('.lvl');
  if (!b || b.disabled) return;
  const i = +b.dataset.i;
  $('levels').hidden = true; paused = false;
  if (i !== level || state === 'over') i < 0 ? startDaily() : startLevel(i);
});
$('lvlBtn').addEventListener('click', openLevels);
$('lvlBack').addEventListener('click', closeLevels);
const screenOpen = () => !$('gallery').hidden || !$('levels').hidden;

// The gallery (the capsule button, top left): a screen of its own with a shelf per season, every kind
// with how many were won, from the collection. Kinds not won yet show as dark silhouettes; a season not
// open yet is locked, with what opens it. The game holds still and isn't drawn while it is open.
function openGallery() {
  const total = Object.values(collection).reduce((s, v) => s + v, 0), open = seasonsOpen();
  $('galTotal').textContent = total ? `Atrapaste ${total} premio${total === 1 ? '' : 's'}` : 'Todavía no atrapaste ningún premio';
  $('shelf').innerHTML = SEASONS.map((s, i) => {
    const locked = i >= open, have = KINDS.filter(k => collection[colKey(s.id, k.key)] > 0).length;
    const slots = KINDS.map(k => {
      const n = collection[colKey(s.id, k.key)] || 0;
      return `<div class="slot${n ? '' : ' none'}"><div class="cap ${s.id}${k.key === 'gold' ? ' gold' : ''}" style="--c:${k.css}"></div>` +
        `<span class="num">${locked ? '?' : n}</span><span class="name">${k.name}</span></div>`;
    }).join('');
    return `<section class="season${locked ? ' locked' : ''}"><h3>Temporada ${i + 1} · ${s.name}<span>${locked ? '🔒' : have === KINDS.length ? '✓' : `${have}/${KINDS.length}`}</span></h3>` +
      (locked ? `<p class="sub">Atrapá una de cada en la temporada ${i} para abrirla</p>` : '') + `<div class="shelf">${slots}</div></section>`;
  }).join('');
  $('galDots').innerHTML = SEASONS.map(() => '<i></i>').join('');
  $('galBtn').classList.remove('new');
  $('gallery').hidden = false; paused = true; stickEnd();
  keys.l = keys.r = keys.u = keys.d = false;
  showSeason(open - 1, false);   // it opens on the newest season
}
// The seasons' carousel: which one is in the middle, going to one, and the dots and arrows to match
const seasonEls = () => [...$('shelf').children];
function seasonNow() {
  const sh = $('shelf'), mid = sh.scrollLeft + sh.clientWidth / 2;
  let best = 0, bd = 1e9;
  seasonEls().forEach((el, i) => { const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });
  return best;
}
// seasonIdx is the one shown: set when going to one, and from the scroll position once a swipe stops
let seasonIdx = 0, seasonSettle = 0;
function showSeason(i, smooth = true) {
  const sh = $('shelf'), el = seasonEls()[i];
  if (!el) return;
  seasonIdx = i;
  sh.scrollTo({ left: el.offsetLeft - (sh.clientWidth - el.offsetWidth) / 2, behavior: smooth ? 'smooth' : 'instant' });
  markSeason(i);
}
function markSeason(i) {
  seasonEls().forEach((el, k) => el.classList.toggle('on', k === i));
  [...$('galDots').children].forEach((d, k) => d.classList.toggle('on', k === i));
  $('galPrev').disabled = i === 0; $('galNext').disabled = i === SEASONS.length - 1;
}
$('shelf').addEventListener('scroll', () => { clearTimeout(seasonSettle); seasonSettle = setTimeout(() => markSeason(seasonIdx = seasonNow()), 150); });
$('shelf').addEventListener('click', e => { const el = e.target.closest('.season'); if (el && !el.classList.contains('on')) showSeason(seasonEls().indexOf(el)); });
$('galPrev').addEventListener('click', () => showSeason(Math.max(0, seasonIdx - 1)));
$('galNext').addEventListener('click', () => showSeason(Math.min(SEASONS.length - 1, seasonIdx + 1)));
// From one screen to the other: the gallery and the levels each have a button for the other
$('galToLvl').addEventListener('click', () => { $('gallery').hidden = true; openLevels(); });
$('lvlToGal').addEventListener('click', () => { $('levels').hidden = true; openGallery(); });
function closeGallery() {
  $('gallery').hidden = true; paused = false;
  if (state === 'over') $('over').hidden = false;   // back to the card of the level that ended
}
$('galBtn').style.setProperty('--c', KINDS[0].css);
$('galBtn').addEventListener('click', openGallery);
$('galBack').addEventListener('click', closeGallery);
addEventListener('blur', () => { keys.l = keys.r = keys.u = keys.d = false; });

// ---------- Layout and loop ----------

// Frame the machine: the camera backs off just enough for the cabinet's corners (FIT_CORNERS) to fit
// between the top of the screen and the controls, and the view is shifted so the machine sits centred
// in that gap. The scoreboard is on the machine itself, so nothing takes room at the top. On wide
// screens the controls sit in the bottom corners, beside the machine, so they take no height.
const FIT_CORNERS = [];
for (const x of [-2.4, 2.4]) for (const y of [-1.72, 5.45]) for (const z of [-1.9, 1.9]) FIT_CORNERS.push(new THREE.Vector3(x, y, z));
function fit() {
  const w = innerWidth, h = innerHeight, wide = w / h > 1.2;
  document.body.classList.toggle('wide', wide);
  const topPad = 8, botPad = wide ? 8 : $('controls').offsetHeight + 16, freeH = Math.max(150, h - topPad - botPad);
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.clearViewOffset();
  const v = new THREE.Vector3();
  // The machine's extent on screen, in pixels, with the camera this far back
  const extent = dist => {
    camera.position.copy(CAM_TARGET).addScaledVector(CAM_DIR, dist);
    camera.lookAt(CAM_TARGET); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    let top = 1e9, bottom = -1e9, width = 0;
    for (const p of FIT_CORNERS) {
      v.copy(p).project(camera);
      const y = (1 - v.y) / 2 * h;
      top = Math.min(top, y); bottom = Math.max(bottom, y); width = Math.max(width, Math.abs(v.x) * w);
    }
    return { top, bottom, width };
  };
  let lo = 3, hi = 80;
  for (let i = 0; i < 30; i++) {
    const m = (lo + hi) / 2, e = extent(m);
    if (e.bottom - e.top > freeH || e.width > w - 16) lo = m; else hi = m;
  }
  const e = extent(hi);
  camera.setViewOffset(w, h, 0, (e.top + e.bottom) / 2 - (topPad + freeH / 2), w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', fit);

let last = performance.now(), acc = 0, paused = false;   // paused: while the settings are open, or for inspecting with game.step
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000);
  last = now; acc = paused ? 0 : acc + dt;
  while (acc >= STEP) { update(STEP); physics(STEP, false); acc -= STEP; }
  if (!screenOpen()) draw(now);
  requestAnimationFrame(frame);
}

function draw(now) {
  for (const p of prizes) p.mesh.position.set(p.x, p.y, p.z);
  syncClaw();
  const tick = Math.floor(now / 160);
  for (const [b, i] of bulbs) b.material = (i + tick) % 3 === 0 ? BULB_ON : BULB_OFF;
  hudTime();
  renderer.render(scene, camera);
}

// Handle for poking at the game from the console
window.game = { get state() { return state; }, get paused() { return paused; }, set paused(v) { paused = v; }, get claw() { return claw; }, get prizes() { return prizes; }, get score() { return score; }, get level() { return level; }, get got() { return got; }, get collection() { return collection; }, startLevel, startDaily, startRound, startDrop, segments, cable,
  // Run n simulation steps right now, without waiting for frames (fast, repeatable tests)
  step(n = 1) { for (let i = 0; i < n; i++) { update(STEP); physics(STEP, false); } },
  // Draw the current state right now (the browser pane may not be asking for frames)
  draw() { draw(performance.now()); },
  // Look at a point from close up (to inspect the claw); fit() puts the normal view back
  closeUp(x, y, z, dist = 1.6) {
    camera.clearViewOffset(); camera.position.set(x + dist * .35, y + dist * .45, z + dist);
    camera.lookAt(x, y, z); camera.updateProjectionMatrix(); draw(performance.now());
  },
  fit };

reset();
fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
